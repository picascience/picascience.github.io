<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
<defs>
<!-- Ciel crépuscule : violet nuit → mauve → orange -->
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#26123f"/><stop offset=".55" stop-color="#a3447a"/><stop offset="1" stop-color="#f7a05c"/></linearGradient>
<radialGradient id="hl" cx=".3" cy=".15" r=".8"><stop offset="0" stop-color="#fff" stop-opacity=".2"/><stop offset=".6" stop-color="#fff" stop-opacity="0"/></radialGradient>
<radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fde68a" stop-opacity=".95"/><stop offset=".35" stop-color="#fbbf6a" stop-opacity=".45"/><stop offset="1" stop-color="#fbbf6a" stop-opacity="0"/></radialGradient>
<filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".28"/></filter>
</defs>
<rect width="512" height="512" fill="url(#bg)"/>
<rect width="512" height="512" fill="url(#hl)"/>
<g transform="translate(256 262) scale(1.24) translate(-250 -300)">
<g filter="url(#sh)">
  <!-- Île flottante isométrique : dessus, deux faces, pointe rocheuse -->
  <path d="M256 250 L392 318 L256 386 L120 318 Z" fill="#fff4e4"/>
  <path d="M120 318 L256 386 L256 420 L120 352 Z" fill="#f6c9a6"/>
  <path d="M392 318 L256 386 L256 420 L392 352 Z" fill="#d98d78"/>
  <path d="M120 352 L256 420 L392 352 L300 430 L256 476 L214 428 Z" fill="#8f5a86" opacity=".9"/>
  <!-- Brasero allumé sur l'île -->
  <path d="M322 312 l12 -6 l12 6 l-12 6 Z" fill="#fde68a"/>
  <path d="M334 300 c-9 -12 -2 -24 4 -32 c1 10 9 14 6 24 c-2 6 -6 9 -10 8 Z" fill="#fde68a"/>
</g>
<!-- L'orbe et son halo -->
<circle cx="236" cy="222" r="104" fill="url(#glow)"/>
<circle cx="236" cy="222" r="40" fill="#fff"/>
<circle cx="236" cy="222" r="40" fill="none" stroke="#fde68a" stroke-width="10" opacity=".9"/>
<!-- Traînée de lumière -->
<path d="M182 252 Q140 270 104 262" stroke="#fde68a" stroke-width="16" fill="none" stroke-linecap="round" opacity=".75"/>
<path d="M176 230 Q142 236 118 226" stroke="#fff" stroke-width="10" fill="none" stroke-linecap="round" opacity=".5"/>
</g>
</svg>

<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Marche Unie</title>
<style>
:root{--bg:#f1eee7;--ink:#1f2430;--mut:#7a7f8c;--blue:#2f6fe4;--red:#e2493b;--gold:#e0a526;--card:#fffdf8;--line:#dcd7cc}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.scr{position:fixed;inset:0;display:none;flex-direction:column;z-index:5}
.scr.on{display:flex}
.pad{padding:calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 34px)}
#menu{background:var(--bg);align-items:center;justify-content:center;gap:10px;overflow:auto}
#menu h1{margin:0;font-size:38px;letter-spacing:4px;font-weight:900}
#menu h1 b{color:var(--blue)}
#menu .sub{color:var(--mut);margin:-4px 0 18px;font-size:14px}
.big{width:min(330px,86vw);padding:14px 16px;border-radius:14px;background:var(--card);border:1.5px solid var(--line);text-align:left;display:flex;align-items:center;gap:12px;box-shadow:0 2px 0 var(--line)}
.big:active{transform:translateY(2px);box-shadow:none}
.big .t{font-weight:800;font-size:16px}.big .d{font-size:12px;color:var(--mut)}
.big svg{flex:none}
.foot{font-size:11px;color:var(--mut);margin-top:14px;text-align:center}
.lnk{color:var(--mut);font-size:12px;text-decoration:underline;margin-top:4px}
/* level list */
#levels{background:var(--bg)}
.hdr{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.hdr h2{margin:0;font-size:20px;flex:1}
.back{width:38px;height:38px;border-radius:10px;background:var(--card);border:1.5px solid var(--line);font-size:20px;font-weight:700}
.gold{font-weight:800;color:#9a6c00;background:#fff4d6;border:1.5px solid #f1d58c;padding:6px 10px;border-radius:10px;font-size:14px;white-space:nowrap}
#lvGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px;overflow:auto;padding-bottom:20px}
.lv{background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:10px 8px;text-align:center;min-height:92px}
.lv .n{font-size:22px;font-weight:900}.lv .nm{font-size:11px;color:var(--mut);line-height:1.2;margin-top:2px;min-height:26px}
.lv .st{font-size:15px;letter-spacing:2px;color:#d6d0c2}.lv .st i{font-style:normal;color:var(--gold)}
.lv.lock{opacity:.4}
.lv.next{border-color:var(--blue);box-shadow:0 0 0 2px #2f6fe433}
/* HUD */
#hud{pointer-events:none;z-index:4;display:flex}
#hud>*{pointer-events:auto}
#top{position:absolute;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top) + 8px) 10px 6px;display:flex;align-items:center;gap:8px;background:linear-gradient(var(--bg) 70%,#f1eee700)}
#top .ttl{flex:1;min-width:0;font-weight:800;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#top .ttl small{display:block;font-weight:500;color:var(--mut);font-size:11px}
.chip{padding:7px 10px;border-radius:10px;background:var(--card);border:1.5px solid var(--line);font-weight:700;font-size:13px;white-space:nowrap}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip.blue{background:var(--blue);color:#fff;border-color:var(--blue)}
.chip.redc{background:var(--red);color:#fff;border-color:var(--red)}
.chip:disabled{opacity:.35}
#bar{position:absolute;left:10px;right:10px;top:calc(env(safe-area-inset-top) + 54px);display:none;align-items:center;gap:8px;font-weight:800;font-size:13px}
#bar .b{flex:1;height:8px;border-radius:5px;background:var(--red);overflow:hidden}
#bar .b i{display:block;height:100%;background:var(--blue);width:50%}
#bar .cb{color:var(--blue)}#bar .cr{color:var(--red)}
#bot{position:absolute;left:0;right:0;bottom:0;padding:8px 8px calc(env(safe-area-inset-bottom) + 32px);background:linear-gradient(#f1eee700,var(--bg) 22%);display:flex;flex-direction:column;gap:7px}
.row{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;align-items:center}
.row::-webkit-scrollbar{display:none}
.pal{flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:58px;height:58px;border-radius:12px;background:var(--card);border:1.5px solid var(--line);font-size:11px;font-weight:800;gap:2px;position:relative}
.pal.on{border-color:var(--blue);box-shadow:0 0 0 2px var(--blue) inset}
.pal.off{opacity:.35}
.pal .c{font-size:10px;color:var(--mut);font-weight:700}
.sep{width:1px;height:24px;background:var(--line);flex:none}
.fight{flex:none;margin-left:auto;padding:12px 20px;border-radius:12px;background:var(--red);color:#fff;font-weight:900;letter-spacing:2px;font-size:15px;box-shadow:0 3px 0 #a8302a}
.fight:active{transform:translateY(2px);box-shadow:none}
.info{font-size:12px;color:var(--mut);font-weight:600;white-space:nowrap}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 96px);transform:translateX(-50%);background:var(--ink);color:#fff;padding:8px 14px;border-radius:10px;font-size:13px;font-weight:700;opacity:0;transition:opacity .25s;z-index:30;pointer-events:none;max-width:90vw;text-align:center}
#toast.on{opacity:1}
/* modal */
.modal{position:fixed;inset:0;background:#1f243055;display:none;align-items:center;justify-content:center;z-index:20;padding:20px}
.modal.on{display:flex}
.card{background:var(--card);border-radius:18px;padding:18px;width:min(360px,100%);max-height:86vh;overflow:auto;box-shadow:0 10px 40px #0003}
.card h3{margin:0 0 6px;font-size:22px}
.stars{font-size:38px;letter-spacing:6px;color:#ddd6c6;text-align:center;margin:6px 0}
.stars i{font-style:normal;color:var(--gold)}
.kv{display:flex;justify-content:space-between;font-size:14px;padding:4px 0;border-bottom:1px dashed var(--line)}
.btns{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.btn{flex:1;padding:12px;border-radius:12px;background:var(--ink);color:#fff;font-weight:800;min-width:90px}
.btn.alt{background:var(--card);color:var(--ink);border:1.5px solid var(--line)}
.btn.gold{background:var(--gold);color:#3a2a00}
.btn:disabled{opacity:.4}
.rc{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.rc .nm{flex:1;font-weight:800;font-size:14px}.rc .nm small{display:block;font-weight:600;color:var(--mut);font-size:11px}
.rc button{padding:7px 9px;border-radius:9px;background:var(--ink);color:#fff;font-weight:800;font-size:12px}
.rc button:disabled{opacity:.3}
/* tree */
#tree{background:#14171f;color:#e8e6e0}
#tree .hdr{padding:calc(env(safe-area-inset-top) + 10px) 12px 8px;margin:0}
#tree .back{background:#222734;border-color:#333a4a;color:#fff}
#twrap{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;position:relative}
#tin{position:relative;width:1120px;height:1120px}
#tin svg{position:absolute;inset:0}
.nd{position:absolute;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;background:#1d2230;border:2px solid #343b4d;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:9.5px;font-weight:800;color:#8d93a3;line-height:1.05;text-align:center;padding:2px}
.nd.av{border-color:#e0a526;color:#fff;box-shadow:0 0 14px #e0a52655}
.nd.own{background:#2f6fe4;border-color:#8fb2ff;color:#fff}
.nd.sel{outline:3px solid #fff}
.nd.core{width:84px;height:84px;margin:-42px 0 0 -42px;background:#2f6fe4;border-color:#fff;color:#fff;font-size:13px}
#tinfo{padding:12px 14px calc(env(safe-area-inset-bottom) + 34px);background:#1b1f2a;border-top:1px solid #2c3242;min-height:120px}
#tinfo h4{margin:0 0 4px;font-size:17px}#tinfo p{margin:0 0 10px;color:#a9aebb;font-size:13px}
</style></head><body>
<canvas id="cv"></canvas>

<div id="menu" class="scr on pad">
  <svg width="120" height="64" viewBox="0 0 120 64" id="logo"></svg>
  <h1>MARCHE <b>UNIE</b></h1>
  <div class="sub">Peins ton armée. Regarde-la marcher.</div>
  <button class="big" data-mode="camp"><svg width="34" height="34" data-ic="0"></svg><div><div class="t">Campagne</div><div class="d">25 batailles · or, recrues, arbre d'améliorations</div></div></button>
  <button class="big" data-mode="tac"><svg width="34" height="34" data-ic="1"></svg><div><div class="t">Tactique</div><div class="d">Armée imposée : seul le placement compte</div></div></button>
  <button class="big" data-mode="mus"><svg width="34" height="34" data-ic="2"></svg><div><div class="t">Rassemblement</div><div class="d">Budget fixe : compose l'armée qui contre</div></div></button>
  <button class="big" data-mode="cmd"><svg width="34" height="34" data-ic="3"></svg><div><div class="t">Commandement</div><div class="d">Ordres en temps réel + volée et ralliement</div></div></button>
  <button class="big" data-mode="sand"><svg width="34" height="34" data-ic="5"></svg><div><div class="t">Bac à sable</div><div class="d">Peins les deux camps, choisis le terrain</div></div></button>
  <div class="foot">Fan-remake inspiré de <i>We March as One</i> (dux, 2026)</div>
  <button class="lnk" id="reset">Réinitialiser la sauvegarde</button>
</div>

<div id="levels" class="scr pad">
  <div class="hdr"><button class="back" id="lvBack">‹</button><h2 id="lvTitle">Campagne</h2><span class="gold" id="lvGold"></span></div>
  <div class="row" id="lvTools" style="margin-bottom:10px"></div>
  <div id="lvGrid"></div>
</div>

<div id="hud" class="scr">
  <div id="top">
    <button class="back" id="hBack">‹</button>
    <div class="ttl" id="hTitle"></div>
    <span class="gold" id="hGold"></span>
  </div>
  <div id="bar"><span class="cb" id="cB">0</span><div class="b"><i id="bI"></i></div><span class="cr" id="cR">0</span></div>
  <div id="bot"></div>
</div>

<div id="tree" class="scr">
  <div class="hdr"><button class="back" id="tBack">‹</button><h2>Arbre d'améliorations</h2><span class="gold" id="tGold"></span></div>
  <div id="twrap"><div id="tin"><svg id="tsvg" width="1120" height="1120"></svg></div></div>
  <div id="tinfo"><h4>Touchez un nœud</h4><p>Les nœuds dorés sont achetables. Faites glisser pour explorer.</p></div>
</div>

<div class="modal" id="mod"><div class="card" id="modC"></div></div>
<div id="toast"></div>

<script>
'use strict';
const $=s=>document.querySelector(s);
const SKEY='marche-unie:save';
// ================= DONNÉES =================
// T=taille cellule terrain, L=pas de la grille de peinture, GZ=cellule de la grille spatiale
const T=24,COLS=40,ROWS=60,W=COLS*T,H=ROWS*T,GZ=16,GC=W/GZ,GR=H/GZ,NC=GC*GR,NCT=COLS*ROWS,L=6,LC=W/L,LR=H/L;
const PZ=38*T, EZ=22*T; // zone bleue y>=PZ, zone rouge y<EZ
const UT=[
 {k:'c',name:'Cercle',role:'Infanterie légère',hp:10,dmg:2,reach:1.5,speed:26,rate:1.0,r:2.6,cost:1,fp:1},
 {k:'s',name:'Carré',role:'Piquier — contre la cavalerie',hp:24,dmg:2.4,reach:5,speed:19,rate:1.15,r:2.7,cost:3,fp:1},
 {k:'t',name:'Triangle',role:'Archer — contre les carrés',hp:7,dmg:2.2,range:120,speed:21,rate:1.7,r:2.7,cost:3,fp:1,proj:'arrow'},
 {k:'d',name:'Losange',role:'Cavalerie légère — contre les archers',hp:18,dmg:4,reach:1.5,speed:52,rate:.9,r:2.9,cost:5,fp:1},
 {k:'p',name:'Pentagone',role:'Mortier — zone, casse les murs',hp:16,dmg:9,range:190,speed:13,rate:4.2,r:4.6,cost:15,fp:2,proj:'shell',splash:20},
 {k:'h',name:'Hexagone',role:'Colosse — protège ses voisins',hp:320,dmg:9,reach:3,speed:10,rate:1.6,r:8,cost:60,fp:3,aoe:12},
 {k:'k',name:'Cerf-volant',role:'Cavalerie lourde — contre l\'artillerie',hp:70,dmg:11,reach:2,speed:44,rate:1.0,r:5,cost:20,fp:2,aoe:7},
 {k:'v',name:'Chevron',role:'Baliste — carreaux perforants',hp:22,dmg:13,range:240,speed:11,rate:3.6,r:5,cost:18,fp:2,proj:'bolt',pierce:6},
];
const KI={};UT.forEach((u,i)=>KI[u.k]=i);
const ELITE=[0,0,0,0,1,1,1,1];
const CM=UT.map(()=>new Float32Array(8).fill(1));
[['s','d',3],['s','k',2.5],['t','s',2.2],['d','t',3],['d','s',.4],['d','p',2],['d','v',2],['p','h',2.5],['p','c',1.4],['p','s',1.2],['k','p',3],['k','v',3],['k','t',2],['v','h',1.8],['v','s',1.5],['h','c',1.6],['c','h',.6],['k','s',.6]].forEach(([a,d,v])=>CM[KI[a]][KI[d]]=v);
// sommets des formes : [angle, rayon]
const SHP=[null,null,[[0,1.35],[2.3,1.05],[-2.3,1.05]],[[0,1.45],[1.57,.85],[3.14,1.1],[-1.57,.85]],
 [0,1,2,3,4].map(k=>[k*1.2566,1.12]),[0,1,2,3,4,5].map(k=>[k*1.0472+.5236,1.06]),
 [[0,1.6],[1.9,.95],[3.14,.75],[-1.9,.95]],[[0,1.3],[2.45,1.3],[3.14,.35],[-2.45,1.3]]];

// ---- Arbre d'améliorations ----
const NODES=[];
function N(id,u,d,a,name,lab,desc,cost,req,eff){NODES.push({id,u,d,a,name,lab,desc,cost,req:req?[].concat(req):[],eff})}
N('c_cap1','c',1,0,'Recrues','+100','+100 capacité de Cercles',30,null,{cap:['c',100]});
N('c_cap2','c',2,0,'Levée','+250','+250 capacité de Cercles',150,'c_cap1',{cap:['c',250]});
N('c_cap3','c',3,0,'Conscription','+600','+600 capacité de Cercles',600,'c_cap2',{cap:['c',600]});
N('c_cap4','c',4,0,'Multitude','+1500','+1500 capacité de Cercles',2000,'c_cap3',{cap:['c',1500]});
N('c_cap5','c',5,0,'Marée humaine','+3000','+3000 capacité de Cercles',6000,'c_cap4',{cap:['c',3000]});
N('c_fury','c',2,-14,'Fureur','Vit. ×1.25','Cercles : +25 % de vitesse d\'attaque',80,'c_cap1',{mul:['c','rate',.25]});
N('c_split','c',3,-14,'Scission','Scission','Cercles : 15 % de chance de se diviser en 2 à la mort',300,'c_fury',{flag:'split'});
N('c_martyr','c',4,-14,'Éclat','Éclat','Cercles : explosent à la mort (dégâts de zone)',900,'c_split',{flag:'martyr'});
N('c_king','c',2,14,'Couronne','Roi','Double-tape un Cercle placé : il devient Roi (×10 PV/dégâts, aura +30 % de vitesse)',250,'c_cap1',{flag:'king'});
N('c_aura','c',3,14,'Aura royale','Aura +50%','Portée de l\'aura du Roi +50 %',800,'c_king',{flag:'aura'});
N('c_hp','c',4,14,'Endurance','PV ×1.3','Cercles : +30 % de PV',1500,'c_aura',{mul:['c','hp',.3]});
N('s_unl','s',1,0,'Carrés','Débloquer','Débloque les Carrés (piquiers, capacité 30)',40,'c_cap1',{unlock:['s',30]});
N('s_cap1','s',2,0,'Phalange','+70','+70 capacité de Carrés',120,'s_unl',{cap:['s',70]});
N('s_cap2','s',3,0,'Hérisson','+200','+200 capacité de Carrés',500,'s_cap1',{cap:['s',200]});
N('s_cap3','s',4,0,'Forêt de piques','+500','+500 capacité de Carrés',1800,'s_cap2',{cap:['s',500]});
N('s_wall','s',2,-14,'Mur de boucliers','Mur','Chaque Carré adjacent réduit les dégâts subis de 4 % (max 16 %)',150,'s_unl',{flag:'wall'});
N('s_shield','s',3,-14,'Pavois','Pavois','Les Carrés bloquent le 1er projectile reçu',400,'s_wall',{flag:'shield'});
N('s_thorns','s',3,14,'Épines','Épines','Les Carrés renvoient 50 % des dégâts de mêlée',700,'s_cap1',{flag:'thorns'});
N('t_unl','t',1,0,'Triangles','Débloquer','Débloque les Triangles (archers, capacité 30)',80,'c_cap1',{unlock:['t',30]});
N('t_cap1','t',2,0,'Compagnie','+70','+70 capacité de Triangles',200,'t_unl',{cap:['t',70]});
N('t_cap2','t',3,0,'Régiment','+200','+200 capacité de Triangles',700,'t_cap1',{cap:['t',200]});
N('t_cap3','t',4,0,'Nuée','+500','+500 capacité de Triangles',2400,'t_cap2',{cap:['t',500]});
N('t_rate','t',2,-14,'Cadence','Vit. ×1.25','Triangles : +25 % de cadence de tir',180,'t_unl',{mul:['t','rate',.25]});
N('t_long','t',3,-14,'Arc long','Portée +25%','Triangles : +25 % de portée',450,'t_rate',{mul:['t','range',.25]});
N('t_slow','t',2,14,'Flèches lestées','Ralentir','Flèches : −25 % vitesse et cadence de la cible (2 s)',300,'t_unl',{flag:'slow'});
N('t_fire','t',3,14,'Flèches de feu','Feu','Flèches : enflamment la cible (dégâts sur 3 s)',800,'t_slow',{flag:'fire'});
N('t_pierce','t',4,14,'Perçantes','Perce 1','Flèches : traversent la 1re cible',1600,'t_fire',{flag:'tpierce'});
N('d_unl','d',1,0,'Losanges','Débloquer','Débloque les Losanges (cavalerie légère, capacité 20)',200,'s_unl',{unlock:['d',20]});
N('d_cap1','d',2,0,'Escadron','+60','+60 capacité de Losanges',500,'d_unl',{cap:['d',60]});
N('d_cap2','d',3,0,'Horde','+200','+200 capacité de Losanges',1600,'d_cap1',{cap:['d',200]});
N('d_elan','d',2,-14,'Élan','Élan','Après une charge, attaque 2× plus vite pendant 4 s',400,'d_unl',{flag:'elan'});
N('d_iron','d',2,14,'Caparaçon','PV ×1.4','Losanges : +40 % de PV',600,'d_unl',{mul:['d','hp',.4]});
N('p_unl','p',1,0,'Pentagones','Débloquer','Débloque les Pentagones (mortiers, capacité 6)',700,'t_unl',{unlock:['p',6]});
N('p_cap1','p',2,0,'Batterie','+10','+10 capacité de Pentagones',1500,'p_unl',{cap:['p',10]});
N('p_cap2','p',3,0,'Grande batterie','+24','+24 capacité de Pentagones',4000,'p_cap1',{cap:['p',24]});
N('p_big','p',2,-14,'Gros calibre','Zone +40%','Pentagones : rayon d\'explosion +40 %',1200,'p_unl',{mul:['p','aoe',.4]});
N('p_prec','p',2,14,'Précision','Sans tir ami','Pentagones : ne blessent plus les alliés',1500,'p_unl',{flag:'prec'});
N('h_unl','h',1,0,'Hexagones','Débloquer','Débloque les Hexagones (colosses, capacité 2)',1800,'s_cap1',{unlock:['h',2]});
N('h_cap1','h',2,0,'Colonne','+3','+3 capacité d\'Hexagones',4000,'h_unl',{cap:['h',3]});
N('h_cap2','h',3,0,'Titans','+6','+6 capacité d\'Hexagones',9000,'h_cap1',{cap:['h',6]});
N('h_bast','h',2,-14,'Bastion','Aura +','Aura défensive plus large et plus forte (−35 %)',2500,'h_unl',{flag:'bast'});
N('h_quake','h',2,14,'Séisme','Dégâts ×1.6','Hexagones : +60 % de dégâts',3000,'h_unl',{mul:['h','dmg',.6]});
N('k_unl','k',1,0,'Cerfs-volants','Débloquer','Débloque les Cerfs-volants (cavalerie lourde, capacité 6)',1200,'d_unl',{unlock:['k',6]});
N('k_cap1','k',2,0,'Lanciers','+14','+14 capacité de Cerfs-volants',3000,'k_unl',{cap:['k',14]});
N('k_cap2','k',3,0,'Grande charge','+30','+30 capacité de Cerfs-volants',7000,'k_cap1',{cap:['k',30]});
N('k_break','k',2,-14,'Percée','Impact ×1.4','Cerfs-volants : +40 % de dégâts et de zone d\'impact',2000,'k_unl',{mul2:['k','dmg',.4,'aoe',.4]});
N('v_unl','v',1,0,'Chevrons','Débloquer','Débloque les Chevrons (balistes, capacité 6)',1400,'t_cap1',{unlock:['v',6]});
N('v_cap1','v',2,0,'Arsenal','+12','+12 capacité de Chevrons',3200,'v_unl',{cap:['v',12]});
N('v_cap2','v',3,0,'Arsenal royal','+26','+26 capacité de Chevrons',7500,'v_cap1',{cap:['v',26]});

function fillBlock(t,count,x0,x1,rowStart,dir,rowLimit,tryPlace){

 while(placed<count&&rows<rowLimit){const gy=dir<0?r-f+1:r;let any=false;for(const k of cols){if(placed>=count)break;if(tryPlace(x0+k*f,gy)){placed++;any=true}}r+=dir*f;rows+=f;if(any)used=rows}

function layoutEnemy(groups,hold){
 const out=[],occ=new Uint8Array(LC*LR);const fort=LV.terrain==='fort';
 const xmin=fort?26:4,xmax=fort?LC-26:LC-4;const front=Math.floor(EZ/L)-2;
 const tryP=t=>(gx,gy)=>{const f=UT[t].fp;if(gx<xmin||gx+f>xmax||gy<1||(gy+f)*L>EZ)return false;for(let dy=0;dy<f;dy++)for(let dx=0;dx<f;dx++)if(occ[(gy+dy)*LC+gx+dx])return false;
  const x0=gx*L+.5,y0=gy*L+.5,s=f*L-1;if(blockedT(x0,y0)||blockedT(x0+s,y0)||blockedT(x0,y0+s)||blockedT(x0+s,y0+s))return false;
  for(let dy=0;dy<f;dy++)for(let dx=0;dx<f;dx++)occ[(gy+dy)*LC+gx+dx]=1;out.push({tm:1,t,gx,gy,o:hold?1:0,k:0});return true};
 const gs=groups.map(([k,c])=>[KI[k],c]);
 const flank=gs.filter(g=>g[0]===3||g[0]===6),fw=flank.length?22:0;
 const bands=[[1,0,5],[2],[4,7]];let cur=front;
 for(const band of bands){const bg=gs.filter(g=>band.includes(g[0]));if(!bg.length)continue;
  const area=bg.reduce((s,g)=>s+g[1]*UT[g[0]].fp**2,0),full=xmax-xmin-2*fw,width=Math.min(full,Math.max(30,Math.round(Math.sqrt(area*3.5))));let x=xmin+fw+Math.floor((full-width)/2),maxR=0;const xe=x+width;
  bg.sort((a,b)=>b[0]===5?1:-1);

 for(const [t,c] of flank){const h1=Math.ceil(c/2);fillBlock(t,h1,xmin,xmin+fw,front,-1,front,tryP(t));fillBlock(t,c-h1,xmax-fw,xmax,front,-1,front,tryP(t))}

}

 if(LV.mode==='sand'){let r=0;for(let t=0;t<8;t++)r+=D.cnt[1][t];if(!tot||!r){toast('Peins les deux camps (bouton Camp bleu/rouge)');return}}
 else if(!tot){toast('Peins d\'abord ton armée dans la zone bleue');return}
 SV.form[LV.key]=D.placed.filter(Boolean).map(p=>[p.tm,p.t,p.gx,p.gy,p.o,p.k]);save();
 rebuildPreview();S.val0=[S.val[0],S.val[1]];
 const types=new Set();for(const p of D.placed)if(p&&p.tm===0)types.add(p.t);S.div=[S.M[0].f.div?1+.05*types.size:1,1];
 phase='battle';speed=1;acc=0;CMDST.armed=false;CMDST.volCd=0;CMDST.ralCd=0;buildBattleUI();
}
function buildBattleUI(){
 $('#bar').style.display='flex';const bot=$('#bot');
 let h='';
 if(LV.mode==='cmd')h+=`<div class="row"><button class="chip" data-co="0">Marche</button><button class="chip" data-co="1">Tenir</button><button class="chip" data-co="4">Repli</button><span class="sep"></span><button class="chip" id="aVol">Volée</button><button class="chip" id="aRal">Ralliement</button></div>`;
 h+=`<div class="row">${[1,2,4].map(s=>`<button class="chip" data-sp="${s}">${s}x</button>`).join('')}<span class="sep"></span><button class="chip" id="bView2"></button><button class="chip" id="bGive" style="margin-left:auto">Abandonner</button></div>`;
 bot.innerHTML=h;
 bot.querySelectorAll('[data-sp]').forEach(b=>b.onclick=()=>{speed=+b.dataset.sp;updBattleUI()});
 const vn=['Vue 2D','Vue 3D','Vue FLY'];$('#bView2').onclick=()=>{view=(view+1)%3;cam.tilt=view?.62:1;if(view<2)fitCam();updBattleUI()};
 $('#bGive').onclick=()=>endBattle(false,true);
 if(LV.mode==='cmd'){
  bot.querySelectorAll('[data-co]').forEach(b=>b.onclick=()=>{const o=+b.dataset.co;for(let i=0;i<n;i++)if(ualive[i]&&uteam[i]===0){uord[i]=o;uphase[i]=1;if(o===4)utgt[i]=-1}toast(['Toute l\'armée marche !','L\'armée tient la position','Repli !'][o===4?2:o])});
  $('#aVol').onclick=()=>{if(CMDST.volCd>0)return;CMDST.armed=!CMDST.armed;toast(CMDST.armed?'Touche le champ de bataille pour lancer la volée':'Volée annulée');updBattleUI()};
  $('#aRal').onclick=()=>{if(CMDST.ralCd>0)return;S.rally[0]=6;CMDST.ralCd=30;toast('Ralliement ! +35 % vitesse pendant 6 s');updBattleUI()};
 }
 updBattleUI();
}
function updBattleUI(){
 document.querySelectorAll('[data-sp]').forEach(b=>b.classList.toggle('on',+b.dataset.sp===speed));
 const bv=$('#bView2');if(bv)bv.textContent=['Vue 2D','Vue 3D','Vue FLY'][view];
 const v=$('#aVol');if(v){v.textContent=CMDST.volCd>0?'Volée '+Math.ceil(CMDST.volCd)+'s':'Volée';v.disabled=CMDST.volCd>0;v.classList.toggle('on',CMDST.armed)}
 const r=$('#aRal');if(r){r.textContent=CMDST.ralCd>0?'Ralliement '+Math.ceil(CMDST.ralCd)+'s':'Ralliement';r.disabled=CMDST.ralCd>0}
}
function volley(wx,wy){
 for(let k=0;k<60&&np<PMAX;k++){const p=np++,a=Math.random()*6.28,d=Math.sqrt(Math.random())*45;px[p]=wx+Math.cos(a)*d;py[p]=wy+Math.sin(a)*d;pvx[p]=0;pvy[p]=0;pl[p]=pt0[p]=.5+Math.random()*.5;pk[p]=3;ptm[p]=0;pd[p]=5;psrc[p]=2;pf[p]=0;pp[p]=0;plast[p]=-1}
 CMDST.armed=false;CMDST.volCd=20;updBattleUI();
}
let lastUI=0;
function battleFrame(dt){
 acc+=dt*speed;let steps=0;while(acc>=DT&&steps<8){simStep();acc-=DT;steps++;
  if(LV.mode==='cmd'){if(CMDST.volCd>0)CMDST.volCd-=DT;if(CMDST.ralCd>0)CMDST.ralCd-=DT}
  if(!S.over&&(S.cnt[0]<=0||S.cnt[1]<=0||S.time>240))S.over=S.time;
  if(S.over&&S.time-S.over>1.2){endBattle(S.cnt[1]<=0&&S.cnt[0]>0);return}}
 if(acc>DT*8)acc=0;
 if(view===2){ // FLY : suit le front
  let sx=0,sy=0,c=0;for(let i=0;i<n;i+=7)if(ualive[i]){sx+=ux[i];sy+=uy[i];c++}
  if(c){cam.x+=(sx/c-cam.x)*.03;cam.y+=(sy/c-cam.y)*.03;const zt=Math.min(CW,CH)/360;cam.z+=(zt-cam.z)*.03;cam.oy=0}}
 const now=performance.now();if(now-lastUI>200){lastUI=now;$('#cB').textContent=fmt(S.cnt[0]);$('#cR').textContent=fmt(S.cnt[1]);
  const a=S.val[0],b=S.val[1];$('#bI').style.width=(a+b?a/(a+b)*100:50)+'%';$('#hTitle').innerHTML=`${LV.name}<small>${Math.floor(S.time)} s · ${np} projectiles</small>`;if(LV.mode==='cmd')updBattleUI()}
}
function endBattle(win,gaveUp){
 if(phase!=='battle')return;phase='result';
 const ratio=S.val0[0]?Math.max(0,Math.min(1,S.val[0]/S.val0[0])):0;
 const st=win?(ratio>=.85?3:ratio>=.6?2:1):0;
 let h=`<h3 style="text-align:center;color:${win?'#2f6fe4':'#e2493b'}">${win?'Victoire':'Défaite'}</h3>`;
 if(LV.mode!=='sand')h+=`<div class="stars">${stars(st)}</div><div class="kv"><span>Armée survivante</span><b>${Math.round(ratio*100)} %</b></div><div class="kv"><span>2★ / 3★</span><span>≥ 60 % / ≥ 85 %</span></div>`;
 else h+=`<div class="kv"><span>Survivants bleus</span><b>${S.cnt[0]}</b></div><div class="kv"><span>Survivants rouges</span><b>${S.cnt[1]}</b></div>`;
 let next=false;
 if(LV.mode!=='sand'){const arr=SV.stars[LV.mode];const first=win&&!(arr[LV.i]>0);if(st>(arr[LV.i]||0))arr[LV.i]=st;next=win&&LV.i+1<MODES[LV.mode].list.length;
  if(LV.mode==='camp'){const f=MODS.f;let g=S.kills*(f.chest?1.1:1)+S.bounty;let bonus=0;if(win){bonus=Math.round((first?LV.reward:LV.reward*.3)+S.kills*.25*(st-1));if(st===3&&f.gstar)bonus=Math.round(bonus*1.2)}g=Math.round(g);
   SV.gold+=g+bonus;h+=`<div class="kv"><span>Or des ennemis tués</span><b>+${fmt(g)}</b></div>`+(win?`<div class="kv"><span>Prime de victoire${first?' (1re fois)':''}</span><b>+${fmt(bonus)}</b></div>`:'')+`<div class="kv"><span>Or total</span><b>${fmt(SV.gold)}</b></div><p style="font-size:12px;color:#7a7f8c">Tes troupes tombées reviennent pour la prochaine bataille.</p>`}
  save();}
 h+=`<div class="btns"><button class="btn alt" id="rMenu">${LV.mode==='sand'?'Menu':'Niveaux'}</button><button class="btn alt" id="rRetry">Rejouer</button>${next?'<button class="btn" id="rNext">Suivant</button>':''}${LV.mode==='camp'?'<button class="btn gold" id="rUp">Améliorer</button>':''}</div>`;
 modal(h);
 $('#rMenu').onclick=()=>{closeModal();if(LV.mode==='sand'){phase='menu';showScreen('menu')}else openLevels(LV.mode)};
 $('#rRetry').onclick=()=>{closeModal();if(LV.mode==='sand'){backToDeploy()}else startLevel(LV.mode,LV.i)};
 if(next)$('#rNext').onclick=()=>{closeModal();startLevel(LV.mode,LV.i+1)};
 if(LV.mode==='camp')$('#rUp').onclick=()=>{closeModal();openRecruit(()=>openTree(()=>startLevel('camp',LV.i)))};
}
function backToDeploy(){const keep=D.placed;setTerrain(LV.terrain,LV.seed);phase='deploy';view=0;showScreen('hud');fitCam();D.dirty=true;rebuildPreview();buildDeployUI()}
$('#hBack').onclick=()=>{if(phase==='battle'){endBattle(false,true);return}if(LV.mode==='sand'){phase='menu';showScreen('menu')}else openLevels(LV.mode)};

// ================= ENTRÉES =================
const ptrs=new Map();let pinch=null,lastTap={t:0,x:0,y:0},panning=null;
cv.addEventListener('pointerdown',e=>{
 cv.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
 if(ptrs.size===2){endStroke();panning=null;const [a,b]=[...ptrs.values()];pinch={d:Math.hypot(a.x-b.x,a.y-b.y),cx:(a.x+b.x)/2,cy:(a.y+b.y)/2,z:cam.z,camx:cam.x,camy:cam.y};return}
 if(ptrs.size>2)return;
 const w=s2w(e.clientX,e.clientY);hover=w;
 if(phase==='deploy'){
  const now=performance.now();if(now-lastTap.t<320&&Math.hypot(e.clientX-lastTap.x,e.clientY-lastTap.y)<24){toggleKing(w[0],w[1]);lastTap.t=0;return}lastTap={t:now,x:e.clientX,y:e.clientY};
  if(D.tool==='pan'||e.button===1||e.button===2){panning={x:e.clientX,y:e.clientY,cx:cam.x,cy:cam.y};return}
  D.cur={add:[],er:[],last:w};paintAt(w[0],w[1]);
 }else if(phase==='battle'){
  if(CMDST.armed){volley(w[0],w[1]);return}
  if(view===2){view=1;updBattleUI()}panning={x:e.clientX,y:e.clientY,cx:cam.x,cy:cam.y};
 }
});
cv.addEventListener('pointermove',e=>{
 if(ptrs.has(e.pointerId))ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
 const w=s2w(e.clientX,e.clientY);hover=w;
 if(pinch&&ptrs.size>=2){const [a,b]=[...ptrs.values()];const d=Math.hypot(a.x-b.x,a.y-b.y),cx=(a.x+b.x)/2,cy=(a.y+b.y)/2;
  cam.z=Math.max(.15,Math.min(8,pinch.z*d/pinch.d));cam.x=pinch.camx-(cx-pinch.cx)/cam.z;cam.y=pinch.camy-(cy-pinch.cy)/(cam.z*cam.tilt);
  // zoom autour du centre du pincement
  const [wx0,wy0]=[(pinch.cx-CW/2)/pinch.z+pinch.camx,(pinch.cy-CH/2-(cam.oy||0))/(pinch.z*cam.tilt)+pinch.camy];const [wx1,wy1]=s2w(cx,cy);cam.x+=wx0-wx1;cam.y+=wy0-wy1;return}
 if(panning){cam.x=panning.cx-(e.clientX-panning.x)/cam.z;cam.y=panning.cy-(e.clientY-panning.y)/(cam.z*cam.tilt);return}
 if(phase==='deploy'&&D.cur&&ptrs.size===1){paintLine(D.cur.last,w);D.cur.last=w}
});
function up(e){ptrs.delete(e.pointerId);if(ptrs.size<2)pinch=null;if(ptrs.size===0){panning=null;endStroke()}}
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);cv.addEventListener('pointerleave',e=>{if(e.pointerType==='mouse')hover=null});
cv.addEventListener('contextmenu',e=>e.preventDefault());
cv.addEventListener('wheel',e=>{e.preventDefault();const [wx,wy]=s2w(e.clientX,e.clientY);cam.z=Math.max(.15,Math.min(8,cam.z*Math.exp(-e.deltaY*.0015)));const [wx2,wy2]=s2w(e.clientX,e.clientY);cam.x+=wx-wx2;cam.y+=wy-wy2},{passive:false});
addEventListener('keydown',e=>{if(phase==='deploy'){if((e.ctrlKey||e.metaKey)&&e.key==='z'){undo();e.preventDefault()}const k=+e.key;if(k>=1&&k<=8){const ty=paletteTypes();if(ty[k-1]!==undefined){D.sel=ty[k-1];D.tool='paint';updDeployUI()}}if(e.key===' '){startBattle();e.preventDefault()}}
 if(phase==='battle'){if(e.key==='1')speed=1;if(e.key==='2')speed=2;if(e.key==='4')speed=4;updBattleUI()}});
document.addEventListener('gesturestart',e=>e.preventDefault());

// ================= BOUCLE =================
let lt=performance.now();
function frame(t){const dt=Math.min(.1,(t-lt)/1000);lt=t;
 if(phase==='deploy'){if(D.dirty)rebuildPreview();render()}
 else if(phase==='battle'){battleFrame(dt);render()}
 else if(phase==='result')render();
 requestAnimationFrame(frame)}
requestAnimationFrame(frame);
window.__wmo={S,D,startLevel,startBattle,simStep,get n(){return n},autoFill,SV,setSel:t=>{D.sel=t},endBattle};
</script>
</body></html>

<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#082f49">
<title>Bottle Flip</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#082f49;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none;overscroll-behavior:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
#hud{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 14px) 18px 0;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none}
.stat{display:flex;flex-direction:column;min-width:64px}
.stat small{font-size:11px;letter-spacing:.12em;text-transform:uppercase;opacity:.65;font-weight:600}
.stat b{font-size:34px;line-height:1.05;font-weight:800;font-variant-numeric:tabular-nums}
.stat.c{align-items:center}.stat.r{align-items:flex-end}
.stat b.bump{animation:bump .35s ease}
@keyframes bump{40%{transform:scale(1.3);color:#fde68a}}
#hint{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 92px);text-align:center;font-size:15px;opacity:.85;padding:0 24px;pointer-events:none;transition:opacity .3s}
#msg{position:fixed;left:0;right:0;top:30%;text-align:center;pointer-events:none;opacity:0}
#msg b{display:block;font-size:46px;font-weight:900;letter-spacing:.01em;text-shadow:0 4px 18px rgba(0,0,0,.35)}
#msg span{display:block;margin-top:6px;font-size:16px;opacity:.9;padding:0 28px}
#msg.show{animation:pop 1.5s ease forwards}
@keyframes pop{0%{opacity:0;transform:scale(.6)}12%{opacity:1;transform:scale(1.08)}22%{transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:translateY(-14px)}}
#msg.good b{color:#fde68a}#msg.bad b{color:#fecaca}
#bar{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 40px);display:flex;justify-content:center;gap:8px;padding:0 14px}
#bar button{pointer-events:auto;appearance:none;border:1.5px solid rgba(255,255,255,.28);background:rgba(8,47,73,.55);color:#fff;font:inherit;font-weight:700;font-size:14px;padding:10px 14px;border-radius:999px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
#bar button small{opacity:.7;font-weight:600;margin-left:4px}
#bar button.on{background:#fde68a;color:#422006;border-color:#fde68a}
#snd{position:fixed;right:14px;bottom:calc(env(safe-area-inset-bottom,0px) + 92px);appearance:none;border:0;background:rgba(8,47,73,.55);width:42px;height:42px;border-radius:50%;display:grid;place-items:center;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
#snd svg{width:22px;height:22px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#snd.off .w{display:none}#snd:not(.off) .x{display:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <div class="stat"><small>Score</small><b id="score">0</b></div>
  <div class="stat c"><small>Série</small><b id="streak">0</b></div>
  <div class="stat r"><small>Record</small><b id="best">0</b></div>
</div>
<div id="hint">Swipe vers le haut, bien droit</div>
<div id="msg"><b></b><span></span></div>
<button id="snd" aria-label="Son"><svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9z"/><path class="w" d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/><path class="x" d="M17 9l5 6M22 9l-5 6"/></svg></button>
<div id="bar"></div>

<script>
(() => {
'use strict';
const PI = Math.PI, TAU = PI * 2;
const KEY = 'bottle-flip:';
const store = {
  get(k, d) { try { const v = localStorage.getItem(KEY + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(KEY + k, JSON.stringify(v)); } catch (e) {} }
};
const $ = s => document.querySelector(s);
const cv = $('#c'), ctx = cv.getContext('2d');
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rand = (a, b) => a + Math.random() * (b - a);
const normAngle = a => { a = ((a % TAU) + TAU) % TAU; return a > PI ? a - TAU : a; };

/* ---------- Modes ---------- */
const MODES = [
  { id: 'classic', name: 'Classique', n: 1, mult: 1, cap: false },
  { id: 'double', name: 'Double', n: 2, mult: 3, cap: false },
  { id: 'cap', name: 'Bouchon', n: .5, mult: 3, cap: true }
];
let mode = MODES.find(m => m.id === store.get('mode', 'classic')) || MODES[0];

/* ---------- État ---------- */
let W, H, dpr, u, floorY, tL, tR, hw, hh, cw, g, vyMax, I;
let PTS = [];
const b = { x: 0, y: 0, vx: 0, vy: 0, a: 0, w: 0 };
let state = 'ready'; // ready | air | tumble | stand | result
let score = 0, streak = 0, best = store.get('best', 0);
let slosh = 0, appear = 0, tumbleT = 0, restT = 0, standT = 0, standBase = 0, standErr = 0, resultT = 0;
let firstVy = 0, firstAngle = 0, offTable = false, impact = 0, throws = 0;
let trail = [], trailT = 0, parts = [], shake = 0;
let drag = null, resultOk = false;

function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2.5);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  u = clamp(Math.min(H / 900, W / 430), .6, 1.6);
  floorY = H * .74; tL = W * .06; tR = W * .94;
  hw = 23 * u; hh = 70 * u; cw = 9.5 * u;
  g = 2600 * u;
  vyMax = Math.sqrt(2 * g * H * .5);
  I = (4 * hw * hw + 4 * hh * hh) / 12;
  PTS = [[-hw, hh], [hw, hh], [-hw, -hh * .3], [hw, -hh * .3], [-cw, -hh], [cw, -hh]];
  if (state === 'ready') { b.x = W / 2; b.y = floorY - hh; }
}

/* ---------- Son ---------- */
let AC = null, muted = store.get('muted', false);
function ac() {
  if (muted) return null;
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (AC && AC.state === 'suspended') AC.resume();
  return AC;
}
function tone(f, d, type = 'sine', vol = .15, delay = 0, slide = 0) {
  const a = ac(); if (!a) return;
  const t = a.currentTime + delay, o = a.createOscillator(), gn = a.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f + slide), t + d);
  gn.gain.setValueAtTime(vol, t); gn.gain.exponentialRampToValueAtTime(.0001, t + d);
  o.connect(gn).connect(a.destination); o.start(t); o.stop(t + d + .02);
}
function noise(d, vol, fc) {
  const a = ac(); if (!a) return;
  const n = Math.floor(a.sampleRate * d), buf = a.createBuffer(1, n, a.sampleRate), ch = buf.getChannelData(0);
  for (let i = 0; i < n; i++) ch[i] = (Math.random() * 2 - 1) * (1 - i / n);
  const s = a.createBufferSource(), f = a.createBiquadFilter(), gn = a.createGain();
  s.buffer = buf; f.type = 'bandpass'; f.frequency.value = fc; gn.gain.value = vol;
  s.connect(f).connect(gn).connect(a.destination); s.start();
}
const sfx = {
  launch() { noise(.25, .25, 1800); },
  thud(v) { const k = clamp(v / (900 * u), .15, 1); tone(150, .14, 'sine', .35 * k, 0, -80); noise(.08, .18 * k, 700); },
  win() { [660, 880, 1175].forEach((f, i) => tone(f, .28, 'triangle', .16, i * .09)); },
  perfect() { [880, 1175, 1568].forEach((f, i) => tone(f, .3, 'triangle', .16, i * .08)); },
  lose() { tone(220, .35, 'sawtooth', .08, 0, -110); }
};

/* ---------- Interface ---------- */
const el = { score: $('#score'), streak: $('#streak'), best: $('#best'), hint: $('#hint'), msg: $('#msg'), bar: $('#bar'), snd: $('#snd') };
function hud(bump) {
  el.score.textContent = score; el.streak.textContent = streak; el.best.textContent = best;
  if (bump) { el.score.classList.remove('bump'); void el.score.offsetWidth; el.score.classList.add('bump'); }
}
function say(title, sub, cls) {
  el.msg.className = ''; void el.msg.offsetWidth;
  el.msg.querySelector('b').textContent = title; el.msg.querySelector('span').textContent = sub || '';
  el.msg.className = 'show ' + cls;
}
function buildBar() {
  el.bar.innerHTML = '';
  MODES.forEach(m => {
    const bt = document.createElement('button');
    bt.innerHTML = m.name + '<small>×' + m.mult + '</small>';
    if (m === mode) bt.className = 'on';
    bt.addEventListener('pointerdown', e => e.stopPropagation());
    bt.addEventListener('click', () => {
      if (state !== 'ready') return;
      mode = m; store.set('mode', m.id); streak = 0; hud(); buildBar(); showHint();
    });
    el.bar.appendChild(bt);
  });
}
function showHint(t) {
  el.hint.style.opacity = 1;
  el.hint.textContent = t || (mode.cap ? 'Demi-tour : retombe sur le bouchon !' : mode.n === 2 ? 'Deux tours en l’air : swipe fort et droit' : 'Swipe vers le haut, bien droit');
}
function setSnd() { el.snd.classList.toggle('off', muted); }
el.snd.addEventListener('pointerdown', e => e.stopPropagation());
el.snd.addEventListener('click', () => { muted = !muted; store.set('muted', muted); setSnd(); if (!muted) tone(660, .12); });

/* ---------- Jeu ---------- */
function reset() {
  Object.assign(b, { x: W / 2, y: floorY - hh, vx: 0, vy: 0, a: 0, w: 0 });
  state = 'ready'; appear = 0; trail = []; slosh = 0; offTable = false;
  showHint();
}

function launch(dx, dy, len) {
  const tilt = clamp(dx / -dy, -1, 1);
  const f = .55 + .45 * clamp((len - 50 * u) / (250 * u), 0, 1);
  const vy = f * vyMax, T = 2 * vy / g;
  const R = mode.n * (1 + .25 * tilt) * (1 + rand(-.008, .008));
  b.vy = -vy; b.vx = tilt * 60 * u; b.w = TAU * R / T;
  state = 'air'; throws++; firstVy = 0; firstAngle = 0; impact = 0; tumbleT = 0; restT = 0;
  el.hint.style.opacity = 0; sfx.launch();
}

function corner(p) {
  const c = Math.cos(b.a), s = Math.sin(b.a);
  return { rx: p[0] * c - p[1] * s, ry: p[0] * s + p[1] * c };
}

function classify() {
  firstVy = b.vy; firstAngle = b.a;
  if (b.vy > 0) {
    const e0 = normAngle(b.a), eC = normAngle(b.a - PI);
    if (Math.abs(e0) < .38) { land('bottom', 0, e0); return true; }
    if (Math.abs(eC) < .22) { land('cap', PI, eC); return true; }
  }
  return false;
}

function land(type, base, err) {
  sfx.thud(b.vy); shake = 7 * u;
  b.vx = 0; b.vy = 0; b.w = 0;
  standBase = base; standErr = err; standT = 0; b.a = base + err;
  standType = type; state = 'stand';
}
let standType = 'bottom';

function resolve(c, depth) {
  b.y -= depth;
  const vcy = b.vy + b.w * c.rx;
  if (vcy > 0) {
    const e = vcy > 120 * u ? .28 : 0;
    const j = (1 + e) * vcy / (1 + c.rx * c.rx / I);
    b.vy -= j; b.w -= j * c.rx / I;
    impact = Math.max(impact, vcy);
    const vt = b.vx - b.w * c.ry;
    const jt = clamp(-vt / (1 + c.ry * c.ry / I), -.6 * j, .6 * j);
    b.vx += jt; b.w -= c.ry * jt / I;
    if (vcy > 200 * u) sfx.thud(vcy);
  }
}

function collide() {
  for (let it = 0; it < 4; it++) {
    let best = null, bd = 0;
    for (const p of PTS) {
      const c = corner(p), wx = b.x + c.rx, wy = b.y + c.ry;
      if (wx < tL || wx > tR) continue;
      const d = wy - floorY;
      if (d > bd) { bd = d; best = c; }
    }
    if (!best) return;
    if (state === 'air') {
      if (classify()) return;
      state = 'tumble'; announceFail();
    }
    resolve(best, bd);
  }
}

function physics(dt) {
  b.vy += g * dt; b.x += b.vx * dt; b.y += b.vy * dt; b.a += b.w * dt;
  if (state === 'tumble') b.w *= 1 - .6 * dt;
  collide();
  if (state === 'tumble') {
    tumbleT += dt;
    const sp = Math.hypot(b.vx, b.vy);
    if (sp < 12 * u && Math.abs(b.w) < .5) restT += dt; else restT = 0;
    if (restT > .25 || tumbleT > 1.2) settle();
  }
  if ((state === 'air' || state === 'tumble') && b.y > H + 250 * u) { offTable = true; finish(false); }
}

let announced = false;
function announceFail() {
  announced = true;
  const was = streak; streak = 0; hud();
  say('RATÉ', feedback() + (was >= 3 ? '  (série perdue : ' + was + ')' : ''), 'bad');
  sfx.lose();
  if (navigator.vibrate) try { navigator.vibrate(60); } catch (e) {}
}

function settle() {
  const e0 = Math.abs(normAngle(b.a)), eC = Math.abs(normAngle(b.a - PI));
  b.vx = b.vy = b.w = 0;
  if (!announced && (e0 < .15 || eC < .15)) { standType = e0 < .15 ? 'bottom' : 'cap'; finish(true, true); }
  else finish(false);
}

function feedback() {
  if (offTable) return 'Dans le vide… vise droit';
  if (firstVy <= 0) return 'Trop bas : fais un swipe plus long';
  const e = normAngle(firstAngle - (mode.cap ? PI : 0));
  return e > 0 ? 'Trop de rotation : penche moins à droite' : 'Pas assez de rotation : penche plus à droite';
}

function finish(ok, lucky) {
  state = 'result'; resultT = 0; resultOk = ok;
  if (!ok && announced) { announced = false; return; }
  announced = false;
  if (ok) {
    const perfect = !lucky && Math.abs(standErr) < .12;
    let pts = (standType === 'cap' ? 3 : mode.mult) + (perfect ? 1 : 0);
    streak++;
    pts *= 1 + Math.floor(streak / 5);
    score += pts;
    if (streak > best) { best = streak; store.set('best', best); }
    hud(true);
    confetti(b.x, floorY - 10 * u, perfect ? 70 : 40);
    const title = standType === 'cap' ? 'BOUCHON !' : perfect ? 'PARFAIT !' : lucky ? 'CHANCEUX !' : 'RÉUSSI !';
    say(title, '+' + pts + (streak >= 5 ? '  ·  série ×' + (1 + Math.floor(streak / 5)) : ''), 'good');
    (perfect || standType === 'cap' ? sfx.perfect : sfx.win)();
    if (navigator.vibrate) try { navigator.vibrate(perfect ? [20, 40, 20] : 25); } catch (e) {}
  } else {
    announceFail(); announced = false;
  }
}

function confetti(x, y, n) {
  const cols = ['#fde68a', '#fff', '#7dd3fc', '#f9a8d4', '#86efac'];
  for (let i = 0; i < n; i++) parts.push({ x, y, vx: rand(-320, 320) * u, vy: rand(-760, -240) * u, r: rand(0, TAU), vr: rand(-9, 9), c: cols[i % cols.length], life: rand(.9, 1.6), s: rand(5, 10) * u });
}

function update(dt) {
  if (appear < 1) appear = Math.min(1, appear + dt * 4);
  if (state === 'air' || state === 'tumble') {
    const steps = Math.ceil(dt / (1 / 240)), h = dt / steps;
    for (let i = 0; i < steps && (state === 'air' || state === 'tumble'); i++) physics(h);
    trailT += dt;
    if (state === 'air' && trailT > .035) { trailT = 0; trail.push({ x: b.x, y: b.y, a: b.a, l: 1 }); }
  } else if (state === 'stand') {
    standT += dt;
    b.a = standBase + standErr * Math.exp(-standT * 3) * Math.cos(standT * 13);
    let low = -1e9; for (const p of PTS) low = Math.max(low, corner(p).ry);
    b.y = floorY - low;
    if (standT > 1.1) { b.a = standBase; finish(true); }
  } else if (state === 'result') {
    resultT += dt;
    if (resultT > (resultOk ? 1.3 : .5)) reset();
  }
  for (const t of trail) t.l -= dt * 2.2;
  trail = trail.filter(t => t.l > 0);
  for (const p of parts) { p.vy += g * .5 * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.r += p.vr * dt; p.life -= dt; }
  parts = parts.filter(p => p.life > 0);
  const target = -clamp(b.w * .06, -.7, .7);
  slosh += (target - slosh) * Math.min(1, dt * 9);
  shake *= Math.pow(.001, dt);
}

/* ---------- Rendu ---------- */
function bottlePath() {
  const nw = cw * .9, capH = 15 * u, r = 9 * u;
  ctx.beginPath();
  ctx.moveTo(-hw, hh - r);
  ctx.quadraticCurveTo(-hw, hh, -hw + r, hh);
  ctx.lineTo(hw - r, hh);
  ctx.quadraticCurveTo(hw, hh, hw, hh - r);
  ctx.lineTo(hw, -hh * .3);
  ctx.bezierCurveTo(hw, -hh * .52, nw, -hh * .5, nw, -hh * .68);
  ctx.lineTo(nw, -hh + capH);
  ctx.lineTo(-nw, -hh + capH);
  ctx.lineTo(-nw, -hh * .68);
  ctx.bezierCurveTo(-nw, -hh * .5, -hw, -hh * .52, -hw, -hh * .3);
  ctx.closePath();
}

function drawBottle(x, y, a, alpha, ghost) {
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.translate(x, y); ctx.rotate(a);
  if (ghost) {
    bottlePath(); ctx.strokeStyle = '#bae6fd'; ctx.lineWidth = 2 * u; ctx.stroke();
    ctx.restore(); return;
  }
  bottlePath();
  const gb = ctx.createLinearGradient(-hw, 0, hw, 0);
  gb.addColorStop(0, 'rgba(186,230,253,.55)'); gb.addColorStop(.35, 'rgba(240,249,255,.28)'); gb.addColorStop(1, 'rgba(125,211,252,.45)');
  ctx.fillStyle = gb; ctx.fill();
  ctx.save(); ctx.clip();
  const lv = hh - 2 * hh * .38;
  ctx.translate(0, lv); ctx.rotate(slosh);
  const gw = ctx.createLinearGradient(0, 0, 0, hh * 2);
  gw.addColorStop(0, 'rgba(56,189,248,.85)'); gw.addColorStop(1, 'rgba(2,132,199,.9)');
  ctx.fillStyle = gw; ctx.fillRect(-hw * 3, 0, hw * 6, hh * 2);
  ctx.fillStyle = 'rgba(255,255,255,.55)'; ctx.fillRect(-hw * 3, 0, hw * 6, 2.5 * u);
  ctx.restore();
  ctx.save(); ctx.clip();
  ctx.fillStyle = 'rgba(255,255,255,.88)'; ctx.fillRect(-hw, -hh * .02, hw * 2, 20 * u);
  ctx.fillStyle = 'rgba(8,47,73,.55)'; ctx.fillRect(-hw, -hh * .02 + 7 * u, hw * 2, 6 * u);
  ctx.restore();
  bottlePath(); ctx.strokeStyle = 'rgba(255,255,255,.85)'; ctx.lineWidth = 2.4 * u; ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,.5)';
  ctx.beginPath(); ctx.roundRect(-hw + 5 * u, -hh * .25, 4 * u, hh * 1.05, 2 * u); ctx.fill();
  ctx.fillStyle = '#fde68a';
  ctx.beginPath(); ctx.roundRect(-cw - 1.5 * u, -hh, (cw + 1.5 * u) * 2, 17 * u, 4 * u); ctx.fill();
  ctx.fillStyle = 'rgba(0,0,0,.14)'; ctx.fillRect(-cw - 1.5 * u, -hh + 11 * u, (cw + 1.5 * u) * 2, 6 * u);
  ctx.restore();
}

function render() {
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const sx = shake > .3 ? rand(-shake, shake) : 0, sy = shake > .3 ? rand(-shake, shake) : 0;
  ctx.translate(sx, sy);
  const bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, '#061a2b'); bg.addColorStop(.6, '#0b3a5b'); bg.addColorStop(1, '#0a2f4a');
  ctx.fillStyle = bg; ctx.fillRect(-20, -20, W + 40, H + 40);
  const sp = ctx.createRadialGradient(W / 2, floorY - 60 * u, 10, W / 2, floorY - 60 * u, W * .85);
  sp.addColorStop(0, 'rgba(186,230,253,.28)'); sp.addColorStop(1, 'rgba(186,230,253,0)');
  ctx.fillStyle = sp; ctx.fillRect(-20, -20, W + 40, H + 40);

  // table
  const th = 24 * u;
  const wood = ctx.createLinearGradient(0, floorY, 0, floorY + th);
  wood.addColorStop(0, '#d9953f'); wood.addColorStop(1, '#a8672a');
  ctx.fillStyle = wood; ctx.beginPath(); ctx.roundRect(tL, floorY, tR - tL, th, 8 * u); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.28)'; ctx.fillRect(tL + 6 * u, floorY, tR - tL - 12 * u, 3 * u);
  ctx.fillStyle = '#5b3414'; ctx.fillRect(tL + 14 * u, floorY + th, tR - tL - 28 * u, H);
  ctx.fillStyle = 'rgba(0,0,0,.18)'; ctx.fillRect(tL + 14 * u, floorY + th, tR - tL - 28 * u, 10 * u);

  // ombre
  const hgt = clamp((floorY - (b.y + hh)) / (H * .5), 0, 1);
  if (b.x > tL && b.x < tR) {
    ctx.fillStyle = 'rgba(0,0,0,' + (.3 * (1 - hgt)) + ')';
    ctx.beginPath(); ctx.ellipse(b.x, floorY + 2 * u, hw * (1.2 - .5 * hgt), 5 * u, 0, 0, TAU); ctx.fill();
  }

  for (const t of trail) drawBottle(t.x, t.y, t.a, t.l * .22, true);
  drawBottle(b.x, b.y - (1 - appear) * 30 * u, b.a, appear, false);

  // geste
  if (drag && state === 'ready') {
    const ex = drag.cx, ey = drag.cy;
    ctx.save();
    ctx.setLineDash([2 * u, 12 * u]); ctx.lineCap = 'round';
    ctx.strokeStyle = 'rgba(255,255,255,.2)'; ctx.lineWidth = 5 * u;
    ctx.beginPath(); ctx.moveTo(drag.x, drag.y); ctx.lineTo(drag.x, Math.min(ey, drag.y - 120 * u)); ctx.stroke();
    ctx.strokeStyle = 'rgba(255,255,255,.9)'; ctx.lineWidth = 6 * u;
    ctx.beginPath(); ctx.moveTo(drag.x, drag.y); ctx.lineTo(ex, ey); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = '#fde68a'; ctx.beginPath(); ctx.arc(ex, ey, 9 * u, 0, TAU); ctx.fill();
    ctx.restore();
  }

  for (const p of parts) {
    ctx.save(); ctx.globalAlpha = clamp(p.life * 2, 0, 1);
    ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c; ctx.fillRect(-p.s / 2, -p.s / 3, p.s, p.s * .66); ctx.restore();
  }
}

/* ---------- Entrées ---------- */
cv.addEventListener('pointerdown', e => {
  ac();
  if (state !== 'ready') return;
  try { cv.setPointerCapture(e.pointerId); } catch (_) {}
  drag = { x: e.clientX, y: e.clientY, cx: e.clientX, cy: e.clientY, id: e.pointerId };
});
cv.addEventListener('pointermove', e => {
  if (drag && e.pointerId === drag.id) { drag.cx = e.clientX; drag.cy = e.clientY; }
});
function endDrag(e, cancel) {
  if (!drag || e.pointerId !== drag.id) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y, len = Math.hypot(dx, dy);
  drag = null;
  if (cancel || state !== 'ready') return;
  if (dy > -30 * u || len < 45 * u) { if (len > 12 * u) showHint('Swipe plus long, vers le haut'); return; }
  launch(dx, dy, len);
}
cv.addEventListener('pointerup', e => endDrag(e, false));
cv.addEventListener('pointercancel', e => endDrag(e, true));
document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
document.addEventListener('gesturestart', e => e.preventDefault());
window.addEventListener('resize', resize);

/* ---------- Boucle ---------- */
let last = performance.now();
function loop(t) {
  const dt = Math.min(.033, (t - last) / 1000); last = t;
  update(dt); render();
  requestAnimationFrame(loop);
}

resize(); buildBar(); setSnd(); hud(); reset();
requestAnimationFrame(loop);
})();
</script>
</body>

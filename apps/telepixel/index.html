<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0618">
<title>Télépixel</title>
<style>
:root{
  --bg:#0a0618; --panel:rgba(255,255,255,.05); --line:rgba(196,181,253,.16);
  --txt:#f1ecff; --mute:#b3a8d6; --dim:#7d72a3; --vio:#a78bfa; --pink:#e879f9; --cyan:#22d3ee; --gold:#fde68a;
  --ok:#34d399; --bad:#f87171;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--txt);font-family:var(--sans);-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
body{background:radial-gradient(120% 50% at 50% -10%,rgba(168,85,247,.32),transparent 60%),radial-gradient(80% 40% at 100% 100%,rgba(34,211,238,.10),transparent 60%),linear-gradient(180deg,#140b2e,#0a0618 60%,#06040f) fixed}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
main{max-width:540px;margin:0 auto;padding:calc(var(--sat) + 20px) 16px calc(var(--sab) + 70px)}
.eyebrow{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);font-weight:700}
h1{font-size:30px;margin:4px 0 2px;letter-spacing:-.02em}
.sub{color:var(--mute);font-size:14px;margin:0 0 16px;line-height:1.4}
.seg{display:grid;grid-template-columns:1fr 1fr;background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:14px;padding:4px;margin-bottom:14px}
.seg button{padding:11px;border-radius:10px;font-weight:700;color:var(--mute);transition:.2s}
.seg button.on{background:linear-gradient(135deg,#7c3aed,#c026d3);color:#fff;box-shadow:0 6px 18px rgba(192,38,211,.35)}
.modes{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.modes.r3{grid-template-columns:repeat(3,1fr)}
.mode{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 4px 10px;border-radius:14px;background:var(--panel);border:1px solid var(--line);font-size:12px;font-weight:600;color:var(--mute);transition:.2s}
.mode svg{width:26px;height:26px}
.mode.on{border-color:var(--pink);color:#fff;background:rgba(232,121,249,.12)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:14px}
.card h3{margin:0 0 10px;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--vio)}
.kind{display:flex;gap:8px;margin-bottom:12px}
.chip{padding:7px 14px;border-radius:999px;border:1px solid var(--line);font-size:13px;font-weight:600;color:var(--mute)}
.chip.on{background:#fff;color:#1b1035;border-color:#fff}
.drop{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:130px;border:2px dashed rgba(196,181,253,.3);border-radius:16px;color:var(--mute);font-size:14px;text-align:center;padding:14px;position:relative;overflow:hidden}
.drop input{position:absolute;inset:0;opacity:0;cursor:pointer}
.drop b{color:#fff;font-size:15px}
.pv{display:none;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.pv.on{display:grid}
.pv figure{margin:0;background:#000;border-radius:12px;overflow:hidden;aspect-ratio:1;display:flex;align-items:center;justify-content:center;position:relative}
.pv img,.pv canvas{max-width:100%;max-height:100%;width:100%;height:100%;object-fit:contain}
.pv canvas,.pix{image-rendering:pixelated;image-rendering:crisp-edges}
.pv figcaption{position:absolute;left:6px;bottom:6px;font-size:10px;font-weight:700;background:rgba(0,0,0,.6);padding:3px 7px;border-radius:6px;color:#fff}
textarea{width:100%;min-height:110px;border-radius:14px;border:1px solid var(--line);background:rgba(0,0,0,.25);color:#fff;font:inherit;font-size:16px;padding:12px;resize:vertical}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:10px 0}
.row label{font-size:14px;color:var(--mute)}
.row output{font-weight:700;font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--pink)}
.opts{display:flex;gap:6px;flex-wrap:wrap}
.opts button{padding:6px 11px;border-radius:9px;border:1px solid var(--line);font-size:13px;font-weight:600;color:var(--mute);font-variant-numeric:tabular-nums}
.opts button.on{background:var(--vio);color:#160b33;border-color:var(--vio)}
.tog{width:46px;height:28px;border-radius:99px;background:rgba(255,255,255,.15);position:relative;transition:.2s;flex:none}
.tog::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s}
.tog.on{background:var(--pink)}.tog.on::after{left:21px}
.est{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:6px}
.est div{background:rgba(0,0,0,.25);border-radius:10px;padding:8px 4px;text-align:center;font-size:11px;color:var(--dim);border:1px solid transparent}
.est div b{display:block;font-size:14px;color:var(--mute);margin-top:2px;font-variant-numeric:tabular-nums}
.est div.on{border-color:var(--pink)}.est div.on b{color:#fff}
.est div.no b{color:var(--bad)}
.size{font-size:12px;color:var(--dim);margin-top:8px;text-align:center}
.big{width:100%;padding:16px;border-radius:16px;font-size:17px;font-weight:800;background:linear-gradient(135deg,#7c3aed,#db2777);color:#fff;box-shadow:0 10px 26px rgba(219,39,119,.35);display:flex;align-items:center;justify-content:center;gap:10px}
.big:disabled{opacity:.4}
.big.stop{background:#2a1f45;box-shadow:none;border:1px solid var(--line)}
.hint{font-size:13px;color:var(--mute);line-height:1.45;margin:10px 2px 0}
.hint b{color:#fff}
canvas.viz{width:100%;height:150px;display:block;border-radius:12px;background:#05030c}
.stat{display:flex;justify-content:space-between;font-size:13px;color:var(--mute);margin-top:10px;font-variant-numeric:tabular-nums}
.stat b{color:#fff}
.cam{position:relative;width:100%;aspect-ratio:1;border-radius:16px;overflow:hidden;background:#000}
.cam video{width:100%;height:100%;object-fit:cover;display:block}
.guide{position:absolute;inset:8%;border:3px solid rgba(255,255,255,.85);border-radius:8px;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);pointer-events:none}
.guide i{border:1px dashed rgba(255,255,255,.35);display:flex;align-items:center;justify-content:center}
.guide i::after{content:"";width:34%;height:34%;border-radius:6px;background:var(--c,transparent);border:2px solid rgba(255,255,255,.6)}
.guide.qr{inset:10%;grid-template-columns:1fr;grid-template-rows:1fr;border-style:dashed}
.guide.qr i{display:none}
.cells{display:flex;flex-wrap:wrap;gap:3px;margin-top:12px}
.cells i{width:12px;height:12px;border-radius:3px;background:rgba(255,255,255,.1)}
.cells i.ok{background:linear-gradient(135deg,var(--cyan),var(--pink))}
.bar{height:8px;border-radius:9px;background:rgba(255,255,255,.08);overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--cyan),var(--pink));transition:width .3s}
.result{display:none}
.result.on{display:block;animation:pop .5s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.85);opacity:0}}
.result img{width:100%;border-radius:14px;background:#000;display:block}
.result .txt{background:rgba(0,0,0,.3);padding:14px;border-radius:14px;font-size:17px;line-height:1.45;white-space:pre-wrap;word-break:break-word}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.btn2{padding:12px;border-radius:12px;background:rgba(255,255,255,.08);border:1px solid var(--line);font-weight:700;font-size:14px}
.hist{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.hist button{aspect-ratio:1;border-radius:10px;overflow:hidden;background:#000;border:1px solid var(--line);font-size:11px;color:var(--mute);padding:4px;display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.2}
.hist img{width:100%;height:100%;object-fit:cover}
.empty{color:var(--dim);font-size:13px}
/* plein écran émission */
#stage{position:fixed;inset:0;z-index:50;background:#000;display:none;flex-direction:column;align-items:center;justify-content:center}
#stage.on{display:flex}
#stage.white{background:#fff}
#grid{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:2%;background:#000;padding:2%}
#grid i{display:block;background:#fff}
#qrc{image-rendering:pixelated}
#stageTop{position:absolute;top:calc(var(--sat) + 14px);left:0;right:0;text-align:center;font-size:13px;color:#888;font-variant-numeric:tabular-nums}
#stageStop{position:absolute;bottom:calc(var(--sab) + 40px);left:50%;transform:translateX(-50%);padding:12px 26px;border-radius:99px;background:rgba(80,80,80,.55);color:#fff;font-weight:700;font-size:15px;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.toast{position:fixed;left:50%;bottom:calc(var(--sab) + 50px);transform:translateX(-50%) translateY(20px);background:#fff;color:#1b1035;padding:10px 16px;border-radius:12px;font-weight:700;font-size:14px;opacity:0;transition:.3s;z-index:60;pointer-events:none;max-width:90%;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%)}
.hide{display:none!important}
</style>
</head>
<body>
<main>
  <div class="eyebrow">Transfert sans réseau</div>
  <h1>Télépixel</h1>
  <p class="sub">Une image devient du son ou de la lumière. L'autre téléphone écoute ou regarde, et la reconstruit.</p>

  <div class="seg" id="tabs">
    <button data-t="send" class="on">Envoyer</button>
    <button data-t="recv">Recevoir</button>
  </div>

  <!-- ============ ENVOYER ============ -->
  <section id="send">
    <div class="modes" id="sModes"></div>

    <div class="card">
      <div class="kind" id="kind">
        <button class="chip on" data-k="img">Image</button>
        <button class="chip" data-k="txt">Texte</button>
      </div>
      <div id="imgBox">
        <label class="drop" id="drop">
          <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#c4b5fd" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-9 9"/></svg>
          <b>Choisir une image</b>
          <span>Photo, capture d'écran, dessin…</span>
          <input type="file" id="file" accept="image/*">
        </label>
        <div class="pv" id="pv">
          <figure><img id="orig" alt=""><figcaption>Originale</figcaption></figure>
          <figure><canvas id="small"></canvas><figcaption id="smallCap">Envoyée</figcaption></figure>
        </div>
      </div>
      <div id="txtBox" class="hide">
        <textarea id="txt" maxlength="2000" placeholder="Écris un message…">Salam ! Ce message a voyagé par ondes.</textarea>
      </div>
    </div>

    <div class="card" id="setCard">
      <h3>Compression</h3>
      <div id="imgSet">
        <div class="row"><label>Taille</label><output id="szOut"></output></div>
        <div class="opts" id="szOpts"></div>
        <div class="row"><label>Couleurs</label><output id="colOut"></output></div>
        <div class="opts" id="colOpts"></div>
        <div class="row"><label>Tramage (plus joli, plus lourd)</label><button class="tog" id="dith"></button></div>
      </div>
      <div class="row" id="speedRow"><label>Vitesse lumière</label><output id="spdOut"></output></div>
      <input type="range" id="spd" min="3" max="10" step="1" value="6">
      <div class="est" id="est"></div>
      <div class="size" id="sizeInfo"></div>
    </div>

    <button class="big" id="go" disabled>Émettre</button>
    <div class="card hide" id="txCard" style="margin-top:14px">
      <canvas class="viz" id="txViz" width="600" height="300"></canvas>
      <div class="stat"><span id="txInfo"></span><b id="txPkt"></b></div>
    </div>
    <p class="hint" id="sendHint"></p>
  </section>

  <!-- ============ RECEVOIR ============ -->
  <section id="recv" class="hide">
    <div class="modes r3" id="rModes"></div>
    <div class="card">
      <div id="rSound">
        <canvas class="viz" id="rxViz" width="600" height="300"></canvas>
      </div>
      <div id="rCam" class="hide">
        <div class="cam"><video id="vid" playsinline muted autoplay></video><div class="guide" id="guide"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div></div>
      </div>
      <div class="stat"><span id="rxStatus">Prêt</span><b id="rxCount"></b></div>
      <div class="bar"><i id="rxBar"></i></div>
      <div class="cells" id="cells"></div>
    </div>
    <button class="big" id="listen">Écouter</button>
    <p class="hint" id="recvHint"></p>

    <div class="card result" id="result" style="margin-top:14px">
      <h3>Reçu</h3>
      <div id="resBody"></div>
      <div class="btns">
        <button class="btn2" id="resSave">Enregistrer</button>
        <button class="btn2" id="resShare">Partager</button>
      </div>
    </div>

    <div class="card" style="margin-top:14px">
      <h3>Derniers reçus</h3>
      <div class="hist" id="hist"></div>
    </div>
  </section>
</main>

<div id="stage">
  <div id="stageTop"></div>
  <div id="grid"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
  <canvas id="qrc"></canvas>
  <button id="stageStop">Arrêter</button>
</div>
<div class="toast" id="toast"></div>

<script src="vendor/qrcode.js"></script>
<script src="vendor/jsQR.js"></script>
<script src="app.js"></script>
</body>
</html>

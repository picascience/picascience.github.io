<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a0609"/>
      <stop offset=".55" stop-color="#991b1b"/>
      <stop offset="1" stop-color="#ef4444"/>
    </linearGradient>
    <radialGradient id="gl" cx=".3" cy=".15" r=".8">
      <stop offset="0" stop-color="#fff" stop-opacity=".2"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-opacity=".28"/>
    </filter>
    <marker id="ar" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="3.2" markerHeight="3.2" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#fde68a"/>
    </marker>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#gl)"/>
  <g filter="url(#sh)">
    <!-- deux ensembles (patates) -->
    <ellipse cx="160" cy="256" rx="78" ry="138" fill="none" stroke="#fff" stroke-width="18"/>
    <ellipse cx="352" cy="256" rx="78" ry="138" fill="none" stroke="#fff" stroke-width="18"/>
    <!-- éléments -->
    <circle cx="160" cy="190" r="17" fill="#fff"/>
    <circle cx="160" cy="320" r="17" fill="#fff"/>
    <circle cx="352" cy="190" r="17" fill="#fff"/>
    <circle cx="352" cy="320" r="17" fill="#fff"/>
    <!-- flèches f -->
    <path d="M186 190 L318 190" stroke="#fde68a" stroke-width="16" stroke-linecap="round" fill="none" marker-end="url(#ar)"/>
    <path d="M186 320 L318 320" stroke="#fde68a" stroke-width="16" stroke-linecap="round" fill="none" marker-end="url(#ar)"/>
  </g>
</svg>

<g fill="#fff" opacity=".85"><rect x="20" y="354" width="70" height="12" rx="6"/><rect x="150" y="354" width="70" height="12" rx="6"/><rect x="290" y="354" width="70" height="12" rx="6"/><rect x="420" y="354" width="70" height="12" rx="6"/></g>

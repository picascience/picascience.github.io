  const KEY = { ennemi: 1, Mushaf: 1 };
  function drawQuote(ctx, t) {
    const out = prog(t, CUE.out3 - 0.1, CUE.out3 + 0.3);
    if (t < CUE.words[0] || out >= 1) return;
    const A = 1 - out, size = 80, sp = TX.width('serifI', ' ', size) * 1.25;
    glow(ctx, SPR.dark, CX, 1300, 640, 0.86 * A * prog(t, CUE.words[0], CUE.words[0] + 0.4));
    let wi = 0;
    for (let l = 0; l < LINES.length; l++) {
      let tw = 0;
      for (let k = 0; k < LINES[l].length; k++) tw += TX.width('serifI', LINES[l][k], size) + (k ? sp : 0);
      let x = CX - tw / 2;
      for (let k = 0; k < LINES[l].length; k++) {
        const w = LINES[l][k], ww = TX.width('serifI', w, size), p = clamp((t - CUE.words[wi]) / 0.22);
        if (p > 0) {
          const e = ease.outCubic(p), key = KEY[w.replace(',', '')];
          txt(ctx, 'serifI', w, x, 1150 + l * 98 + (1 - e) * 18, size, rgba(key ? PAL.goldHi : PAL.ivory, 1), 'left', A * clamp(p * 2));
        }
        x += ww + sp;
        wi++;
      }
    }
    const bp = clamp((t - CUE.big) / 0.3);
    if (bp > 0) {
      const s = TX.fit('display', 'TUEZ-MOI. »', 900, 250);
      txtSlam(ctx, 'display', 'TUEZ-MOI. »', CX, 1150 + 3 * 98 + 40 + TX.cap('display') * s * 0.86, s, rgba(PAL.ivory, 1), bp, { from: 2.6, stagger: 0.03, alpha: A });
    }
    const cp = prog(t, CUE.big + 0.7, CUE.big + 1.2);
    txt(ctx, 'serifI', 'Ibn Taymiyya, rapporté par Ibn Kathîr', CX, 1728, 38, rgba(PAL.goldHi, 1), 'center', 0.8 * A * cp);
  }

  function draw(ctx, t) {
    const out = prog(t, CUE.out3, CUE.cut4 - 0.1), A = 1 - ease.inQuad(out);
    const rev = ease.outCubic(prog(t, CUE.cut3, CUE.cut3 + 1.3));

    /* Fond de carte : courbes de niveau révélées en onde, carroyage, route de Damas. */
    ctx.save();
    ctx.beginPath();
    ctx.arc(SX, SY, 60 + rev * 1500, 0, TAU);
    ctx.clip();
    for (let i = 0; i < TOPO.length; i++) {
      ctx.strokeStyle = rgba(i % 3 === 0 ? PAL.gold : PAL.goldDeep, (i % 3 === 0 ? 0.5 : 0.42) * A);
      ctx.lineWidth = i % 3 === 0 ? 1.4 : 1;
      ctx.stroke(TOPO[i]);
    }
    ctx.beginPath();
    for (let x = 0; x <= W; x += 180) { ctx.moveTo(x, -80); ctx.lineTo(x, H + 80); }
    for (let y = 0; y <= H + 80; y += 180) { ctx.moveTo(-80, y); ctx.lineTo(W + 80, y); }
    ctx.strokeStyle = rgba(PAL.gold, 0.1 * A);
    ctx.lineWidth = 1;
    ctx.stroke();
    ctx.setLineDash([14, 12]);
    ctx.beginPath();
    ctx.moveTo(540, 240);
    ctx.bezierCurveTo(600, 420, 430, 560, SX - 40, SY);
    ctx.bezierCurveTo(600, 900, 520, 1300, 640, H + 60);
    ctx.strokeStyle = rgba(RIVERISH, 0.4 * A);
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.restore();

    /* Cercles de portée (hérités de l'astrolabe) et graduations. */
    ctx.beginPath();
    for (let k = 0; k < 3; k++) { ctx.moveTo(SX + MATCH.rings.r[k], SY); ctx.arc(SX, SY, MATCH.rings.r[k], 0, TAU); }
    glowStroke(ctx, PAL.gold, 1.9, (t < CUE.cut3 + 0.6 ? 1 : lerp(1, 0.5, prog(t, CUE.cut3 + 0.6, CUE.cut3 + 1.6))) * A, 0.9);
    ctx.beginPath();
    for (let i = 0; i < 72; i++) {
      const a = (i / 72) * TAU + t * 0.02, r0 = MATCH.rings.r[2], r1 = r0 + (i % 6 === 0 ? 20 : 9);
      ctx.moveTo(SX + Math.cos(a) * r0, SY + Math.sin(a) * r0);
      ctx.lineTo(SX + Math.cos(a) * r1, SY + Math.sin(a) * r1);
    }
    ctx.strokeStyle = rgba(PAL.gold, 0.55 * rev * A);
    ctx.lineWidth = 1.2;
    ctx.stroke();

    /* Repère de Damas, au nord : la mosquée réduite à son emprise. */
    const dm = prog(t, CUE.cut3 + 0.1, CUE.cut3 + 0.7);
    ctx.beginPath();
    ctx.rect(540 - lerp(58, 16, dm), 205 - lerp(37.2, 16, dm), lerp(116, 32, dm), lerp(74.4, 32, dm));
    glowStroke(ctx, PAL.goldHi, 2, A, 0.9);
    txtTracked(ctx, 'serif', 'DAMAS', 578, 216, 30, 6, rgba(PAL.goldHi, 1), 'left', dm * A * 0.9);
    txt(ctx, 'serif', 'N', 150, 250, 30, rgba(PAL.goldHi, 1), 'center', 0.7 * rev * A);
    ctx.beginPath();
    ctx.moveTo(150, 330); ctx.lineTo(150, 268); ctx.moveTo(140, 284); ctx.lineTo(150, 266); ctx.lineTo(160, 284);
    ctx.strokeStyle = rgba(PAL.gold, 0.7 * rev * A);
    ctx.lineWidth = 1.6;
    ctx.stroke();

    for (let i = 0; i < VEC.length; i++) drawVector(ctx, t, VEC[i], i);
    const la = win(t, 22.0, 22.5, CUE.big - 0.4, CUE.big) * A;
    txtTracked(ctx, 'serif', 'ARMÉE MONGOLE', 1010, 520, 26, 6, rgba([255, 170, 150], 1), 'right', 0.85 * la);

    /* Onde de choc du grand impact. */
    const bd = t - CUE.big;
    if (bd > 0 && bd < 1.4) {
      const e = ease.outCubic(bd / 1.4);
      ctx.beginPath();
      ctx.arc(SX, SY, SR + e * 1500, 0, TAU);
      glowStroke(ctx, PAL.amber, 9 * (1 - e) + 1, (1 - e) * 0.95, 1);
      ctx.beginPath();
      ctx.arc(SX, SY, SR + e * 900, 0, TAU);
      glowStroke(ctx, PAL.goldHi, 3 * (1 - e) + 0.5, (1 - e) * 0.7, 1);
    }
    drawShield(ctx, t);
    drawAsh(ctx, t + 40, 0.6 * A, clamp(prog(t, 23, 26) - prog(t, CUE.big + 0.5, CUE.big + 1.5)));

    /* Titre : frappe plein cadre, puis repli en en-tête. */
    const tp = prog(t, CUE.title3, CUE.title3 + 0.3);
    if (tp > 0 && A > 0) {
      const mv = bez.soft(prog(t, 21.55, 22.05)), s = lerp(TX.fit('display', 'SHAQHAB', 880, 330), 118, mv);
      const y = lerp(SY + TX.cap('display') * s / 2, 390, mv), ta = A * (t < 21.5 ? 1 : 1);
      if (mv < 1) glow(ctx, SPR.dark, CX, SY, 620, 0.75 * (1 - mv) * clamp(tp * 2));
      txtSlam(ctx, 'display', 'SHAQHAB', lerp(CX, CX, mv), y, s, rgba(PAL.ivory, 1), tp, { from: 2.3, stagger: 0.05, alpha: ta });
      const dp = prog(t, CUE.date3, CUE.date3 + 0.35);
      txtTracked(ctx, 'display', '702 H / 1303', CX, y + lerp(110, 62, mv), lerp(84, 46, mv), lerp(14, 8, mv), rgba(PAL.goldHi, 1), 'center', ta * dp);
      txt(ctx, 'serifI', 'Marj as-Suffar, au sud de Damas, ramadan 702', CX, y + lerp(190, 112, mv), lerp(42, 34, mv), rgba(PAL.ivory, 1), 'center', 0.85 * ta * prog(t, CUE.date3 + 0.3, CUE.date3 + 0.7) * (1 - prog(t, CUE.words[0] - 0.3, CUE.words[0])));
    }
    drawQuote(ctx, t);
  }
  const RIVERISH = [188, 178, 142];
  return { draw };
})();

/* =====================================================================
   ACTE IV — LA CITADELLE : LA PRISON DEVENUE BIBLIOTHÈQUE (31 → 42 s)
   Travelling à travers les grilles, match-cut des barreaux en lignes de
   manuscrit, encre, pages tournées, calligraphie et traduction.
   ===================================================================== */
const A4 = (() => {
  const FOC = 900, GRIDS = [5, 10, 15], BAR_W = 0.14, VP = 900;
  const PG = { x: 110, y: 430, w: 860, h: 1060 }, NL = 12, PIV = 520;
  const lineY = j => 520 + j * 80;
  const TERMS = ['توحيد الألوهية', 'الإيمان', 'القدر', 'المنطق', 'علم السلوك', 'مقدمة التفسير', 'التفسير', 'الحديث', 'أصول الفقه', 'الفقه', 'الأسماء والصفات', 'توحيد الربوبية'];
  let pages = [];

  /* Pages du manuscrit : les intitulés des sciences du Majmû‘ al-Fatâwâ, à l'encre noire, rehauts rouges et points d'or. */
  function prepare() {
    pages = [];
    for (let n = 0; n < 2; n++) {
      const c = mkCanvas(PG.w, PG.h), g = c.getContext('2d');
      g.direction = 'rtl';
      g.textBaseline = 'alphabetic';
      g.textAlign = 'right';
      for (let j = 0; j < NL; j++) {
        const items = [];
        let tw = 0;
        g.font = F.naskh(50);
        for (let k = 0; k < 4; k++) {
          const s = TERMS[(j * 3 + k * 5 + n * 7) % TERMS.length], w = g.measureText(s).width;
          if (tw + w > PG.w - 150 - items.length * 30) break;
          items.push([s, w]);
          tw += w;
        }
        const gap = items.length > 1 ? (PG.w - 120 - tw) / (items.length - 1) : 0;
        let x = PG.w - 60;
        for (let k = 0; k < items.length; k++) {
          g.fillStyle = (j * 2 + k + n) % 7 === 0 ? '#7c1a12' : '#17100a';
          g.fillText(items[k][0], x, lineY(j) - PG.y - 14);
          x -= items[k][1] + gap;
          if (k < items.length - 1) {
            g.fillStyle = '#b58a2c';
            g.beginPath();
            pathStar(g, x + gap / 2, lineY(j) - PG.y - 30, 9, 4.5, 8, 0);
            g.fill();
          }
        }
      }
      pages.push(c);
    }
  }

  const camZ = t => (t < 32.3 ? 7.3 * ease.inOutCubic(prog(t, CUE.slam + 0.1, 32.3)) : 7.3 + 4.8 * ease.inOutCubic(prog(t, 32.3, CUE.turn0)));

  function drawCorridor(ctx, t, alpha) {
    const cz = camZ(t);
    /* Lueur au fond du couloir : le savoir qui attend derrière les grilles. */
    ctx.globalCompositeOperation = 'lighter';
    glow(ctx, SPR.gold, CX, VP, 420 + cz * 22, 0.34 * alpha);
    glow(ctx, SPR.warm, CX, VP, 120 + cz * 8, 0.3 * alpha);
    ctx.globalCompositeOperation = 'source-over';
    /* Assises de pierre : cadres successifs du couloir, qui fuient vers la caméra. */
    for (let k = 40; k >= 0; k--) {
      const z = k * 1.25 - 2, d = z - cz;
      if (d < 0.35) continue;
      const hw = (FOC * 3.1) / d, hh = (FOC * 5.2) / d, a = clamp(1.6 / d) * 0.5 * alpha * clamp((d - 0.35) * 2);
      ctx.strokeStyle = rgba([120, 112, 100], a);
      ctx.lineWidth = clamp(3 / d, 0.6, 4);
      ctx.strokeRect(CX - hw, VP - hh * 0.62, hw * 2, hh);
    }
    ctx.beginPath();
    for (let i = 0; i < 4; i++) {
      const sx = i % 2 ? 1 : -1, sy = i < 2 ? -0.62 : 0.38;
      ctx.moveTo(CX + sx * 20, VP + sy * 34);
      ctx.lineTo(CX + sx * 3100, VP + sy * 5200);
    }
    ctx.strokeStyle = rgba([120, 112, 100], 0.3 * alpha);
    ctx.lineWidth = 1.5;
    ctx.stroke();
    /* Rai de lumière volumétrique tombant d'un soupirail. */
    ctx.globalCompositeOperation = 'lighter';
    const beam = ctx.createLinearGradient(160, 0, 760, 1500);
    beam.addColorStop(0, rgba(PAL.goldHi, 0.2 * alpha));
    beam.addColorStop(1, rgba(PAL.gold, 0));
    ctx.fillStyle = beam;
    for (let k = 0; k < 3; k++) {
      const o = k * 120 + Math.sin(t * 0.7 + k) * 14;
      ctx.beginPath();
      ctx.moveTo(-60 + o, -80);
      ctx.lineTo(70 + o, -80);
      ctx.lineTo(800 + o * 1.5, 1640);
      ctx.lineTo(480 + o * 1.5, 1640);
      ctx.closePath();
      ctx.fill();
    }
    ctx.globalCompositeOperation = 'source-over';
    /* Grilles : barreaux verticaux en fer forgé, traverses rivetées, chaînes pendantes. */
    for (let gi = GRIDS.length - 1; gi >= 0; gi--) {
      const d = GRIDS[gi] - cz;
      if (d < 0.22) continue;
      const k = FOC / d, bw = BAR_W * k, fade = clamp((d - 0.22) / 0.9) * alpha, dark = clamp(1.25 - d * 0.07);
      ctx.globalAlpha = fade;
      for (let b = -8; b <= 17; b++) {
        const x = CX + (-2.25 + 0.5 * b) * k;
        if (x < -bw - 40 || x > W + bw + 40) continue;
        ctx.drawImage(SPR.iron, x - bw / 2, -100, bw, H + 200);
      }
      for (let r = 0; r < 3; r++) {
        const y = VP + [-3.2, -0.2, 2.6][r] * k, th = 0.2 * k;
        ctx.save();
        ctx.translate(0, y);
        ctx.rotate(-PI / 2);
        ctx.drawImage(SPR.iron, -th / 2, -100, th, W + 200);
        ctx.restore();
        ctx.fillStyle = 'rgba(150,154,164,0.9)';
        for (let b = -8; b <= 17; b++) {
          const x = CX + (-2.25 + 0.5 * b) * k;
          if (x < -40 || x > W + 40) continue;
          ctx.beginPath();
          ctx.arc(x, y, bw * 0.3, 0, TAU);
          ctx.fill();
        }
      }
      ctx.globalAlpha = (1 - dark) * 0.8 * fade;
      ctx.fillStyle = '#050506';
      ctx.fillRect(-100, -100, W + 200, H + 200);
      ctx.globalAlpha = 1;
      if (gi < 2) {
        const dc = d + 1.6, kc = FOC / dc;
        for (let c2 = 0; c2 < 2; c2++) {
          const x0 = CX + (c2 ? 1.9 : -2.1) * kc, sway = Math.sin(t * 1.3 + c2 * 2 + gi) * 0.05, ls = 0.2 * kc;
          ctx.strokeStyle = rgba([118, 122, 132], 0.8 * clamp((dc - 0.4) / 1.2) * alpha);
          ctx.lineWidth = Math.max(1.2, 0.035 * kc);
          for (let n = 0; n < 16; n++) {
            const y = VP - 5.2 * 0.62 * kc + n * ls * 0.8, x = x0 + Math.sin(sway * n * 0.5) * n * ls * 0.2;
            ctx.beginPath();
            if (n % 2) ctx.ellipse(x, y, ls * 0.26, ls * 0.5, 0, 0, TAU);
            else { ctx.moveTo(x, y - ls * 0.5); ctx.lineTo(x, y + ls * 0.5); }
            ctx.stroke();
          }
        }
      }
    }
  }

  /* Position finale des barreaux de la troisième grille (au terme du travelling). */
  const BARS = (() => {
    const k = FOC / (GRIDS[2] - 12.1), o = [];
    for (let b = 2; b <= 7; b++) o.push(CX + (-2.25 + 0.5 * b) * k);
    return { xs: o, w: BAR_W * k };
  })();

  /* Match-cut : chaque barreau se dédouble en deux filets d'or, l'ensemble pivote de 90° et devient la réglure du manuscrit. */
  function drawTurn(ctx, t, alpha) {
    const e = bez.ramp(prog(t, CUE.turn0, CUE.turn1 - 0.08));
    ctx.save();
    ctx.translate(CX, 960);
    ctx.rotate((-PI / 2) * e);
    for (let i = 0; i < BARS.xs.length; i++) {
      for (let s = 0; s < 2; s++) {
        const j = i * 2 + s, o0 = BARS.xs[i] - CX + (s ? 1 : -1) * BARS.w / 2, o1 = -(lineY(NL - 1 - j) - 960);
        const o = lerp(o0, o1, e), h = lerp(1150, 395, e);
        if (s === 0 && e < 0.7) {
          const o2 = lerp(BARS.xs[i] - CX + BARS.w / 2, -(lineY(NL - 2 - j) - 960), e);
          ctx.globalAlpha = (1 - e / 0.7) * alpha;
          ctx.drawImage(SPR.iron, Math.min(o, o2), -h, Math.abs(o2 - o), h * 2);
          ctx.globalAlpha = 1;
        }
        ctx.beginPath();
        ctx.moveTo(o, -h);
        ctx.lineTo(o, h);
        glowStroke(ctx, mixc([150, 156, 168], PAL.gold, clamp(e * 1.6)), lerp(3, 1.6, e), alpha * lerp(1, 0.75, e), clamp(e * 2));
      }
    }
    ctx.restore();
  }

  function drawPageBase(ctx, a, unroll) {
    const hh = (PG.h / 2) * unroll, cy = PG.y + PG.h / 2;
    ctx.globalCompositeOperation = 'lighter';
    glow(ctx, SPR.gold, CX, cy, 900, 0.28 * a);
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = a;
    ctx.drawImage(SPR.parch, 0, 70 + (PG.h / 2 - hh), PG.w, hh * 2, PG.x, cy - hh, PG.w, hh * 2);
    ctx.globalAlpha = 1;
  }
  function drawRuling(ctx, a) {
    ctx.beginPath();
    for (let j = 0; j < NL; j++) { ctx.moveTo(CX - 395, lineY(j)); ctx.lineTo(CX + 395, lineY(j)); }
    ctx.strokeStyle = rgba([150, 110, 40], 0.55 * a);
    ctx.lineWidth = 1.6;
    ctx.stroke();
  }
  /* Cadre enluminé : double filet d'or et écoinçons étoilés. */
  function drawFrame(ctx, a) {
    ctx.strokeStyle = rgba([150, 110, 40], 0.85 * a);
    ctx.lineWidth = 3;
    ctx.strokeRect(PG.x + 46, PG.y + 46, PG.w - 92, PG.h - 92);
    ctx.lineWidth = 1.2;
    ctx.strokeRect(PG.x + 58, PG.y + 58, PG.w - 116, PG.h - 116);
    ctx.fillStyle = rgba([150, 110, 40], 0.9 * a);
    ctx.beginPath();
    for (let i = 0; i < 4; i++) pathStar(ctx, PG.x + (i % 2 ? PG.w - 52 : 52), PG.y + (i < 2 ? 52 : PG.h - 52), 17, 8.5, 8, PI / 8);
    ctx.fill();
  }
  /* Calame : roseau taillé en biseau, posé à la tête d'écriture. */
  function drawQalam(ctx, x, y, a) {
    if (a <= 0.01) return;
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(-0.62);
    ctx.globalAlpha = a;
    const gr = ctx.createLinearGradient(0, -9, 0, 9);
    gr.addColorStop(0, '#d8b871');
    gr.addColorStop(0.5, '#a57a35');
    gr.addColorStop(1, '#5a3d17');
    ctx.fillStyle = gr;
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(34, -9);
    ctx.lineTo(330, -9);
    ctx.lineTo(330, 9);
    ctx.lineTo(26, 9);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = '#120c06';
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(20, -5.5);
    ctx.lineTo(16, 5.5);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
    ctx.globalAlpha = 1;
  }

  const CALLI = 'جَنَّتِي فِي صَدْرِي';
  const TR = ['« Que peuvent me faire mes ennemis ?', 'Mon paradis est dans ma poitrine…', 'Ma prison est une retraite spirituelle. »'];

  function drawManuscript(ctx, t) {
    const unroll = ease.outQuint(prog(t, CUE.turn0 + 0.5, CUE.turn1));
    if (unroll <= 0) return;
    /* Effondrement final : la page se réduit à une ligne, puis à un point d'encre (raccord vers l'acte V). */
    const cy = ease.inCubic(prog(t, CUE.coll0, 41.72)), cx = ease.inOutCubic(prog(t, 41.68, CUE.cut5));
    ctx.save();
    ctx.translate(CX, PIV);
    ctx.scale(Math.max(0.012, 1 - cx), Math.max(0.006, 1 - cy));
    ctx.translate(-CX, -PIV);
    drawPageBase(ctx, 1, unroll);
    let flip = -1, fp = 0;
    for (let i = 0; i < CUE.flips.length; i++) if (t >= CUE.flips[i]) { flip = i; fp = prog(t, CUE.flips[i], CUE.flips[i] + 0.3); }
    const hero = flip === CUE.flips.length - 1;
    const pageLayer = (idx, wp) => {
      if (!pages.length) return;
      /* Écriture de droite à gauche, ligne après ligne, en cascade. */
      for (let j = 0; j < NL; j++) {
        const lp = wp >= 1 ? 1 : ease.inOutQuad(clamp(wp * 2.4 - j * 0.12));
        if (lp <= 0) continue;
        const sy = lineY(j) - PG.y - 78, wpx = PG.w * lp;
        ctx.drawImage(pages[idx % 2], PG.w - wpx, sy, wpx, 96, PG.x + PG.w - wpx, PG.y + sy, wpx, 96);
      }
    };
    const wp = prog(t, CUE.write0, CUE.flips[0] - 0.05);
    if (!hero || fp < 1) drawRuling(ctx, hero ? 1 - fp : 1);
    if (flip < 0) {
      pageLayer(0, wp);
      const hj = Math.min(NL - 1, Math.floor(wp * 2.4 / 0.12)), hl = ease.inOutQuad(clamp(wp * 2.4 - hj * 0.12));
      if (wp > 0 && wp < 1) drawQalam(ctx, PG.x + PG.w - 60 - (PG.w - 120) * hl, lineY(hj) - 22, 1);
    } else {
      if (!hero) pageLayer(flip + 1, 1); else drawFrame(ctx, 1);
      if (fp < 1) {
        /* Feuillet qui tourne autour de la reliure (bord droit). */
        const e = ease.inOutCubic(fp), wsc = Math.cos(e * PI / 2);
        ctx.save();
        ctx.translate(PG.x + PG.w, 0);
        ctx.scale(wsc, 1);
        ctx.translate(-(PG.x + PG.w), 0);
        ctx.drawImage(SPR.parch, 0, 70, PG.w, PG.h, PG.x, PG.y, PG.w, PG.h);
        drawRuling(ctx, 1);
        pageLayer(flip, 1);
        ctx.fillStyle = 'rgba(40,24,8,' + (0.55 * e).toFixed(3) + ')';
        ctx.fillRect(PG.x, PG.y, PG.w, PG.h);
        ctx.restore();
      }
    }
    if (hero) {
      /* Calligraphie tracée au calame, de droite à gauche. */
      const kp = ease.inOutCubic(prog(t, CUE.calli0, CUE.calli1)), size = TX.fit('ruqaa', CALLI, 640, 260), by = 800;
      if (kp > 0) {
        ctx.save();
        ctx.beginPath();
        ctx.rect(CX + 340 - 680 * kp, by - 330, 680 * kp + 40, 480);
        ctx.clip();
        txtAr(ctx, 'ruqaa', CALLI, CX, by, size, '#150d06', 'center', 1);
        ctx.restore();
        if (kp < 1) drawQalam(ctx, CX + 340 - 680 * kp, by - 30 + Math.sin(kp * 30) * 22, 1);
        const up = ease.outExpo(prog(t, CUE.calli1 - 0.1, CUE.calli1 + 0.5));
        ctx.fillStyle = rgba([150, 110, 40], 0.9);
        ctx.fillRect(CX - 150 * up, by + 92, 300 * up, 3);
        ctx.beginPath();
        pathStar(ctx, CX, by + 93.5, 13 * up, 6.5 * up, 8, PI / 8);
        ctx.fill();
      }
      for (let i = 0; i < 3; i++) {
        const sz = TX.fit('serifI', TR[i], 716, 60);
        txtRise(ctx, 'serifI', TR[i], CX, 1015 + i * 92, sz, '#2a1a0c', prog(t, CUE.tr[i], CUE.tr[i] + 0.5), 'center', 1);
      }
      txt(ctx, 'serifI', 'rapporté par Ibn al-Qayyim', CX, 1372, 38, '#6b4a1c', 'center', prog(t, CUE.tr[2] + 0.5, CUE.tr[2] + 1.0));
    }
    ctx.restore();

    /* En-tête et compteur des volumes, hors de la page. */
    const ha = win(t, CUE.write0, CUE.write0 + 0.4, CUE.coll0 - 0.1, CUE.coll0 + 0.15);
    if (ha > 0) {
      txtTracked(ctx, 'display', 'MAJMÛ‘ AL-FATÂWÂ', CX, 372, 76, 10, rgba(PAL.ivory, 1), 'center', ha);
      const n = Math.round(lerp(1, 37, ease.inOutQuad(prog(t, CUE.write0 + 0.2, CUE.calli0 - 0.1))));
      const wn = TX.width('display', '37', 132), wv = TX.trackedWidth('display', 'VOLUMES', 76, 8), x0 = CX - (wn + 26 + wv) / 2;
      txt(ctx, 'display', String(n), x0 + wn, 1640, 132, rgba(PAL.goldHi, 1), 'right', ha);
      txtTracked(ctx, 'display', 'VOLUMES', x0 + wn + 26, 1640, 76, 8, rgba(PAL.ivory, 1), 'left', ha);
    }
  }

  function draw(ctx, t) {
    const corr = 1 - prog(t, CUE.turn0 + 0.25, CUE.turn1 - 0.1);
    if (corr > 0) {
      ctx.save();
      const push = bez.ramp(prog(t, CUE.turn0, CUE.turn1)), sc = 1 + push * 0.5;
      ctx.translate(CX, VP);
      ctx.scale(sc, sc);
      ctx.translate(-CX, -VP);
      drawCorridor(ctx, t, corr);
      ctx.restore();
    }
    drawManuscript(ctx, t);
    if (t >= CUE.turn0 && t < CUE.turn1 + 0.3) drawTurn(ctx, t, 1 - prog(t, CUE.turn1 - 0.05, CUE.turn1 + 0.3));
    const la = win(t, CUE.slam + 0.25, CUE.slam + 0.6, CUE.turn0 - 0.1, CUE.turn0 + 0.2);
    if (la > 0) {
      glow(ctx, SPR.dark, CX, 1440, 560, 0.8 * la);
      txtSlam(ctx, 'display', 'LA CITADELLE', CX, 1440, TX.fit('display', 'LA CITADELLE', 820, 240), rgba(PAL.ivory, 1), prog(t, CUE.slam + 0.25, CUE.slam + 0.6), { from: 1.8, stagger: 0.04, alpha: la });
      txtTracked(ctx, 'display', 'DAMAS  726 – 728 H', CX, 1528, 56, 9, rgba(PAL.goldHi, 1), 'center', la * prog(t, CUE.slam + 0.55, CUE.slam + 0.9));
    }
    drawGoldDust(ctx, t, 0.35 * (1 - prog(t, CUE.coll0, CUE.cut5)), 60, 4);
    /* Point d'encre qui subsiste à la fin de l'effondrement. */
    const dp = prog(t, 41.7, CUE.cut5);
    if (dp > 0) A5.drop(ctx, CX, PIV, 15 * dp, 0);
  }
  return { draw, prepare };
})();

/* =====================================================================
   ACTE V — L'HÉRITAGE ÉTERNEL (42 → 50 s)
   Une goutte d'encre tombe, l'onde dorée déploie un pavage d'étoiles à
   huit branches (méthode de Hankin sur le pavage 4.8.8), rayons et poussière d'or.
   ===================================================================== */
const A5 = (() => {
  const MX = 540, MY = 1000, PER = 300, RING = 115, NB = 13;
  const BUCK = [];
  for (let i = 0; i < NB; i++) BUCK.push(new Path2D());

  /* Méthode de Hankin (« polygones en contact ») : de chaque milieu d'arête partent deux rayons à 67,5°. */
  function hankin(v) {
    const n = v.length, th = 67.5 * DEG, M = [], E = [];
    for (let i = 0; i < n; i++) {
      const a = v[i], b = v[(i + 1) % n], d = Math.hypot(b[0] - a[0], b[1] - a[1]);
      M.push([(a[0] + b[0]) / 2, (a[1] + b[1]) / 2]);
      E.push([(b[0] - a[0]) / d, (b[1] - a[1]) / d]);
    }
    const rot = (e, an) => [e[0] * Math.cos(an) - e[1] * Math.sin(an), e[0] * Math.sin(an) + e[1] * Math.cos(an)];
    for (let i = 0; i < n; i++) {
      const j = (i + 1) % n, da = rot(E[i], th), db = rot([-E[j][0], -E[j][1]], -th);
      const den = da[0] * db[1] - da[1] * db[0];
      if (Math.abs(den) < 1e-9) continue;
      const u = ((M[j][0] - M[i][0]) * db[1] - (M[j][1] - M[i][1]) * db[0]) / den;
      const px = M[i][0] + da[0] * u, py = M[i][1] + da[1] * u;
      const k = Math.min(NB - 1, Math.floor(Math.hypot(px - MX, py - MY) / RING));
      BUCK[k].moveTo(M[i][0], M[i][1]);
      BUCK[k].lineTo(px, py);
      BUCK[k].lineTo(M[j][0], M[j][1]);
    }
  }
  (() => {
    const a = PER / (1 + Math.SQRT2), ro = (PER / 2) / Math.cos(PI / 8), rs = a / Math.SQRT2;
    for (let j = -5; j <= 5; j++) {
      for (let i = -4; i <= 4; i++) {
        const ox = MX + i * PER, oy = MY + j * PER, oct = [], sq = [];
        for (let k = 0; k < 8; k++) oct.push([ox + Math.cos(PI / 8 + (k * PI) / 4) * ro, oy + Math.sin(PI / 8 + (k * PI) / 4) * ro]);
        for (let k = 0; k < 4; k++) sq.push([ox + PER / 2 + Math.cos((k * PI) / 2) * rs, oy + PER / 2 + Math.sin((k * PI) / 2) * rs]);
        hankin(oct);
        hankin(sq);
      }
    }
  })();

  /* Goutte d'encre : corps noir brillant, liseré d'or, reflet. stretch étire la goutte dans sa chute. */
  function drop(ctx, x, y, r, stretch) {
    if (r < 0.5) return;
    ctx.globalCompositeOperation = 'lighter';
    glow(ctx, SPR.gold, x, y, r * 7, 0.5);
    ctx.globalCompositeOperation = 'source-over';
    ctx.beginPath();
    ctx.moveTo(x, y - r * (1.2 + stretch * 2.6));
    ctx.bezierCurveTo(x + r * 0.3, y - r * 0.9, x + r * 1.05, y - r * 0.2, x + r, y + r * 0.25);
    ctx.arc(x, y + r * 0.25, r, 0, PI);
    ctx.bezierCurveTo(x - r * 1.05, y - r * 0.2, x - r * 0.3, y - r * 0.9, x, y - r * (1.2 + stretch * 2.6));
    ctx.closePath();
    ctx.fillStyle = '#020203';
    ctx.fill();
    ctx.strokeStyle = rgba(PAL.goldHi, 0.95);
    ctx.lineWidth = Math.max(1.2, r * 0.1);
    ctx.stroke();
    ctx.fillStyle = 'rgba(255,246,214,0.9)';
    ctx.beginPath();
    ctx.ellipse(x - r * 0.36, y, r * 0.15, r * 0.3, 0.4, 0, TAU);
    ctx.fill();
  }

  function blotPath(ctx, R, t) {
    ctx.beginPath();
    for (let i = 0; i <= 120; i++) {
      const a = (i / 120) * TAU;
      const n = 1 + 0.1 * (noise1(i * 0.23 + 3) - 0.5) * 2 + 0.2 * Math.pow(noise1((i % 120) * 0.9 + 40), 6) + 0.012 * Math.sin(a * 5 + t);
      const blend = i > 110 ? (i - 110) / 10 : 0, n0 = 1 + 0.1 * (noise1(3) - 0.5) * 2 + 0.2 * Math.pow(noise1(40), 6) + 0.012 * Math.sin(t);
      const r = R * lerp(n, n0, blend);
      if (i === 0) ctx.moveTo(MX + Math.cos(a) * r, MY + Math.sin(a) * r); else ctx.lineTo(MX + Math.cos(a) * r, MY + Math.sin(a) * r);
    }
    ctx.closePath();
  }

  const EPI = ['« L’encre', 'des', 'savants', 'survit', 'aux', 'empires. »'];

  function draw(ctx, t) {
    const d = t - CUE.hit;
    if (d < 0) {
      /* Chute : la goutte se détache du point d'encre et accélère. */
      const p = prog(t, CUE.cut5, CUE.hit), e = p * p;
      ctx.globalCompositeOperation = 'lighter';
      glow(ctx, SPR.gold, MX, MY, 420, 0.1 + 0.18 * e);
      ctx.globalCompositeOperation = 'source-over';
      drop(ctx, MX, lerp(520, MY - 20, e), lerp(15, 30, clamp(p * 3)), e * 0.6);
      drawGoldDust(ctx, t, 0.3, 60, 4);
      return;
    }
    const wave = 40 + ease.outCubic(clamp(d / 2.2)) * 1750;
    const zoom = 1 + 0.018 * d + 0.05 * ease.outCubic(clamp(d / 1.5)), rotn = 0.012 * Math.sin(d * 0.35);
    const pulse = Math.exp(-Math.max(0, t - CUE.title) * 1.8) * (t >= CUE.title ? 1 : 0);

    /* Rayons volumétriques : tracés en basse définition puis agrandis, d'où leur douceur. */
    const rc = SPR.rays, rg = rc.getContext('2d');
    rg.setTransform(1, 0, 0, 1, 0, 0);
    rg.globalCompositeOperation = 'source-over';
    rg.clearRect(0, 0, 270, 480);
    rg.setTransform(0.25, 0, 0, 0.25, 0, 0);
    rg.globalCompositeOperation = 'lighter';
    const rgr = rg.createRadialGradient(MX, MY, 120, MX, MY, 1250);
    rgr.addColorStop(0, rgba(PAL.goldHi, 0.34));
    rgr.addColorStop(1, rgba(PAL.gold, 0));
    rg.fillStyle = rgr;
    for (let i = 0; i < 22; i++) {
      const a = (i / 22) * TAU + d * 0.05 * (i % 2 ? 1 : -0.6) + hash1(i * 3.3) * 0.3, hw = 0.02 + hash1(i * 7.7) * 0.06, len = 1300 * (0.6 + 0.4 * noise1(d * 0.5 + i * 3.1));
      rg.beginPath();
      rg.moveTo(MX, MY);
      rg.lineTo(MX + Math.cos(a - hw) * len, MY + Math.sin(a - hw) * len);
      rg.lineTo(MX + Math.cos(a + hw) * len, MY + Math.sin(a + hw) * len);
      rg.closePath();
      rg.fill();
    }
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = clamp(d / 0.9) * (0.75 + 0.5 * pulse);
    ctx.drawImage(rc, 0, 0, W, H);
    ctx.globalAlpha = 1;
    glow(ctx, SPR.gold, MX, MY, 950, 0.3 * clamp(d * 2));
    ctx.globalCompositeOperation = 'source-over';

    /* Pavage : chaque couronne s'ouvre au passage de l'onde. Double filet d'entrelacs. */
    ctx.save();
    ctx.translate(MX, MY);
    ctx.rotate(rotn);
    ctx.scale(zoom, zoom);
    ctx.translate(-MX, -MY);
    for (let k = 0; k < NB; k++) {
      const a = clamp((wave - k * RING) / (RING * 1.6));
      if (a <= 0) break;
      const bloom = 1 + (1 - ease.outCubic(a)) * 0.9;
      ctx.lineJoin = 'round';
      ctx.lineCap = 'round';
      ctx.globalCompositeOperation = 'lighter';
      ctx.strokeStyle = rgba(PAL.gold, 0.17 * a * bloom);
      ctx.lineWidth = 24;
      ctx.stroke(BUCK[k]);
      ctx.globalCompositeOperation = 'source-over';
      ctx.strokeStyle = rgba(mixc(PAL.gold, PAL.goldHi, clamp(bloom - 1 + pulse * 0.6)), 0.95 * a);
      ctx.lineWidth = 10;
      ctx.stroke(BUCK[k]);
      ctx.strokeStyle = rgba(PAL.bg, a);
      ctx.lineWidth = 4.8;
      ctx.stroke(BUCK[k]);
    }
    ctx.restore();

    /* Front d'onde doré. */
    if (d < 2.2) {
      const f = 1 - d / 2.2;
      ctx.beginPath();
      ctx.arc(MX, MY, wave, 0, TAU);
      glowStroke(ctx, PAL.goldHi, 2 + 9 * f, 0.95 * f, 1);
    }

    /* Tache d'encre : le cœur noir d'où part toute la lumière. */
    const R = 372 * bez.snap(clamp(d / 0.55)) * (1 + 0.01 * Math.sin(d * 1.4));
    ctx.globalCompositeOperation = 'lighter';
    glow(ctx, SPR.gold, MX, MY, R * 1.9, 0.55 + 0.3 * pulse);
    ctx.globalCompositeOperation = 'source-over';
    glow(ctx, SPR.dark, MX, MY, 640, 0.9 * clamp(d / 0.6));
    blotPath(ctx, R, d);
    ctx.fillStyle = '#030304';
    ctx.fill();
    glowStroke(ctx, PAL.goldHi, 2.2, 0.9, 1);
    ctx.fillStyle = '#030304';
    for (let i = 0; i < 14; i++) {
      const a = hash1(i * 5.1 + 2) * TAU, rr = R * (1.12 + hash1(i * 3.7) * 0.5) * ease.outCubic(clamp(d / 0.5)), s = 5 + hash1(i * 9.3) * 15;
      ctx.beginPath();
      ctx.arc(MX + Math.cos(a) * rr, MY + Math.sin(a) * rr, s, 0, TAU);
      ctx.fill();
      ctx.strokeStyle = rgba(PAL.gold, 0.8);
      ctx.lineWidth = 1.4;
      ctx.stroke();
    }
    if (d < 0.5) {
      ctx.beginPath();
      for (let i = 0; i < 26; i++) {
        const a = hash1(i * 2.9) * TAU, e = ease.outCubic(d / 0.5), r0 = 40 + e * (160 + hash1(i * 6.1) * 380);
        ctx.moveTo(MX + Math.cos(a) * r0, MY + Math.sin(a) * r0);
        ctx.lineTo(MX + Math.cos(a) * (r0 + 60 * (1 - e)), MY + Math.sin(a) * (r0 + 60 * (1 - e)));
      }
      ctx.strokeStyle = rgba(PAL.goldHi, 1 - d / 0.5);
      ctx.lineWidth = 3;
      ctx.stroke();
    }

    drawGoldDust(ctx, t, 0.4 + 0.6 * clamp(d / 1.5), 170, 5);

    /* Titre final. */
    const tp = prog(t, CUE.title, CUE.title + 0.34);
    txtAr(ctx, 'ruqaa', 'شيخ الإسلام ابن تيمية', MX, 842, 76, rgba(PAL.goldHi, 1), 'center', prog(t, CUE.title - 0.75, CUE.title - 0.25));
    const tr = lerp(60, 17, ease.outExpo(prog(t, CUE.title - 0.4, CUE.title + 0.2)));
    txtTracked(ctx, 'display', 'CHEIKH AL-ISLAM', MX, 928, 58, tr, rgba(PAL.ivory, 1), 'center', prog(t, CUE.title - 0.4, CUE.title - 0.15));
    if (tp > 0) {
      const s = TX.fit('display', 'IBN TAYMIYYA', 600, 200), base = 958 + TX.cap('display') * s;
      txtSlam(ctx, 'display', 'IBN TAYMIYYA', MX, base, s, rgba(PAL.ivory, 1), tp, { from: 2.4, stagger: 0.04 });
      const rp = ease.outExpo(prog(t, CUE.title + 0.2, CUE.title + 0.7));
      ctx.fillStyle = rgba(PAL.gold, 1);
      ctx.fillRect(MX - 300 * rp, base + 26, 600 * rp, 4);
      txtTracked(ctx, 'display', '661 – 728 H', MX, base + 104, 66, 12, rgba(PAL.goldHi, 1), 'center', prog(t, CUE.dates, CUE.dates + 0.4));
    }
    /* Épigraphe, mot après mot. */
    const size = 58, sp = TX.width('serifI', ' ', size) * 1.2;
    let tw = 0;
    for (let i = 0; i < EPI.length; i++) tw += TX.width('serifI', EPI[i], size) + (i ? sp : 0);
    let x = MX - tw / 2;
    if (t >= CUE.epi) glow(ctx, SPR.dark, MX, 1490, 560, 0.75 * prog(t, CUE.epi, CUE.epi + 0.5));
    for (let i = 0; i < EPI.length; i++) {
      const p = clamp((t - CUE.epi - i * 0.17) / 0.4);
      if (p > 0) txt(ctx, 'serifI', EPI[i], x, 1508 + (1 - ease.outCubic(p)) * 16, size, rgba(PAL.ivory, 1), 'left', p);
      x += TX.width('serifI', EPI[i], size) + sp;
    }
  }
  return { draw, drop };
})();

/* =====================================================================
   20. COMPOSITEUR, HORLOGE ET INTERFACE
   ===================================================================== */
const $ = id => document.getElementById(id);
const frameEl = $('frame'), canvas = $('edit'), introEl = $('intro'), hudEl = $('hud'), goBtn = $('go'), recBtn = $('rec');
const ctx = canvas.getContext('2d', { alpha: false });
const PREROLL = 0.9;                       // noir silencieux avant 0:00, le temps que le plein écran se stabilise
const PREVIEW_T = 2.82;                    // image fixe affichée derrière l'écran de lancement
const QUALITY = [1, 0.85, 0.72, 0.6, 0.5]; // crans du régulateur de définition
const ACT_NAMES = ['Acte I', 'Acte II', 'Acte III', 'Acte IV', 'Acte V'];
const ACT_STARTS = [0, CUE.cut2, CUE.cut3, CUE.cut4, CUE.cut5];

const st = {
  mode: 'boot',            // boot | idle | playing | paused | ended
  t: PREVIEW_T, last: 0, dirty: true,
  clean: false, needSession: false, autoPaused: false, fixedWidth: 0,
  rec: null, recArmed: null, wake: null, lastTap: 0,
  gov: { level: 0, n: 0, sum: 0, skip: 40, prevAvg: 0, pending: false, locked: false }
};

/* ---------- Mise à l'échelle 9:16 et netteté (devicePixelRatio, plafonné à la 4K) ---------- */
let grainPats = null;
function layout() {
  const vw = window.innerWidth || 360, vh = window.innerHeight || 640;
  const s = Math.min(vw / W, vh / H);
  const cw = Math.max(90, Math.floor(W * s)), ch = Math.round((cw * H) / W);
  frameEl.style.width = cw + 'px';
  frameEl.style.height = ch + 'px';
  frameEl.style.fontSize = (cw / 27).toFixed(2) + 'px';
  const dpr = Math.min(window.devicePixelRatio || 1, 4);
  let bw = Math.round(clamp(cw * dpr * QUALITY[st.gov.level], 360, 2160));
  if (st.rec || st.recArmed) bw = W;
  if (st.fixedWidth) bw = st.fixedWidth;
  const bh = Math.round((bw * H) / W);
  if (canvas.width !== bw || canvas.height !== bh) {
    canvas.width = bw;
    canvas.height = bh;
    grainPats = null;
  }
  st.dirty = true;
}

/* ---------- Aberration chromatique : séparation radiale des canaux rouge et bleu ---------- */
const POST = { r: null, b: null, rc: null, bc: null };
function aberrate(amount) {
  const w = canvas.width, h = canvas.height;
  if (!POST.r || POST.r.width !== w || POST.r.height !== h) {
    POST.r = mkCanvas(w, h);
    POST.b = mkCanvas(w, h);
    POST.rc = POST.r.getContext('2d', { alpha: false });
    POST.bc = POST.b.getContext('2d', { alpha: false });
  }
  const iso = (c2, col) => {
    c2.globalCompositeOperation = 'copy';
    c2.drawImage(canvas, 0, 0);
    c2.globalCompositeOperation = 'multiply';
    c2.fillStyle = col;
    c2.fillRect(0, 0, w, h);
  };
  iso(POST.rc, '#ff0000');
  iso(POST.bc, '#0000ff');
  const k = amount / W;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'multiply';
  ctx.fillStyle = '#00ff00';
  ctx.fillRect(0, 0, w, h);
  ctx.globalCompositeOperation = 'lighter';
  ctx.drawImage(POST.r, -w * k, -h * k, w * (1 + 2 * k), h * (1 + 2 * k));
  ctx.drawImage(POST.b, w * k, h * k, w * (1 - 2 * k), h * (1 - 2 * k));
  ctx.globalCompositeOperation = 'source-over';
}

/* ---------- Une image du film : fonction pure de t ---------- */
function renderFrame(t) {
  const S = canvas.width / W, tt = clamp(t, 0, DUR);
  ctx.setTransform(S, 0, 0, S, 0, 0);
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = '#070709';
  ctx.fillRect(0, 0, W, H);
  if (t >= 0) {
    const sh = shakeAt(tt);
    ctx.save();
    ctx.translate(CX + sh.x, CY + sh.y);
    ctx.rotate(sh.r);
    ctx.scale(1 + sh.z, 1 + sh.z);
    ctx.translate(-CX, -CY);
    const act = tt < CUE.cut2 ? A1 : tt < CUE.cut3 ? A2 : tt < CUE.cut4 ? A3 : tt < CUE.cut5 ? A4 : A5;
    act.draw(ctx, tt);
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
    drawFlashes(ctx, tt);
    ctx.restore();
    const ab = aberrAt(tt);
    if (ab > 0.4) aberrate(ab);
    ctx.setTransform(S, 0, 0, S, 0, 0);
  }
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
  ctx.drawImage(SPR.vignette, 0, 0, W, H);

  /* Grain pré-calculé, renouvelé 24 fois par seconde comme une pellicule. */
  if (!grainPats) grainPats = SPR.grain.map(g => ctx.createPattern(g, 'repeat'));
  const gi = Math.floor(tt * 24) + (t < 0 ? 3 : 0);
  const ox = Math.floor(hash1(gi * 1.37) * 256), oy = Math.floor(hash1(gi * 2.91 + 5) * 256), G = 1.4;
  ctx.save();
  ctx.translate(-ox, -oy);
  ctx.scale(G, G);
  ctx.fillStyle = grainPats[gi % grainPats.length];
  ctx.fillRect(0, 0, (W + ox) / G + 2, (H + oy) / G + 2);
  ctx.restore();

  const fade = ease.inOutQuad(prog(tt, CUE.fade0, DUR));
  if (fade > 0) {
    ctx.fillStyle = 'rgba(0,0,0,' + fade.toFixed(4) + ')';
    ctx.fillRect(0, 0, W, H);
  }
}

/* ---------- Régulateur : si la cadence chute, on baisse la définition d'un cran ---------- */
function resetGov(hard) {
  const g = st.gov;
  g.n = 0;
  g.sum = 0;
  g.skip = 40;
  g.pending = false;
  if (hard) {
    g.level = 0;
    g.locked = false;
  }
}
function govern(dt) {
  const g = st.gov;
  if (g.locked || st.rec || st.recArmed || st.fixedWidth) return;
  if (g.skip > 0) { g.skip--; return; }
  g.sum += dt;
  g.n++;
  if (g.n < 45) return;
  const avg = g.sum / g.n;
  g.sum = 0;
  g.n = 0;
  if (g.pending) {
    g.pending = false;
    if (avg > g.prevAvg * 0.9) {       // aucun gain : la cadence est plafonnée par l'écran, pas par le rendu
      g.level = Math.max(0, g.level - 1);
      g.locked = true;
      layout();
      return;
    }
  }
  if (avg > 0.0195 && g.level < QUALITY.length - 1) {
    g.prevAvg = avg;
    g.level++;
    g.pending = true;
    g.skip = 20;
    layout();
  }
}

/* ---------- Interface ---------- */
function setStatus(msg) { $('status').textContent = msg || ''; }
function applyUi() {
  const live = st.mode === 'playing' || st.mode === 'paused';
  hudEl.classList.toggle('off', !live || st.clean);
  document.body.classList.toggle('propre', st.clean && st.mode === 'playing');
  $('recdot').classList.toggle('off', !st.rec);
  $('icoPlay').setAttribute('d', st.mode === 'paused' ? 'M6 3l11 7-11 7z' : 'M5 3h4v14H5zM11 3h4v14h-4z');
  $('bPlay').setAttribute('aria-label', st.mode === 'paused' ? 'Reprendre la lecture' : 'Mettre en pause');
}
function updateHud() {
  const tt = clamp(st.t, 0, DUR);
  $('tcT').textContent = tt.toFixed(1).replace('.', ',') + ' s';
  let a = 0;
  for (let i = 0; i < ACT_STARTS.length; i++) if (tt >= ACT_STARTS[i]) a = i;
  $('tcA').textContent = ACT_NAMES[a];
  $('fill').style.width = ((tt / DUR) * 100).toFixed(2) + '%';
  $('bar').setAttribute('aria-valuenow', tt.toFixed(1));
}
function showIntro(again) {
  st.mode = 'idle';
  st.t = PREVIEW_T;
  st.dirty = true;
  goBtn.textContent = again ? 'REVOIR L’EDIT (PLEIN ÉCRAN + AUDIO)' : 'LANCER L’EDIT (PLEIN ÉCRAN + AUDIO)';
  introEl.classList.remove('off');
  applyUi();
}

function fsEnter() {
  const el = document.documentElement, fn = el.requestFullscreen || el.webkitRequestFullscreen;
  if (!fn) return;
  try {
    const p = fn.call(el, { navigationUI: 'hide' });
    if (p && p.catch) p.catch(() => {});
  } catch (e) { /* plein écran indisponible : le film remplit déjà la fenêtre */ }
}
function fsToggle() {
  const cur = document.fullscreenElement || document.webkitFullscreenElement;
  if (!cur) { fsEnter(); return; }
  const fn = document.exitFullscreen || document.webkitExitFullscreen;
  if (fn) {
    try {
      const p = fn.call(document);
      if (p && p.catch) p.catch(() => {});
    } catch (e) { /* sans effet */ }
  }
}
function wakeOn() {
  try {
    if (navigator.wakeLock && navigator.wakeLock.request) {
      navigator.wakeLock.request('screen').then(w => { st.wake = w; }).catch(() => {});
    }
  } catch (e) { /* facultatif */ }
}
function wakeOff() {
  try { if (st.wake) st.wake.release(); } catch (e) { /* facultatif */ }
  st.wake = null;
}

/* ---------- Capture vidéo intégrée (canvas 1080 × 1920 + piste audio) ---------- */
const REC_TYPES = ['video/mp4;codecs=avc1.640034,mp4a.40.2', 'video/mp4;codecs=avc1,mp4a.40.2', 'video/mp4', 'video/webm;codecs=vp9,opus', 'video/webm;codecs=vp8,opus', 'video/webm'];
function recSupported() {
  return typeof MediaRecorder !== 'undefined' && typeof canvas.captureStream === 'function';
}
function armRecorder() {
  try {
    const vs = canvas.captureStream(60), as = AUDIO.stream();
    const tracks = vs.getVideoTracks().concat(as ? as.getAudioTracks() : []);
    let type = '';
    for (let i = 0; i < REC_TYPES.length; i++) {
      if (MediaRecorder.isTypeSupported(REC_TYPES[i])) { type = REC_TYPES[i]; break; }
    }
    const opts = { videoBitsPerSecond: 18000000, audioBitsPerSecond: 256000 };
    if (type) opts.mimeType = type;
    const mr = new MediaRecorder(new MediaStream(tracks), opts), chunks = [];
    mr.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
    mr.onstop = () => {
      const mime = mr.mimeType || type || 'video/webm';
      const blob = new Blob(chunks, { type: mime });
      const url = URL.createObjectURL(blob), a = document.createElement('a');
      a.href = url;
      a.download = 'ibn-taymiyya-edit.' + (mime.indexOf('mp4') >= 0 ? 'mp4' : 'webm');
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 60000);
      st.rec = null;
      layout();
      showIntro(true);
      setStatus('Vidéo enregistrée : ' + a.download + '.');
    };
    return mr;
  } catch (e) {
    return null;
  }
}

/* ---------- Transport ---------- */
function launch(record, relaunch) {
  if (st.mode === 'boot' || (st.mode === 'playing' && !relaunch)) return;
  AUDIO.unlock();
  if (!relaunch) {
    fsEnter();
    st.clean = $('optClean').checked || !!record;
  }
  resetGov(true);
  st.recArmed = null;
  if (record) {
    st.recArmed = true;
    layout();
    st.recArmed = armRecorder();
    if (!st.recArmed) setStatus('La capture vidéo n’est pas disponible dans ce navigateur : lecture simple.');
  }
  layout();
  st.t = -PREROLL;
  st.mode = 'playing';
  st.needSession = false;
  st.last = performance.now();
  AUDIO.start(0, PREROLL);
  introEl.classList.add('off');
  wakeOn();
  applyUi();
}
function finish() {
  st.t = DUR;
  st.mode = 'ended';
  st.dirty = true;
  wakeOff();
  applyUi();
  setTimeout(() => AUDIO.stop(), 400);
  if (st.rec) {
    const mr = st.rec;
    setTimeout(() => { try { mr.stop(); } catch (e) { st.rec = null; showIntro(true); } }, 260);
  } else if (!st.clean) {
    showIntro(true);
  }
}
function togglePause() {
  if (st.rec) return;
  if (st.mode === 'playing') {
    st.mode = 'paused';
    AUDIO.pause();
  } else if (st.mode === 'paused') {
    st.mode = 'playing';
    st.last = performance.now();
    if (st.needSession) {
      AUDIO.start(Math.max(0, st.t), 0.08);
      st.needSession = false;
    } else {
      AUDIO.resume();
    }
    resetGov(false);
  }
  applyUi();
}
function seek(T) {
  if (st.rec || (st.mode !== 'playing' && st.mode !== 'paused')) return;
  st.t = clamp(T, 0, DUR - 0.05);
  st.dirty = true;
  resetGov(false);
  if (st.mode === 'playing') {
    AUDIO.start(st.t, 0.08);
  } else {
    AUDIO.stop();
    st.needSession = true;
  }
  updateHud();
}
function toggleClean() {
  if (st.mode === 'ended') { st.clean = false; showIntro(true); return; }
  if (st.mode !== 'playing' && st.mode !== 'paused') return;
  st.clean = !st.clean;
  applyUi();
}

/* ---------- Boucle : horloge en deltaTime, recalée en douceur sur l'horloge audio ---------- */
function loop(now) {
  requestAnimationFrame(loop);
  const dt = clamp((now - st.last) / 1000, 0, 0.1);
  st.last = now;
  if (st.mode === 'playing') {
    st.t += dt;
    const ta = AUDIO.now();
    if (ta !== null) {
      const err = ta - st.t;
      if (Math.abs(err) > 0.1) st.t = ta; else st.t += err * 0.1;
    }
    if (st.recArmed && st.recArmed !== true && st.t >= -0.1) {
      st.rec = st.recArmed;
      st.recArmed = null;
      try { st.rec.start(1000); } catch (e) { st.rec = null; }
      applyUi();
    }
    if (st.t >= DUR) {
      renderFrame(DUR);
      finish();
      updateHud();
      return;
    }
    govern(dt);
    renderFrame(st.t);
    updateHud();
  } else if (st.dirty && st.mode !== 'boot') {
    st.dirty = false;
    renderFrame(st.t);
    updateHud();
  }
}

/* ---------- Événements ---------- */
goBtn.addEventListener('click', () => launch(false));
recBtn.addEventListener('click', () => launch(true));
$('bPlay').addEventListener('click', togglePause);
$('bRe').addEventListener('click', () => { if (!st.rec) launch(false, true); });
$('bFs').addEventListener('click', fsToggle);
$('bHide').addEventListener('click', toggleClean);

const barEl = $('bar');
let scrubbing = false;
const barSeek = e => {
  const r = barEl.getBoundingClientRect();
  seek(clamp((e.clientX - r.left) / Math.max(1, r.width)) * DUR);
};
barEl.addEventListener('pointerdown', e => {
  scrubbing = true;
  try { barEl.setPointerCapture(e.pointerId); } catch (err) { /* sans effet */ }
  barSeek(e);
});
barEl.addEventListener('pointermove', e => { if (scrubbing) barSeek(e); });
barEl.addEventListener('pointerup', () => { scrubbing = false; });
barEl.addEventListener('pointercancel', () => { scrubbing = false; });
barEl.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft') { seek(st.t - 1); e.preventDefault(); e.stopPropagation(); }
  if (e.key === 'ArrowRight') { seek(st.t + 1); e.preventDefault(); e.stopPropagation(); }
});

window.addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key.toLowerCase();
  if (k === 'h') { toggleClean(); e.preventDefault(); return; }
  if (k === 'f') { fsToggle(); e.preventDefault(); return; }
  if (st.mode === 'ended' && st.clean && (k === 'r' || k === 'enter' || k === ' ')) { st.clean = false; showIntro(true); e.preventDefault(); return; }
  if (st.mode !== 'playing' && st.mode !== 'paused') return;
  if (k === ' ' || k === 'k') { togglePause(); e.preventDefault(); }
  else if (k === 'r') { if (!st.rec) launch(false, true); e.preventDefault(); }
  else if (k === 'arrowleft') { seek(st.t - 2); e.preventDefault(); }
  else if (k === 'arrowright') { seek(st.t + 2); e.preventDefault(); }
  else if (k >= '1' && k <= '5') { seek(ACT_STARTS[+k - 1]); e.preventDefault(); }
});

/* Double-touche (écran tactile) : équivalent de la touche H. */
canvas.addEventListener('pointerup', e => {
  if (e.pointerType === 'mouse') {
    if (st.mode === 'ended' && st.clean) { st.clean = false; showIntro(true); }
    return;
  }
  const now = performance.now();
  if (now - st.lastTap < 340) { toggleClean(); st.lastTap = 0; } else { st.lastTap = now; }
});

window.addEventListener('resize', layout);
window.addEventListener('orientationchange', layout);
document.addEventListener('fullscreenchange', layout);
document.addEventListener('webkitfullscreenchange', layout);
document.addEventListener('visibilitychange', () => {
  if (document.hidden && st.mode === 'playing' && !st.rec) {
    togglePause();
    st.autoPaused = true;
  } else if (!document.hidden && st.autoPaused) {
    st.autoPaused = false;
    if (st.mode === 'paused') togglePause();
  }
});

/* ---------- Démarrage : polices, textures, pages du manuscrit ---------- */
const ready = (async () => {
  if (document.fonts && document.fonts.load) {
    const jobs = [
      document.fonts.load(F.display(80), 'IBN TAYMIYYA 661 É'),
      document.fonts.load(F.serif(40), 'Damas é'),
      document.fonts.load(F.serifI(40), 'Mon paradis é'),
      document.fonts.load(F.ruqaa(80), 'جَنَّتِي فِي صَدْرِي'),
      document.fonts.load(F.naskh(40), 'مجموع الفتاوى')
    ];
    try {
      await Promise.race([Promise.all(jobs), new Promise(r => setTimeout(r, 2500))]);
    } catch (e) { /* les polices système prendront le relais */ }
  }
  TX.reset();
  buildSprites();
  if (A4.prepare) A4.prepare();
  if (A5.prepare) A5.prepare();
  st.mode = 'idle';
  layout();
  renderFrame(st.t);
  goBtn.disabled = false;
  if (recSupported()) recBtn.hidden = false;
  setStatus('');
  const coarse = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
  $('keys').innerHTML = coarse
    ? 'Pendant la lecture, touchez deux fois l’écran pour masquer ou afficher l’interface.'
    : 'Pendant la lecture : <kbd>H</kbd> masque ou affiche l’interface, <kbd>Espace</kbd> met en pause, <kbd>R</kbd> relance, <kbd>F</kbd> bascule le plein écran, <kbd>1</kbd> à <kbd>5</kbd> mènent à chaque acte.';
  return true;
})();

layout();
requestAnimationFrame(now => { st.last = now; requestAnimationFrame(loop); });

/* ---------- Accès programmatique : rendu déterministe image par image ---------- */
window.EDIT = {
  ready,
  duration: DUR,
  width: W,
  height: H,
  /* Dessine l'image du film à l'instant t (secondes). width facultatif : largeur du canvas en pixels. */
  renderAt(t, width) {
    st.fixedWidth = width || W;
    layout();
    renderFrame(t);
    st.dirty = false;
    return canvas;
  },
  release() { st.fixedWidth = 0; layout(); },
  sheet(times, cols, tw) {
    const th = Math.round((tw * H) / W), rows = Math.ceil(times.length / cols);
    const out = mkCanvas(cols * tw, rows * th), g = out.getContext('2d');
    st.fixedWidth = Math.max(tw, 540);
    layout();
    for (let i = 0; i < times.length; i++) {
      renderFrame(times[i]);
      const x = (i % cols) * tw, y = Math.floor(i / cols) * th;
      g.drawImage(canvas, x, y, tw, th);
      g.fillStyle = 'rgba(0,0,0,0.6)';
      g.fillRect(x, y, 74, 22);
      g.fillStyle = '#fff';
      g.font = '15px monospace';
      g.fillText(times[i].toFixed(2), x + 5, y + 16);
    }
    st.dirty = false;
    return out.toDataURL('image/jpeg', 0.9);
  },
  audioOffline: sr => AUDIO.offline(sr)
};

})();
</script>
</body>

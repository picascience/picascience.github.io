:root {
  --obsidienne: #070709;
  --or: #c9a24a;
  --or-clair: #f3dfa6;
  --ivoire: #f4ecd8;
  --display: "Anton", "Haettenschweiler", "Impact", "HelveticaNeue-CondensedBlack", "Arial Narrow", sans-serif;
  --serif: "Cormorant Garamond", "Hoefler Text", "Baskerville", "Palatino Linotype", Georgia, serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; background: #000; overflow: hidden; }
body {
  color: var(--ivoire);
  font-family: var(--serif);
  font-weight: 600;
  -webkit-user-select: none;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}
#stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #000; }
#frame { position: relative; overflow: hidden; background: var(--obsidienne); font-size: 16px; }
#edit { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
body.propre, body.propre * { cursor: none !important; }

.panel {
  position: absolute; inset: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 0 2.3em; text-align: center;

<script>
(() => {
'use strict';

/* =====================================================================
   1. NOYAU — constantes, mathématiques, courbes, bruit déterministe
   Tout le film est une fonction pure du temps : image(t). Aucun état
   caché, donc lecture, pause, saut et capture donnent la même image.
   ===================================================================== */
const W = 1080, H = 1920, CX = 540, CY = 960, DUR = 50;
const PI = Math.PI, TAU = PI * 2, DEG = PI / 180;

const clamp = (x, a = 0, b = 1) => (x < a ? a : x > b ? b : x);
const lerp = (a, b, t) => a + (b - a) * t;
const prog = (t, a, b) => (b === a ? (t >= b ? 1 : 0) : clamp((t - a) / (b - a)));
const win = (t, a, b, c, d) => Math.min(prog(t, a, b), 1 - prog(t, c, d));
const fract = x => x - Math.floor(x);
const mod = (x, m) => ((x % m) + m) % m;

/* Courbes de Bézier cubiques (équivalent CSS cubic-bezier), résolues par Newton + bissection. */
function cubicBezier(x1, y1, x2, y2) {
  const cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx;
  const cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by;
  const fx = u => ((ax * u + bx) * u + cx) * u;
  const fy = u => ((ay * u + by) * u + cy) * u;
  const dfx = u => (3 * ax * u + 2 * bx) * u + cx;
  return x => {
    if (x <= 0) return 0;
    if (x >= 1) return 1;
    let u = x;
    for (let i = 0; i < 8; i++) {
      const d = fx(u) - x;
      if (Math.abs(d) < 1e-6) return fy(u);
      const s = dfx(u);
      if (Math.abs(s) < 1e-6) break;
      u -= d / s;
    }
    let lo = 0, hi = 1;
    u = x;
    for (let i = 0; i < 24; i++) {
      const d = fx(u) - x;
      if (Math.abs(d) < 1e-6) break;
      if (d > 0) hi = u; else lo = u;
      u = (lo + hi) / 2;
    }
    return fy(u);
  };
}

const ease = {
  inQuad: t => t * t,
  outQuad: t => 1 - (1 - t) * (1 - t),
  inOutQuad: t => (t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2),
  inCubic: t => t * t * t,
  outCubic: t => 1 - Math.pow(1 - t, 3),
  inOutCubic: t => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2),
  inQuart: t => t * t * t * t,
  outQuart: t => 1 - Math.pow(1 - t, 4),
  outQuint: t => 1 - Math.pow(1 - t, 5),
  inExpo: t => (t <= 0 ? 0 : Math.pow(2, 10 * t - 10)),
  outExpo: t => (t >= 1 ? 1 : 1 - Math.pow(2, -10 * t)),
  inOutExpo: t => (t <= 0 ? 0 : t >= 1 ? 1 : t < 0.5 ? Math.pow(2, 20 * t - 10) / 2 : (2 - Math.pow(2, -20 * t + 10)) / 2),
  outBack: (t, s = 1.70158) => 1 + (s + 1) * Math.pow(t - 1, 3) + s * Math.pow(t - 1, 2),
  inBack: (t, s = 1.70158) => (s + 1) * t * t * t - s * t * t,
  outElastic: t => (t <= 0 ? 0 : t >= 1 ? 1 : Math.pow(2, -10 * t) * Math.sin((t * 10 - 0.75) * (TAU / 3)) + 1)
};

/* Rampes de vitesse signature du film. */
const bez = {
  ramp: cubicBezier(0.86, 0, 0.07, 1),     // rampe exponentielle : lent, fulgurant, lent
  whip: cubicBezier(0.7, 0, 0.16, 1),      // whip-pan
  snap: cubicBezier(0.18, 1.42, 0.32, 1),  // dépassement puis verrouillage
  punch: cubicBezier(0.05, 0.92, 0.12, 1), // frappe : arrivée immédiate, amorti long
  soft: cubicBezier(0.4, 0, 0.2, 1),
  heavy: cubicBezier(0.9, 0, 0.1, 1)
};

/* Générateur pseudo-aléatoire à graine (mulberry32) et hachages : zéro Math.random. */
function mulberry32(seed) {
  let a = seed | 0;
  return () => {
    a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const hash1 = n => fract(Math.sin(n * 127.1 + 311.7) * 43758.5453123);
const hash2 = (x, y) => fract(Math.sin(x * 127.1 + y * 311.7) * 43758.5453123);

function noise1(x) {
  const i = Math.floor(x), f = x - i, u = f * f * (3 - 2 * f);
  return lerp(hash1(i), hash1(i + 1), u);
}
const snoise1 = x => noise1(x) * 2 - 1;
function noise2(x, y) {
  const ix = Math.floor(x), iy = Math.floor(y), fx = x - ix, fy = y - iy;
  const ux = fx * fx * (3 - 2 * fx), uy = fy * fy * (3 - 2 * fy);
  return lerp(lerp(hash2(ix, iy), hash2(ix + 1, iy), ux), lerp(hash2(ix, iy + 1), hash2(ix + 1, iy + 1), ux), uy);
}
function fbm2(x, y, oct) {
  let v = 0, a = 0.5, n = 0;
  for (let i = 0; i < oct; i++) {
    v += a * noise2(x, y);
    n += a;
    x = x * 2.03 + 17.1;
    y = y * 2.03 + 9.7;
    a *= 0.5;
  }
  return v / n;
}

/* Palette : l'or n'est pas une peinture mais une lumière (mélange additif). */
const PAL = {
  bg: [7, 7, 9],
  gold: [201, 162, 74],
  goldHi: [243, 223, 166],
  goldDeep: [122, 92, 36],
  ivory: [244, 236, 216],
  red: [126, 20, 22],
  redHi: [204, 52, 40],
  amber: [255, 179, 71],
  parch: [226, 206, 160],
  ink: [20, 14, 9],
  iron: [42, 45, 51]
};
const rgba = (c, a = 1) => 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a + ')';
const mixc = (c1, c2, t) => [Math.round(lerp(c1[0], c2[0], t)), Math.round(lerp(c1[1], c2[1], t)), Math.round(lerp(c1[2], c2[2], t))];

function mkCanvas(w, h) {
  const c = document.createElement('canvas');
  c.width = Math.max(1, Math.round(w));
  c.height = Math.max(1, Math.round(h));
  return c;
}

/* Conducteur : chaque repère temporel est partagé par l'image et par le son. */
const CUE = {
  // Acte I — L'Exil et l'Étincelle
  open: 0.3, zoom0: 3.0, lock: 3.9, wave0: 5.15, star: 6.6, w1: 7.0, w2: 7.42, w3: 7.84, pan0: 8.25, cut2: 9.0,
  // Acte II — Le Pilier de Damas
  land: [10.15, 10.45, 10.75, 11.05, 11.3, 11.55, 11.85], astro: 12.2, comp0: 12.6, comp1: 13.4,
  cards: [14.0, 14.8, 15.6, 16.4], mem: 17.2, prod0: 17.75, prod1: 18.3, out2: 19.3, cut3: 20.0,
  // Acte III — Le Savant face aux Tempêtes
  title3: 20.6, date3: 21.05, shield0: 21.8, shield1: 22.8,
  words: [23.2, 23.5, 23.78, 24.06, 24.56, 24.82, 25.08, 25.4, 26.0, 26.24, 26.5, 26.95, 27.18, 27.42, 28.4],
  hits: [24.06, 25.4, 26.5, 27.42], riser0: 26.3, big: 28.4, out3: 30.25, cut4: 31.0,
  // Acte IV — La Citadelle
  slam: 31.0, pass1: 31.85, pass2: 32.8, turn0: 33.4, turn1: 34.4, write0: 34.45, write1: 36.5,
  flips: [35.35, 35.72, 36.08, 36.45], calli0: 36.7, calli1: 37.7, tr: [37.7, 38.95, 40.2], coll0: 41.35, cut5: 42.0,
  // Acte V — L'Héritage Éternel
  hit: 42.45, title: 44.1, dates: 45.0, epi: 45.9, fade0: 49.3
};

/* Cliquets de l'astrolabe : chaque clic fait avancer l'araignée d'un cran, à l'image comme au son. */
CUE.clicks = (() => {
  const a = [];
  for (let i = 0; i < 13; i++) a.push(12.35 + i * 0.13);
  for (let i = 0; i < CUE.cards.length; i++) a.push(CUE.cards[i], CUE.cards[i] + 0.07, CUE.cards[i] + 0.4);
  a.push(CUE.mem);
  for (let i = 0; i < 11; i++) a.push(CUE.prod0 + (i * (CUE.prod1 - CUE.prod0)) / 10);
  return a.sort((x, y) => x - y);
})();

/* Géométries de raccord partagées entre deux actes (match-cuts). */
const MATCH = {
  rect: { x: 540, y: 1000, hw: 300, hh: 192.5 },      // étoile de Harran → emprise de la mosquée
  rings: { x: 540, y: 720, r: [150, 232, 330] },       // anneaux de l'astrolabe → cercles de portée de Shaqhab
  bars: [135, 225, 315, 405, 495, 585, 675, 765, 855, 945] // côtés du bouclier → barreaux de la citadelle
};

/* =====================================================================
   2. TYPOGRAPHIE — mesure, ajustement à la largeur, interlettrage manuel
   Deux familles latines seulement : Anton (frappe) et Cormorant Garamond
   (citations, annotations cartographiques). Aref Ruqaa et Amiri pour l'arabe.
   ===================================================================== */
const FAM = {
  display: '"Anton","Haettenschweiler","Impact","HelveticaNeue-CondensedBlack","Arial Narrow",sans-serif',
  serif: '"Cormorant Garamond","Hoefler Text","Baskerville","Palatino Linotype","Book Antiqua",Georgia,"Times New Roman",serif',
  ruqaa: '"Aref Ruqaa","Amiri","Geeza Pro","Arabic Typesetting","Traditional Arabic","Noto Naskh Arabic","Segoe UI",serif',
  naskh: '"Amiri","Geeza Pro","Traditional Arabic","Arabic Typesetting","Noto Naskh Arabic","Segoe UI",serif'
};
const F = {
  display: s => '400 ' + s + 'px ' + FAM.display,
  serif: s => '600 ' + s + 'px ' + FAM.serif,
  serifI: s => 'italic 600 ' + s + 'px ' + FAM.serif,
  ruqaa: s => '700 ' + s + 'px ' + FAM.ruqaa,
  naskh: s => '400 ' + s + 'px ' + FAM.naskh
};

const TX = (() => {
  const m = mkCanvas(8, 8).getContext('2d');
  let cache = new Map();
  /* Largeur d'un texte à 100 px ; toute autre taille s'en déduit linéairement. */
  const w100 = (kind, text) => {
    const k = kind + '\u0001' + text;
    let v = cache.get(k);
    if (v === undefined) {
      m.font = F[kind](100);
      v = m.measureText(text).width;
      cache.set(k, v);
    }
    return v;
  };
  const width = (kind, text, size) => (w100(kind, text) * size) / 100;
  const fit = (kind, text, maxW, maxSize = 1e9) => Math.min(maxSize, (100 * maxW) / Math.max(1, w100(kind, text)));
  /* Hauteur de capitale réelle de la police active (repli : 0,72 em). */
  const cap = kind => {
    const k = 'cap\u0001' + kind;
    let v = cache.get(k);
    if (v === undefined) {
      m.font = F[kind](100);
      const mt = m.measureText('H');
      v = (mt.actualBoundingBoxAscent > 1 ? mt.actualBoundingBoxAscent : 72) / 100;
      cache.set(k, v);
    }
    return v;
  };
  /* Position de chaque caractère (crénage inclus) pour les animations lettre à lettre. */
  const chars = (kind, text) => {
    const k = 'ch\u0001' + kind + '\u0001' + text;
    let v = cache.get(k);
    if (v === undefined) {
      v = [];
      const arr = Array.from(text);
      let acc = '';
      let prev = 0;
      for (let i = 0; i < arr.length; i++) {
        acc += arr[i];
        const w = w100(kind, acc);
        v.push({ c: arr[i], x: prev, w: w - prev });
        prev = w;
      }
      cache.set(k, v);
    }
    return v;
  };
  /* Largeur avec interlettrage (avances individuelles, sans crénage). */
  const trackedWidth = (kind, text, size, track) => {
    const arr = Array.from(text);
    let w = 0;
    for (let i = 0; i < arr.length; i++) w += (w100(kind, arr[i]) * size) / 100;
    return w + track * Math.max(0, arr.length - 1);
  };
  const reset = () => { cache = new Map(); };
  return { width, fit, cap, chars, trackedWidth, reset };
})();

/* Texte simple. align : 'left' | 'center' | 'right'. */
function txt(ctx, kind, text, x, y, size, color, align = 'center', alpha = 1) {
  if (alpha <= 0) return;
  ctx.font = F[kind](size);
  ctx.direction = 'ltr';
  ctx.textAlign = align;
  ctx.textBaseline = 'alphabetic';
  ctx.globalAlpha = alpha;
  ctx.fillStyle = color;
  ctx.fillText(text, x, y);
  ctx.globalAlpha = 1;
}

/* Texte arabe : une seule passe fillText pour préserver les ligatures et le sens droite-gauche. */
function txtAr(ctx, kind, text, x, y, size, color, align = 'center', alpha = 1) {
  if (alpha <= 0) return;
  ctx.font = F[kind](size);
  ctx.direction = 'rtl';
  ctx.textAlign = align;
  ctx.textBaseline = 'alphabetic';
  ctx.globalAlpha = alpha;
  ctx.fillStyle = color;
  ctx.fillText(text, x, y);
  ctx.globalAlpha = 1;
  ctx.direction = 'ltr';
}

/* Texte interlettré (petites capitales d'atlas, sous-titres). */
function txtTracked(ctx, kind, text, x, y, size, track, color, align = 'center', alpha = 1) {
  if (alpha <= 0) return;
  const arr = Array.from(text);
  const total = TX.trackedWidth(kind, text, size, track);
  let px = align === 'center' ? x - total / 2 : align === 'right' ? x - total : x;
  ctx.font = F[kind](size);
  ctx.direction = 'ltr';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'alphabetic';
  ctx.globalAlpha = alpha;
  ctx.fillStyle = color;
  for (let i = 0; i < arr.length; i++) {
    ctx.fillText(arr[i], px, y);
    px += TX.width(kind, arr[i], size) + track;
  }
  ctx.globalAlpha = 1;
}

/* Frappe typographique : le mot arrive surdimensionné et se verrouille (overshoot & snap),
   chaque lettre retombant avec un léger décalage. p : 0 → 1. */
function txtSlam(ctx, kind, text, x, y, size, color, p, opts = {}) {
  if (p <= 0) return;
  const cs = TX.chars(kind, text);
  const total = TX.width(kind, text, size);
  const capH = TX.cap(kind) * size;
  const n = cs.length;
  const stagger = Math.min(opts.stagger === undefined ? 0.05 : opts.stagger, 0.6 / Math.max(1, n - 1));
  const span = 1 - stagger * (n - 1);
  ctx.font = F[kind](size);
  ctx.direction = 'ltr';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'alphabetic';
  ctx.fillStyle = color;
  const x0 = x - total / 2;
  for (let i = 0; i < n; i++) {
    const lp = clamp((p - i * stagger) / span);
    if (lp <= 0) continue;
    const e = bez.snap(lp);
    const sc = lerp(opts.from === undefined ? 1.9 : opts.from, 1, e);
    const cxp = x0 + ((cs[i].x + cs[i].w / 2) * size) / 100;

/* Révélation par masque : le texte monte depuis sa ligne de base derrière un cache. p : 0 → 1. */
function txtRise(ctx, kind, text, x, y, size, color, p, align = 'center', alpha = 1) {
  if (p <= 0 || alpha <= 0) return;
  const e = ease.outQuint(clamp(p));
  const h = size * 1.15;
  const w = TX.width(kind, text, size) + size * 0.6;
  const left = align === 'center' ? x - w / 2 : align === 'right' ? x - w + size * 0.3 : x - size * 0.3;
  ctx.save();
  ctx.beginPath();
  ctx.rect(left, y - h * 0.92, w, h * 1.2);
  ctx.clip();
  txt(ctx, kind, text, x, y + (1 - e) * h, size, color, align, alpha * clamp(p * 3));

    at(CUE.comp0, t => noise(K, S, { t, dur: 0.8, buf: K.crackle, type: 'bandpass', f: [[0, 1800], [0.8, 2600]], q: 2, env: [[0, 0], [0.1, 0.2], [0.7, 0.16], [0.8, 0]], pan: [-0.3, 0.3] }));
    CUE.cards.forEach((T, i) => {
      at(T - 0.16, t => whoosh(K, S, t, 0.2, 0.6, 500, 4000, 1500, i % 2 ? [0.6, -0.6] : [-0.6, 0.6]));
      at(T, t => { thud(K, S, t, 1.0); stone(K, S, t, 0.35); });
    });
    at(CUE.mem - 0.22, t => whoosh(K, S, t, 0.28, 0.7, 400, 3600, 1000, [0, 0]));
    at(CUE.mem, t => thud(K, S, t, 0.9));
    at(CUE.prod1 + 0.05, t => { impact(K, S, t, 1.0, 1.7); stone(K, S, t, 0.7); });
    at(CUE.out2, t => whoosh(K, S, t, 0.72, 0.85, 250, 3800, 700, [0, 0]));
    /* ACTE III */
    at(CUE.cut3, t => thud(K, S, t, 0.9));
    at(CUE.title3, t => impact(K, S, t, 1.0, 1.8));
    at(CUE.date3, t => tick(K, S, t, 0.8));
    for (let i = 0; i < 8; i++) at(CUE.shield0 + i * 0.125, t => click(K, S, t, 0.5, i / 8));
    at(CUE.shield1, t => metal(K, S, t, 0.3, 2.6, 0.7));
    CUE.words.slice(0, 14).forEach((T, i) => at(T, t => {
      tone(K, S, { t, f0: 128, f1: 62, drop: 0.05, dur: 0.16, gain: 0.26, room: 0.3 });
      tick(K, S, t, 0.25 + (i % 3) * 0.05);
    }));
    CUE.hits.forEach((T, i) => at(T, t => {
      impact(K, S, t, 0.55 + i * 0.07, 0.9);
      noise(K, S, { t, dur: 0.3, type: 'bandpass', f: [[0, 6500], [0.3, 3800]], q: 2.5, env: [[0, 0], [0.003, 0.3], [0.3, 0]], hall: 0.5, pan: [-0.6, 0.5, -0.7, 0.7][i] });
      metal(K, S, t, 0.13, 5.2, 0.35);
    }));
    at(CUE.riser0, t => {
      const d = CUE.big - 0.04 - CUE.riser0;
      noise(K, S, { t, dur: d, type: 'bandpass', f: [[0, 180], [d, 7200]], q: 2.2, env: [[0, 0], [d * 0.5, 0.14], [d * 0.85, 0.38], [d - 0.012, 0.62], [d, 0]], hall: 0.15 });
      noise(K, S, { t, dur: d, type: 'highpass', f: [[0, 9000], [d, 4000]], q: 0.7, env: [[0, 0], [d - 0.012, 0.2], [d, 0]] });
    });
    at(CUE.big, t => {
      impact(K, S, t, 1.3, 2.8);
      tone(K, S, { t, f0: 70, f1: 24, drop: 0.3, dur: 2.4, gain: 0.5, hall: 0.2 });
      metal(K, S, t, 0.2, 7.3, 2.4);
      noise(K, S, { t, dur: 1.6, buf: K.pink, type: 'lowpass', f: [[0, 3000], [1.6, 200]], q: 0.7, env: [[0, 0], [0.01, 0.5], [1.6, 0]], hall: 0.6 });
    });
    at(CUE.out3, t => whoosh(K, S, t, 0.74, 0.8, 300, 2600, 400, [0, 0]));
    for (let i = 0; i < 8; i++) at(CUE.out3 + 0.2 + i * 0.06, t => click(K, S, t, 0.4, i / 8));
    /* ACTE IV */
    at(CUE.slam, t => {
      impact(K, S, t, 1.2, 1.4);
      metal(K, S, t, 1.0, 1, 2.6);
      metal(K, S, t + 0.085, 0.4, 1.07, 1.4);
      rattle(K, S, t + 0.14, 1.0, 5);
    });
    at(CUE.pass1 - 0.3, t => { whoosh(K, S, t, 0.55, 0.6, 200, 1700, 300, [-0.7, 0.7]); rattle(K, S, t + 0.32, 0.6, 4); });
    at(CUE.pass2 - 0.3, t => { whoosh(K, S, t, 0.55, 0.6, 200, 1700, 300, [0.7, -0.7]); rattle(K, S, t + 0.3, 0.6, 4); });
    at(CUE.turn0, t => {
      whoosh(K, S, t, 0.95, 0.8, 200, 3200, 600, [0, 0]);
      noise(K, S, { t, dur: 0.9, buf: K.crackle, type: 'bandpass', f: [[0, 300], [0.9, 1300]], q: 6, env: [[0, 0], [0.2, 0.2], [0.8, 0.14], [0.9, 0]], hall: 0.5 });
    });
    at(CUE.turn1, t => { thud(K, S, t, 0.7); page(K, S, t, 0.8); });
    at(CUE.write0, t => scratch(K, S, t, CUE.flips[0] - CUE.write0 - 0.05, 0.3, 3));
    CUE.flips.forEach((T, i) => at(T, t => { page(K, S, t, i === 3 ? 1.0 : 0.85); if (i < 3) scratch(K, S, t + 0.16, 0.18, 0.2, 10 + i); }));
    at(CUE.calli0, t => { scratch(K, S, t, 0.28, 0.36, 31); scratch(K, S, t + 0.36, 0.2, 0.36, 37); scratch(K, S, t + 0.64, 0.34, 0.36, 41); });
    CUE.tr.forEach(T => at(T, t => tone(K, S, { t, f0: 110, f1: 56, drop: 0.06, dur: 0.3, gain: 0.3, hall: 0.5 })));
    at(CUE.coll0, t => noise(K, S, { t, dur: 0.66, buf: K.pink, type: 'bandpass', f: [[0, 300], [0.62, 5200]], q: 2, env: [[0, 0], [0.5, 0.3], [0.64, 0.6], [0.66, 0]], hall: 0.2 }));
    /* ACTE V */
    at(CUE.hit, t => {
      tone(K, S, { t, f0: 520, f1: 1100, drop: 0.035, dur: 0.07, gain: 0.1, att: 0.002, hall: 0.6 });
      impact(K, S, t, 0.95, 2.2);
      noise(K, S, { t, dur: 2.0, buf: K.pink, type: 'bandpass', f: [[0, 500], [0.7, 2600], [2.0, 900]], q: 0.9, env: [[0, 0], [0.4, 0.3], [2.0, 0]], hall: 0.5 });
    });
    for (let i = 0; i < 5; i++) at(CUE.hit + 0.35 + i * 0.22, t => click(K, S, t, 0.3, i / 5));
    at(CUE.title - 0.25, t => whoosh(K, S, t, 0.3, 0.5, 300, 2600, 900, [0, 0]));
    at(CUE.title, t => {
      impact(K, S, t, 1.3, 3.4);
      tone(K, S, { t, f0: 62, f1: 23, drop: 0.4, dur: 3.2, gain: 0.5, hall: 0.25 });
      noise(K, S, { t, dur: 2.6, buf: K.pink, type: 'lowpass', f: [[0, 2400], [2.6, 150]], q: 0.7, env: [[0, 0], [0.01, 0.4], [2.6, 0]], hall: 0.7 });
    });
    at(CUE.dates, t => thud(K, S, t, 0.5));
  }

  function killSession() {
    if (!session || !ctx) return;
    const S = session, now = ctx.currentTime;
    session = null;
    [S.dry, S.hall, S.room].forEach(g => { g.gain.setValueAtTime(g.gain.value, now); g.gain.linearRampToValueAtTime(0, now + 0.04); });
    setTimeout(() => {
      S.nodes.forEach(n => { try { n.stop(); } catch (e) { /* déjà arrêté */ } });
      [S.dry, S.hall, S.room].forEach(g => { try { g.disconnect(); } catch (e) { /* sans effet */ } });
    }, 120);
  }

  return {
    /* À appeler dans le geste utilisateur : crée (ou réveille) le contexte audio. */
    unlock() {
      try {
        if (navigator.audioSession) navigator.audioSession.type = 'playback';
      } catch (e) { /* API absente */ }
      try {
        if (!ctx) {
          const AC = window.AudioContext || window.webkitAudioContext;
          if (!AC) return false;
          ctx = new AC({ latencyHint: 'interactive' });
          kit = buildKit(ctx, ctx.destination);
        }
        if (ctx.state !== 'running') ctx.resume();
        return true;
      } catch (e) {
        ctx = null;
        return false;
      }
    },
    start(from, lead) {
      if (!ctx) { running = false; return; }
      killSession();
      if (ctx.state !== 'running') ctx.resume();
      session = newSession(kit);
      const begin = ctx.currentTime + lead;
      t0 = begin - from;
      score(kit, session, begin, from);
      running = true;
    },
    stop() { killSession(); running = false; },
    pause() { if (ctx) ctx.suspend(); },
    resume() { if (ctx) ctx.resume(); },
    now() { return ctx && running && ctx.state === 'running' ? ctx.currentTime - t0 : null; },
    stream() {
      if (!ctx) return null;
      if (!recDest) { recDest = ctx.createMediaStreamDestination(); kit.out.connect(recDest); }
      return recDest.stream;
    },
    /* Rendu hors-ligne de toute la bande-son (contrôle de niveau, export). */
    offline(sr) {
      const OAC = window.OfflineAudioContext || window.webkitOfflineAudioContext;
      const oc = new OAC(2, Math.ceil((DUR + 0.5) * (sr || 48000)), sr || 48000), K = buildKit(oc, oc.destination);
      score(K, newSession(K), 0, 0);
      return oc.startRendering();
    }
  };
})();

/* =====================================================================
   4. TEXTURES PRÉ-CALCULÉES — tout ce qui coûte cher est rendu une seule
   fois hors-écran (grain, halos, vignette, parchemin, fer forgé).
   ===================================================================== */
const SPR = {};

function radialSprite(size, stops) {
  const c = mkCanvas(size, size), g = c.getContext('2d');
  const gr = g.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
  for (let i = 0; i < stops.length; i++) gr.addColorStop(stops[i][0], stops[i][1]);
  g.fillStyle = gr;
  g.fillRect(0, 0, size, size);
  return c;
}

/* Halo additif : l'appelant règle globalCompositeOperation. */
function glow(ctx, spr, x, y, r, a) {
  if (a <= 0.002 || r <= 0.5) return;
  ctx.globalAlpha = Math.min(1, a);
  ctx.drawImage(spr, x - r, y - r, r * 2, r * 2);
  ctx.globalAlpha = 1;
}

/* Grain pellicule : grains clairs et sombres mêlés, donc neutre en luminance. */
function makeGrain(seed) {
  const n = 256, c = mkCanvas(n, n), g = c.getContext('2d');
  const im = g.createImageData(n, n), d = im.data, r = mulberry32(seed);
  for (let i = 0; i < n * n; i++) {
    const v = Math.pow(r(), 1.7);
    const light = r() < 0.5;
    const o = i * 4;
    d[o] = d[o + 1] = d[o + 2] = light ? 255 : 0;
    d[o + 3] = light ? v * 17 : v * 28;
  }
  g.putImageData(im, 0, 0);
  return c;
}

function makeVignette() {
  const c = mkCanvas(270, 480), g = c.getContext('2d');
  const gr = g.createRadialGradient(135, 232, 96, 135, 240, 330);
  gr.addColorStop(0, 'rgba(0,0,0,0)');
  gr.addColorStop(0.55, 'rgba(0,0,0,0.16)');
  gr.addColorStop(1, 'rgba(0,0,0,0.74)');
  g.fillStyle = gr;
  g.fillRect(0, 0, 270, 480);
  const lg = g.createLinearGradient(0, 0, 0, 480);
  lg.addColorStop(0, 'rgba(0,0,0,0.34)');
  lg.addColorStop(0.14, 'rgba(0,0,0,0)');
  lg.addColorStop(0.86, 'rgba(0,0,0,0)');
  lg.addColorStop(1, 'rgba(0,0,0,0.4)');
  g.fillStyle = lg;
  g.fillRect(0, 0, 270, 480);
  return c;
}

/* Parchemin : marbrures, fibres, rousseurs et bords brunis. */
function makeParchment(w, h, seed) {
  const c = mkCanvas(w, h), g = c.getContext('2d'), r = mulberry32(seed);
  const base = g.createLinearGradient(0, 0, w, h);
  base.addColorStop(0, '#e6d4a8');
  base.addColorStop(0.5, '#dcc694');
  base.addColorStop(1, '#cfb57f');
  g.fillStyle = base;
  g.fillRect(0, 0, w, h);
  for (let i = 0; i < 90; i++) {
    const x = r() * w, y = r() * h, rad = 60 + r() * 260;
    const gr = g.createRadialGradient(x, y, 0, x, y, rad);
    const lightBlob = r() < 0.45;
    gr.addColorStop(0, lightBlob ? 'rgba(255,244,210,0.10)' : 'rgba(128,92,44,0.085)');
    gr.addColorStop(1, lightBlob ? 'rgba(255,244,210,0)' : 'rgba(128,92,44,0)');
    g.fillStyle = gr;
    g.fillRect(x - rad, y - rad, rad * 2, rad * 2);
  }
  const im = g.getImageData(0, 0, w, h), d = im.data;
  for (let i = 0; i < d.length; i += 4) {
    const n = (r() - 0.5) * 20;
    d[i] = clamp(d[i] + n, 0, 255);
    d[i + 1] = clamp(d[i + 1] + n, 0, 255);
    d[i + 2] = clamp(d[i + 2] + n * 0.8, 0, 255);
  }
  g.putImageData(im, 0, 0);
  g.lineCap = 'round';
  for (let i = 0; i < 620; i++) {
    const x = r() * w, y = r() * h, a = r() * TAU, l = 5 + r() * 34;
    g.strokeStyle = r() < 0.5 ? 'rgba(112,80,38,0.07)' : 'rgba(255,246,220,0.08)';
    g.lineWidth = 0.6 + r() * 0.9;
    g.beginPath();
    g.moveTo(x, y);
    g.quadraticCurveTo(x + Math.cos(a) * l * 0.5 + (r() - 0.5) * 8, y + Math.sin(a) * l * 0.5 + (r() - 0.5) * 8, x + Math.cos(a) * l, y + Math.sin(a) * l);
    g.stroke();
  }
  for (let i = 0; i < 34; i++) {
    const x = r() * w, y = r() * h, rad = 1.5 + r() * 6;
    g.fillStyle = 'rgba(120,72,30,' + (0.05 + r() * 0.12).toFixed(3) + ')';
    g.beginPath();
    g.arc(x, y, rad, 0, TAU);
    g.fill();
  }
  const edge = (x0, y0, x1, y1, rx, ry, rw, rh) => {
    const gr = g.createLinearGradient(x0, y0, x1, y1);
    gr.addColorStop(0, 'rgba(84,52,20,0.5)');
    gr.addColorStop(0.35, 'rgba(84,52,20,0.14)');
    gr.addColorStop(1, 'rgba(84,52,20,0)');
    g.fillStyle = gr;
    g.fillRect(rx, ry, rw, rh);
  };
  const m = Math.round(Math.min(w, h) * 0.13);
  edge(0, 0, m, 0, 0, 0, m, h);
  edge(w, 0, w - m, 0, w - m, 0, m, h);
  edge(0, 0, 0, m, 0, 0, w, m);
  edge(0, h, 0, h - m, 0, h - m, w, m);
  return c;
}

/* Barreau de fer forgé : dégradé cylindrique, stries de forge, piqûres de rouille. */
function makeIron(seed) {
  const w = 64, h = 512, c = mkCanvas(w, h), g = c.getContext('2d'), r = mulberry32(seed);
  const gr = g.createLinearGradient(0, 0, w, 0);
  gr.addColorStop(0, '#040405');
  gr.addColorStop(0.16, '#17191d');
  gr.addColorStop(0.34, '#42464e');
  gr.addColorStop(0.43, '#8d929c');
  gr.addColorStop(0.5, '#4a4e56');
  gr.addColorStop(0.74, '#15171a');
  gr.addColorStop(0.92, '#2a2622');
  gr.addColorStop(1, '#040404');
  g.fillStyle = gr;
  g.fillRect(0, 0, w, h);
  for (let i = 0; i < 150; i++) {
    const x = r() * w, y = r() * h, l = 20 + r() * 160;
    g.fillStyle = r() < 0.5 ? 'rgba(0,0,0,0.16)' : 'rgba(170,176,188,0.07)';
    g.fillRect(x, y, 0.8 + r() * 1.6, l);
  }
  for (let i = 0; i < 240; i++) {
    const x = r() * w, y = r() * h;
    g.fillStyle = r() < 0.6 ? 'rgba(92,48,22,0.26)' : 'rgba(0,0,0,0.3)';
    g.beginPath();
    g.arc(x, y, 0.6 + r() * 2.2, 0, TAU);
    g.fill();
  }
  return c;
}

function buildSprites() {
  SPR.gold = radialSprite(256, [[0, 'rgba(255,238,178,1)'], [0.18, 'rgba(246,206,116,0.62)'], [0.5, 'rgba(201,162,74,0.16)'], [1, 'rgba(201,162,74,0)']]);
  SPR.warm = radialSprite(256, [[0, 'rgba(255,252,240,1)'], [0.12, 'rgba(255,236,180,0.7)'], [0.45, 'rgba(230,180,90,0.16)'], [1, 'rgba(230,180,90,0)']]);
  SPR.red = radialSprite(256, [[0, 'rgba(255,110,70,1)'], [0.2, 'rgba(210,48,36,0.6)'], [0.55, 'rgba(126,20,22,0.18)'], [1, 'rgba(126,20,22,0)']]);
  SPR.amber = radialSprite(256, [[0, 'rgba(255,244,214,1)'], [0.16, 'rgba(255,190,90,0.7)'], [0.5, 'rgba(255,150,50,0.16)'], [1, 'rgba(255,150,50,0)']]);
  SPR.dark = radialSprite(256, [[0, 'rgba(4,4,6,0.94)'], [0.45, 'rgba(4,4,6,0.72)'], [0.8, 'rgba(4,4,6,0.22)'], [1, 'rgba(4,4,6,0)']]);
  SPR.grain = [makeGrain(11), makeGrain(23), makeGrain(37), makeGrain(53)];
  SPR.vignette = makeVignette();
  SPR.parch = makeParchment(860, 1200, 7);
  SPR.iron = makeIron(5);
  SPR.rays = mkCanvas(270, 480);   // rayons volumétriques en basse définition (flou gratuit à l'agrandissement)
  SPR.layer = mkCanvas(540, 960);  // calque de travail (onde rouge, masques)
}

/* =====================================================================
   5. CAMÉRA GLOBALE ET EFFETS — tremblements d'impact, aberration
   chromatique, flashs de coupe, particules, traits lumineux.
   ===================================================================== */

/* [instant, intensité] : chaque impact sonore secoue aussi la caméra. */
const IMPACTS = [
  [CUE.open, 0.55], [CUE.lock, 1.0], [CUE.star, 1.15], [CUE.w1, 0.5], [CUE.w2, 0.55], [CUE.w3, 0.85], [CUE.cut2, 0.7],
  [CUE.land[0], 0.22], [CUE.land[1], 0.22], [CUE.land[2], 0.25], [CUE.land[3], 0.3], [CUE.land[4], 0.32], [CUE.land[5], 0.34], [CUE.land[6], 0.5],
  [CUE.cards[0], 0.6], [CUE.cards[1], 0.6], [CUE.cards[2], 0.6], [CUE.cards[3], 0.6], [CUE.mem + 0.1, 0.5], [CUE.prod1 + 0.05, 1.0],
  [CUE.cut3, 0.6], [CUE.title3, 1.0], [CUE.shield1, 0.45],
  [CUE.hits[0], 0.5], [CUE.hits[1], 0.55], [CUE.hits[2], 0.6], [CUE.hits[3], 0.7], [CUE.big, 1.9],
  [CUE.slam, 1.6], [CUE.pass1, 0.3], [CUE.pass2, 0.3], [CUE.turn1, 0.45],
  [CUE.hit, 0.95], [CUE.title, 1.35]
];

function shakeAt(t) {
  let x = 0, y = 0, r = 0, z = 0;
  for (let i = 0; i < IMPACTS.length; i++) {
    const d = t - IMPACTS[i][0];
    if (d < 0 || d > 1.3) continue;
    const a = IMPACTS[i][1], e = Math.exp(-d * 6.2) * a, k = IMPACTS[i][0] * 13.7;
    x += e * 15 * snoise1(d * 33 + k);
    y += e * 19 * snoise1(d * 29 + k + 41.3);
    r += e * 0.0085 * snoise1(d * 24 + k + 87.9);
    z += a * 0.03 * Math.exp(-d * 5);
  }
  return { x, y, r, z };
}

/* [instant, crête en px, montée (s), retombée (s)] : aberration fugace sur les transitions. */
const ABERR = [
  [3.5, 9, 0.5, 0.3], [CUE.lock, 6, 0.02, 0.2], [CUE.star, 8, 0.02, 0.3], [8.62, 11, 0.38, 0.22], [CUE.cut2, 8, 0.02, 0.22],
  [CUE.astro, 6, 0.1, 0.2], [CUE.cards[0], 8, 0.08, 0.14], [CUE.cards[1], 8, 0.08, 0.14], [CUE.cards[2], 8, 0.08, 0.14], [CUE.cards[3], 8, 0.08, 0.14],
  [CUE.mem, 8, 0.1, 0.18], [CUE.prod1 + 0.05, 6, 0.02, 0.22], [19.72, 11, 0.42, 0.2], [CUE.cut3, 8, 0.02, 0.22],
  [CUE.title3, 6, 0.02, 0.2], [CUE.big, 15, 0.03, 0.5], [30.72, 10, 0.45, 0.2], [CUE.slam, 11, 0.02, 0.32],
  [33.92, 10, 0.5, 0.36], [41.78, 10, 0.4, 0.2], [CUE.hit, 8, 0.02, 0.3], [CUE.title, 10, 0.02, 0.36]
];
function aberrAt(t) {
  let a = 0;
  for (let i = 0; i < ABERR.length; i++) {
    const e = ABERR[i], d = t - e[0];
    if (d < -e[2] || d > e[3] * 4) continue;
    const v = d < 0 ? e[1] * ease.inCubic(1 + d / e[2]) : e[1] * Math.exp((-d / e[3]) * 2.2);
    if (v > a) a = v;
  }
  return a;
}

/* [instant, force, couleur] : flash additif de deux à trois images sur les coupes. */
const FLASHES = [

        if (lon < coast(lat)) { f[j * (nx + 1) + i] = NaN; continue; }
        const north = clamp((lat - 37.05) / 1.5), n2 = north * north * (3 - 2 * north);
        const ax = x - (36.0 - LON0) * K, ay = y + (33.85 - LAT0);
        const anti = Math.exp(-(ax * ax * 2.2 + ay * ay * 1.1) / 0.55);
        f[j * (nx + 1) + i] = fbm2(x * 1.15 + 3.7, y * 1.15 + 8.2, 4) * (0.42 + 0.95 * n2 + 0.8 * anti) + 0.3 * n2 + 0.18 * anti;
      }
    }
    return contourPaths(f, x0, y0, step, step, nx, ny, [0.2, 0.27, 0.34, 0.42, 0.5, 0.6, 0.7, 0.82, 0.95]);
  })();

  /* Trace la portion 0 → p d'une polyligne dans le chemin courant et renvoie la tête du laser. */
  function polyPartial(ctx, pl, p) {
    const pts = pl.pts, L = pl.L, target = pl.len * p;
    ctx.moveTo(pts[0][0], pts[0][1]);
    let i = 1;
    for (; i < pts.length && L[i] <= target; i++) ctx.lineTo(pts[i][0], pts[i][1]);
    if (i < pts.length) {
      const f = (target - L[i - 1]) / (L[i] - L[i - 1] || 1);
      const x = lerp(pts[i - 1][0], pts[i][0], f), y = lerp(pts[i - 1][1], pts[i][1], f);
      ctx.lineTo(x, y);
      return [x, y];
    }
    return pts[pts.length - 1];
  }

  /* [nom, lon, lat, apparition, côté de l'étiquette (+1 droite, -1 gauche), 0 = vue large, 1 = vue rapprochée] */
  const CITIES = [
    ['DAMAS', 36.29, 33.51, 1.45, 1, 0], ['ALEP', 37.16, 36.2, 1.65, 1, 0], ['ANTIOCHE', 36.16, 36.2, 1.75, -1, 0],
    ['HOMS', 36.72, 34.73, 1.85, 1, 0], ['AL-QUDS', 35.22, 31.78, 1.55, 1, 0], ['LE CAIRE', 31.24, 30.04, 1.35, 1, 0],
    ['MOSSOUL', 43.13, 36.34, 1.95, -1, 0], ['ÉDESSE', 38.79, 37.16, 2.4, -1, 1], ['RAQQA', 39.01, 35.95, 2.45, 1, 1]
  ];
  /* [texte, lon, lat, taille, interlettrage, italique, vue, alignement] */
  const REGIONS = [
    ['Mer Méditerranée', 33.3, 33.35, 31, 5, 1, 0, 'center'], ['Mer Noire', 36.2, 42.75, 27, 5, 1, 0, 'center'],
    ['ANATOLIE', 34.4, 38.7, 28, 14, 0, 0, 'center'], ['AL-JAZÎRA', 41.0, 35.55, 26, 12, 0, 0, 'center'],
    ['BILÂD ACH-CHÂM', 38.75, 32.35, 24, 10, 0, 0, 'center'],
    ['HEDJAZ', 38.5, 27.95, 24, 14, 0, 0, 'center'], ['IRAQ', 42.55, 32.9, 26, 14, 0, 0, 'center'],
    ['Euphrate', 38.33, 36.25, 28, 3, 1, 1, 'center'], ['Balîkh', 39.3, 36.42, 24, 3, 1, 1, 'center'],
    ['AL-JAZÎRA', 40.0, 36.05, 26, 16, 0, 1, 'center']
  ];

  function cam(t) {
    let cx = 0, cy = 0, z = lerp(96, 103, ease.outQuad(prog(t, 0, CUE.zoom0))), oy = 960, rot = 0;
    if (t >= CUE.zoom0) {
      const e = bez.ramp(prog(t, CUE.zoom0, CUE.lock));
      const ec = 1 - Math.pow(1 - e, 2.4);
      cx = HARRAN[0] * ec;
      cy = HARRAN[1] * ec;
      z = 103 * Math.pow(430 / 103, e);
      oy = lerp(960, 1250, e);
      rot = -0.06 * Math.sin(e * PI);
    }
    if (t >= CUE.lock) z = 430 * (1 + 0.06 * prog(t, CUE.lock, CUE.pan0));
    if (t >= CUE.pan0) {
      const e = bez.whip(prog(t, CUE.pan0, 8.94));
      cx = lerp(HARRAN[0], DAMAS[0], e);
      cy = lerp(HARRAN[1], DAMAS[1], e);
      z = 455.8 * (1 + 0.32 * e);
      oy = lerp(1250, 1000, e);
    }
    return { cx, cy, z, oy, rot };
  }
  const toScreen = (c, m) => {
    const dx = (m[0] - c.cx) * c.z, dy = (m[1] - c.cy) * c.z, cs = Math.cos(c.rot), sn = Math.sin(c.rot);
    return [CX + dx * cs - dy * sn, c.oy + dx * sn + dy * cs];
  };

  function drawMap(ctx, t, c, alpha) {
    if (alpha <= 0.004) return;
    const px = 1 / c.z, heads = [];
    ctx.save();
    ctx.translate(CX, c.oy);
    ctx.rotate(c.rot);
    ctx.scale(c.z, c.z);
    ctx.translate(-c.cx, -c.cy);

    /* Graticule : les méridiens et parallèles s'ouvrent depuis le centre. */
    const g = ease.outQuart(prog(t, CUE.open, CUE.open + 0.85));
    if (g > 0) {
      const ext = 17 * g, zin = prog(c.z, 170, 360);
      for (let pass = 0; pass < 2; pass++) {
        ctx.beginPath();
        for (let lon = 24; lon <= 50; lon++) {
          if ((lon % 2 === 0) !== (pass === 0)) continue;
          const x = (lon - LON0) * K;
          ctx.moveTo(x, c.cy - ext);
          ctx.lineTo(x, c.cy + ext);
        }
        for (let lat = 20; lat <= 48; lat++) {
          if ((lat % 2 === 0) !== (pass === 0)) continue;
          const y = -(lat - LAT0);
          ctx.moveTo(c.cx - ext, y);
          ctx.lineTo(c.cx + ext, y);
        }
        ctx.strokeStyle = rgba(PAL.gold, (pass === 0 ? 0.24 : 0.07 + 0.13 * zin) * alpha);
        ctx.lineWidth = px;
        ctx.stroke();
      }
      if (zin > 0.02) {
        const hw = (W / 2 + 80) * px, hu = (c.oy + 80) * px, hd = (H - c.oy + 80) * px;
        ctx.beginPath();
        for (let lon = Math.ceil(((c.cx - hw) / K + LON0) * 4) / 4; (lon - LON0) * K <= c.cx + hw; lon += 0.25) {
          if (Math.abs(lon - Math.round(lon)) < 1e-6) continue;
          const x = (lon - LON0) * K;
          ctx.moveTo(x, c.cy - hu);
          ctx.lineTo(x, c.cy + hd);
        }
        for (let lat = Math.ceil((LAT0 - (c.cy + hd)) * 4) / 4; -(lat - LAT0) >= c.cy - hu; lat += 0.25) {
          if (Math.abs(lat - Math.round(lat)) < 1e-6) continue;
          const y = -(lat - LAT0);
          ctx.moveTo(c.cx - hw, y);
          ctx.lineTo(c.cx + hw, y);
        }
        ctx.strokeStyle = rgba(PAL.gold, 0.07 * zin * alpha);
        ctx.lineWidth = px * 0.8;
        ctx.stroke();
      }
    }

    /* Relief en vue rapprochée, lignes d'eau en vue large. */
    const relief = prog(c.z, 150, 330) * alpha;
    if (relief > 0.004) {
      for (let i = 0; i < RELIEF.length; i++) {
        ctx.strokeStyle = rgba(i % 3 === 2 ? PAL.gold : PAL.goldDeep, (i % 3 === 2 ? 0.4 : 0.36) * relief);
        ctx.lineWidth = px * (i % 3 === 2 ? 1.3 : 0.9);
        ctx.stroke(RELIEF[i]);
      }
    }
    const water = (1 - prog(c.z, 150, 280)) * alpha;
    if (water > 0.004) {
      for (let k = 0; k < 3; k++) {
        const wa = prog(t, 1.2 + k * 0.25, 2.1 + k * 0.25) * water * [0.3, 0.19, 0.11][k];
        if (wa <= 0.003) continue;
        ctx.strokeStyle = rgba(RIVER, wa);
        ctx.lineWidth = px;
        ctx.stroke(WATER[k]);
      }
    }

    /* Côtes, fleuves et lacs : tracé progressif, tête de laser incandescente. */
    for (let i = 0; i < LINES.length; i++) {
      const L = LINES[i], p = prog(t, L[2], L[3]);
      if (p <= 0) continue;
      const pl = POLY[L[0]], kind = L[1];
      const col = kind === 1 ? RIVER : PAL.gold;
      const w = (kind === 0 ? 2.2 : 1.45) * px, a = (kind === 1 ? 0.6 : 0.95) * alpha, halo = kind === 0 ? 1 : 0.45;
      if (p >= 1) {
        glowStrokePath(ctx, pl.path, col, w, a, halo);
      } else {
        ctx.beginPath();
        heads.push(polyPartial(ctx, pl, ease.outQuad(p)));
        glowStroke(ctx, col, w, a, halo);
      }
    }
    ctx.restore();

    ctx.globalCompositeOperation = 'lighter';
    for (let i = 0; i < heads.length; i++) {
      const s = toScreen(c, heads[i]);
      const fl = 0.75 + 0.25 * Math.sin(t * 90 + i * 2.1);
      const beam = ctx.createLinearGradient(CX, -140, s[0], s[1]);
      beam.addColorStop(0, rgba(PAL.gold, 0));
      beam.addColorStop(1, rgba(PAL.goldHi, 0.3 * fl * alpha));
      ctx.strokeStyle = beam;
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(CX, -140);
      ctx.lineTo(s[0], s[1]);
      ctx.stroke();
      glow(ctx, SPR.warm, s[0], s[1], 38 * fl, 0.95 * alpha);
      glow(ctx, SPR.gold, s[0], s[1], 90, 0.3 * alpha);
    }
    ctx.globalCompositeOperation = 'source-over';
  }

  function drawLabels(ctx, t, c, alpha) {
    const wide = (1 - prog(c.z, 125, 210)) * alpha, near = prog(c.z, 280, 425) * alpha * (1 - prog(t, CUE.pan0, CUE.pan0 + 0.2));
    for (let i = 0; i < REGIONS.length; i++) {
      const R = REGIONS[i], a = (R[6] === 0 ? wide * prog(t, 1.5 + i * 0.07, 2.1 + i * 0.07) : near) * (R[5] ? 0.5 : 0.36);
      if (a <= 0.004) continue;
      const s = toScreen(c, P(R[1], R[2]));
      txtTracked(ctx, R[5] ? 'serifI' : 'serif', R[0], s[0], s[1], R[3], R[4], rgba(R[5] ? RIVER : PAL.goldHi, 1), R[7], a);
    }
    for (let i = 0; i < CITIES.length; i++) {
      const C = CITIES[i], vis = C[5] === 0 ? wide : near;
      const pop = prog(t, C[3], C[3] + 0.28);
      if (vis <= 0.004 || pop <= 0) continue;
      const s = toScreen(c, P(C[1], C[2])), e = ease.outBack(pop, 2.4);
      ctx.globalAlpha = vis;
      ctx.fillStyle = rgba(PAL.goldHi, 1);
      ctx.beginPath();
      pathPoly(ctx, s[0], s[1], 6.5 * e, 4, 0);
      ctx.fill();
      ctx.globalAlpha = 1;
      ctx.beginPath();
      ctx.arc(s[0], s[1], 12 * e, 0, TAU);
      ctx.strokeStyle = rgba(PAL.gold, 0.5 * vis);
      ctx.lineWidth = 1.2;
      ctx.stroke();
      txtTracked(ctx, 'serif', C[0], s[0] + C[4] * 22, s[1] + 9, C[5] ? 29 : 26, 3, rgba(PAL.ivory, 1), C[4] > 0 ? 'left' : 'right', vis * 0.86 * clamp(pop * 1.4));
    }
    /* Harran, signalé avant la plongée. */
    const hp = prog(t, 2.35, 2.65);
    if (hp > 0 && wide > 0.004) {
      const s = toScreen(c, HARRAN), e = ease.outBack(hp, 2.6);
      ctx.globalCompositeOperation = 'lighter';
      glow(ctx, SPR.gold, s[0], s[1], 54 * e, 0.8 * wide);
      ctx.globalCompositeOperation = 'source-over';
      for (let k = 0; k < 2; k++) {
        const ph = fract((t - 2.4) * 1.5 + k * 0.5);
        ctx.beginPath();
        ctx.arc(s[0], s[1], 10 + ph * 46, 0, TAU);
        ctx.strokeStyle = rgba(PAL.goldHi, (1 - ph) * 0.7 * wide);
        ctx.lineWidth = 1.6;
        ctx.stroke();
      }
      ctx.fillStyle = rgba(PAL.goldHi, wide);
      ctx.beginPath();
      pathPoly(ctx, s[0], s[1], 8.5 * e, 4, 0);
      ctx.fill();
      txtTracked(ctx, 'serif', 'HARRAN', s[0] + 24, s[1] + 10, 31, 4, rgba(PAL.goldHi, 1), 'left', wide * clamp(hp * 1.4));
    }
    /* Rose des vents et échelle (vue large). */
    const dec = wide * prog(t, 1.7, 2.3);
    if (dec > 0.004) {
      const x = 912, y = 1668;
      ctx.beginPath();
      pathStar(ctx, x, y, 44, 9, 4, -PI / 2);
      pathStar(ctx, x, y, 26, 8, 4, -PI / 4);
      ctx.strokeStyle = rgba(PAL.gold, 0.7 * dec);
      ctx.lineWidth = 1.3;
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(x, y, 34, 0, TAU);
      ctx.strokeStyle = rgba(PAL.gold, 0.3 * dec);
      ctx.stroke();
      txt(ctx, 'serif', 'N', x, y - 56, 28, rgba(PAL.goldHi, 1), 'center', 0.8 * dec);
      const km = (200 / 111.2) * c.z;
      ctx.beginPath();
      const bx = 560, by = 1742;
      ctx.moveTo(bx, by);
      ctx.lineTo(bx + km, by);
      ctx.moveTo(bx, by - 8);
      ctx.lineTo(bx, by + 8);
      ctx.moveTo(bx + km / 2, by - 5);
      ctx.lineTo(bx + km / 2, by + 5);
      ctx.moveTo(bx + km, by - 8);
      ctx.lineTo(bx + km, by + 8);
      ctx.strokeStyle = rgba(PAL.gold, 0.6 * dec);
      ctx.lineWidth = 1.3;
      ctx.stroke();
      txtTracked(ctx, 'serif', '200 KM', bx + km + 16, by + 9, 22, 3, rgba(PAL.goldHi, 1), 'left', 0.6 * dec);
    }
  }

  /* Mire de verrouillage sur Harran. */
  function drawReticle(ctx, t, x, y, alpha) {
    const p = prog(t, CUE.lock - 0.12, CUE.lock + 0.3);
    if (p <= 0 || alpha <= 0.004) return;
    const e = bez.snap(p), spin = t * 0.9;
    ctx.globalCompositeOperation = 'lighter';
    glow(ctx, SPR.gold, x, y, 120, 0.5 * alpha);
    glow(ctx, SPR.warm, x, y, 22, alpha);
    ctx.globalCompositeOperation = 'source-over';
    for (let k = 0; k < 2; k++) {
      const ph = fract((t - CUE.lock) * 0.9 + k * 0.5);
      if (t < CUE.lock) break;
      ctx.beginPath();
      ctx.arc(x, y, 30 + ph * 230, 0, TAU);
      ctx.strokeStyle = rgba(PAL.gold, (1 - ph) * 0.28 * alpha);
      ctx.lineWidth = 1.4;
      ctx.stroke();
    }
    ctx.beginPath();
    ctx.arc(x, y, 24, 0, TAU);
    glowStroke(ctx, PAL.goldHi, 2, alpha * clamp(p * 2), 0.8);
    ctx.save();
    ctx.setLineDash([7, 9]);
    ctx.beginPath();
    ctx.arc(x, y, 46, spin, spin + TAU);
    ctx.strokeStyle = rgba(PAL.gold, 0.8 * alpha);
    ctx.lineWidth = 1.5;
    ctx.stroke();
    ctx.restore();
    const R = lerp(190, 76, e);
    ctx.beginPath();
    for (let k = 0; k < 4; k++) {
      const a = -spin * 0.5 + (k * PI) / 2;
      ctx.moveTo(x + Math.cos(a - 0.5) * R, y + Math.sin(a - 0.5) * R);
      ctx.arc(x, y, R, a - 0.5, a + 0.5);
    }
    glowStroke(ctx, PAL.goldHi, 2.4, alpha * clamp(p * 2), 0.9);
    ctx.beginPath();
    for (let k = 0; k < 4; k++) {
      const a = (k * PI) / 2, r0 = lerp(150, 92, e), r1 = r0 + 22;
      ctx.moveTo(x + Math.cos(a) * r0, y + Math.sin(a) * r0);
      ctx.lineTo(x + Math.cos(a) * r1, y + Math.sin(a) * r1);
    }
    ctx.strokeStyle = rgba(PAL.goldHi, 0.9 * alpha);
    ctx.lineWidth = 2;
    ctx.stroke();
  }

  /* Bloc typographique « 661 H / HARRAN ». */
  function drawLockup(ctx, t) {
    const inP = prog(t, CUE.lock, CUE.lock + 0.34), out = ease.inCubic(prog(t, CUE.wave0 + 0.05, CUE.wave0 + 0.4));
    if (inP <= 0 || out >= 1) return;
    const a = 1 - out, ox = -out * 420, sk = -out * 0.35;
    ctx.save();
    ctx.translate(CX + ox, 0);
    ctx.transform(1, 0, sk, 1, 0, 0);
    ctx.translate(-CX, 0);
    ctx.globalAlpha = 1;
    glow(ctx, SPR.dark, CX, 620, 620, 0.9 * a * clamp(inP * 2));
    const s1 = TX.fit('display', '661 H', 600, 330), c1 = TX.cap('display') * s1;
    const base1 = 392 + c1;
    txtSlam(ctx, 'display', '661 H', CX, base1, s1, rgba(PAL.ivory, 1), inP, { from: 2.2, stagger: 0.07, alpha: a });
    const rp = ease.outExpo(prog(t, CUE.lock + 0.12, CUE.lock + 0.6));
    const ry = base1 + 48;
    if (rp > 0) {
      ctx.beginPath();
      ctx.moveTo(CX - 250 * rp, ry);
      ctx.lineTo(CX - 20, ry);
      ctx.moveTo(CX + 20, ry);
      ctx.lineTo(CX + 250 * rp, ry);

      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.fillStyle = rgba(PAL.goldHi, a);

      pathPoly(ctx, CX, ry, 9 * rp, 4, 0);
      ctx.fill();
    }
    const hp = prog(t, CUE.lock + 0.16, CUE.lock + 0.7);
    if (hp > 0) {
      const he = ease.outExpo(hp), s2 = 132, tr = lerp(90, 26, he);
      txtTracked(ctx, 'display', 'HARRAN', CX, ry + 44 + TX.cap('display') * s2, s2, tr, rgba(PAL.goldHi, 1), 'center', a * clamp(hp * 3));
    }
    const np = prog(t, CUE.lock + 0.45, CUE.lock + 0.95);
    if (np > 0) {
      const y = ry + 44 + TX.cap('display') * 132 + 74;
      txtRise(ctx, 'serifI', 'Naissance d’Ahmad Ibn Taymiyya, 1263', CX, y, 40, rgba(PAL.ivory, 1), np, 'center', 0.92 * a);
      txtTracked(ctx, 'serif', '36°52′ N    39°02′ E', CX, y + 54, 25, 4, rgba(PAL.gold, 1), 'center', 0.85 * a * prog(t, CUE.lock + 0.7, CUE.lock + 1.1));
    }

  }

  /* Onde de choc rouge sombre, rendue sur un calque à part pour que l'étoile puisse y creuser sa bulle. */
  function drawWave(ctx, t, sx, sy, starR) {
    const tin = prog(t, CUE.wave0, CUE.star), tout = prog(t, CUE.star, CUE.star + 1.3);
    if (tin <= 0 || tout >= 1) return;
    const L = SPR.layer, g = L.getContext('2d');
    g.setTransform(1, 0, 0, 1, 0, 0);
    g.globalCompositeOperation = 'source-over';
    g.globalAlpha = 1;
    g.clearRect(0, 0, L.width, L.height);
    g.setTransform(0.5, 0, 0, 0.5, 0, 0);
    const wx = W + 760, wy = 1010;
    const Rf = lerp(lerp(700, 1300, ease.outCubic(tin)), 560, ease.inOutCubic(tout));
    const front = (R, seed, close) => {
      g.beginPath();
      for (let i = 0; i <= 90; i++) {
        const th = PI - 1.25 + (i / 90) * 2.5;
        const n = 1 + 0.045 * (noise2(th * 7 + seed, t * 1.4 + seed) - 0.5) * 2 + 0.016 * (noise2(th * 27 + seed, t * 3.3) - 0.5) * 2;
        const x = wx + Math.cos(th) * R * n, y = wy + Math.sin(th) * R * n;
        if (i === 0) g.moveTo(x, y); else g.lineTo(x, y);
      }
      if (close) {
        g.lineTo(W + 300, H + 400);
        g.lineTo(W + 300, -400);
        g.closePath();
      }
    };
    front(Rf, 3, true);
    const body = g.createRadialGradient(wx, wy, Rf * 0.45, wx, wy, Rf * 1.04);
    body.addColorStop(0, 'rgba(60,6,8,0.5)');
    body.addColorStop(0.7, 'rgba(110,16,18,0.5)');
    body.addColorStop(1, 'rgba(150,24,22,0.66)');
    g.fillStyle = body;
    g.fill();
    g.lineJoin = 'round';
    for (let k = 0; k < 5; k++) {
      front(Rf - k * (58 + k * 22), 3 + k * 5, false);
      const a = k === 0 ? 1 : 0.42 / k;
      g.strokeStyle = 'rgba(160,26,22,' + (0.3 * a).toFixed(3) + ')';
      g.lineWidth = 26;
      g.stroke();
      g.strokeStyle = 'rgba(214,56,40,' + (0.5 * a).toFixed(3) + ')';
      g.lineWidth = 9;
      g.stroke();
      g.strokeStyle = 'rgba(255,150,110,' + (0.9 * a).toFixed(3) + ')';
      g.lineWidth = 2.6;
      g.stroke();
    }
    if (starR > 2) {
      g.globalCompositeOperation = 'destination-out';
      const rb = starR * 1.42;
      const hole = g.createRadialGradient(sx, sy, 0, sx, sy, rb);
      hole.addColorStop(0, 'rgba(0,0,0,1)');
      hole.addColorStop(0.72, 'rgba(0,0,0,1)');
      hole.addColorStop(1, 'rgba(0,0,0,0)');
      g.fillStyle = hole;
      g.fillRect(sx - rb, sy - rb, rb * 2, rb * 2);
      g.globalCompositeOperation = 'source-over';
    }
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = clamp(tin * 5) * (1 - ease.inQuad(tout));
    ctx.drawImage(L, 0, 0, W, H);
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
  }

  /* Khatam : étoile à huit branches née de deux carrés, ici en entrelacs à double filet. */
  function drawKhatam(ctx, x, y, R, rot, alpha, detail, fold) {
    if (R < 1 || alpha <= 0.004) return;
    ctx.globalCompositeOperation = 'lighter';
    glow(ctx, SPR.gold, x, y, R * 2.3, 0.36 * alpha);
    if (detail > 0.01) {
      const gr = ctx.createRadialGradient(x, y, R * 0.2, x, y, R * 3.1);
      gr.addColorStop(0, rgba(PAL.goldHi, 0.2 * alpha * detail));
      gr.addColorStop(1, rgba(PAL.gold, 0));
      ctx.fillStyle = gr;
      ctx.beginPath();
      for (let i = 0; i < 16; i++) {
        const a = rot * 0.5 + (i / 16) * TAU, hw = i % 2 === 0 ? 0.05 : 0.026;
        ctx.moveTo(x, y);
        ctx.lineTo(x + Math.cos(a - hw) * R * 3.1, y + Math.sin(a - hw) * R * 3.1);
        ctx.lineTo(x + Math.cos(a + hw) * R * 3.1, y + Math.sin(a + hw) * R * 3.1);
        ctx.closePath();
      }
      ctx.fill();
    }
    ctx.globalCompositeOperation = 'source-over';

      srot = lerp(-PI / 5, 0, ease.outQuint(prog(t, CUE.star, CUE.star + 1.2))) + (t - CUE.star) * 0.03;

        ctx.beginPath();
        ctx.rect(sx - hw, sy - hh, hw * 2, hh * 2);
        glowStroke(ctx, PAL.gold, lerp(9, 3, morph), 1, 1);
        ctx.beginPath();
        ctx.rect(sx - hw, sy - hh, hw * 2, hh * 2);
        ctx.strokeStyle = rgba(PAL.bg, 1 - morph);

/* =====================================================================
   ACTE II — LE PILIER DE DAMAS (9 → 20 s)
   La Grande Mosquée des Omeyyades s'extrude en 3D filaire et ombrée,
   un astrolabe calculé pour la latitude de Damas tourne au-dessus d'elle,

const A2 = (() => {
  /* ---------- Mini-moteur 3D : x = est, y = haut, z = sud (mètres stylisés) ---------- */

  const part = (t0, d, style, mode, px, py, pz) => {
    parts.push({ t0, d, style, mode: mode || 0, px: px || 0, py: py || 0, pz: pz || 0 });
    cur = parts.length - 1;

  const line = (x1, y1, z1, x2, y2, z2) => {
    segBuf.push(x1, y1, z1, x2, y2, z2, cur, Math.hypot((x1 + x2) / 2, (z1 + z2) / 2));

    const v = [-0.5, 0.72, -0.48], l = Math.hypot(v[0], v[1], v[2]);

    for (let i = 0; i < pts.length; i++) { mx += pts[i][0]; my += pts[i][1]; mz += pts[i][2]; }

<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b3d2e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Tajweed Pas à Pas</title>
<link rel="icon" href="icon.svg">
<link rel="preload" href="fonts/amiri-quran.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/app.css">
<script>
  // thème appliqué avant le rendu (évite le flash blanc)
  (function(){try{var s=JSON.parse(localStorage.getItem('tajweed:state')||'{}');var t=(s.settings||{}).theme||'auto';
  var dark=t==='dark'||(t==='auto'&&matchMedia('(prefers-color-scheme: dark)').matches);document.documentElement.dataset.theme=dark?'dark':'light';}catch(e){}})();
</script>
</head>
<body>
<header class="topbar" id="topbar">
  <button class="iconbtn" id="backBtn" aria-label="Retour" hidden>
    <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
  <div class="topbar-title" id="topTitle">Tajweed Pas à Pas</div>
  <button class="iconbtn legend-btn" id="legendBtn" aria-label="Légende des couleurs" title="Légende des couleurs">
    <svg viewBox="0 0 24 24"><circle cx="8" cy="8" r="3.2" fill="#d0021b"/><circle cx="16" cy="8" r="3.2" fill="#14806a"/><circle cx="8" cy="16" r="3.2" fill="#e07a10"/><circle cx="16" cy="16" r="3.2" fill="#8e2aa6"/></svg>
  </button>
</header>

<main id="view" tabindex="-1"></main>

<nav class="tabbar" id="tabbar">
  <a href="#/" data-tab="cours"><svg viewBox="0 0 24 24"><path d="M4 5.5C4 4.7 4.7 4 5.5 4H11v15H5.5A1.5 1.5 0 0 1 4 17.5z M20 5.5c0-.8-.7-1.5-1.5-1.5H13v15h5.5c.8 0 1.5-.7 1.5-1.5z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg><span>Cours</span></a>
  <a href="#/lecture" data-tab="lecture"><svg viewBox="0 0 24 24"><path d="M3 12s3.5-6 9-6 9 6 9 6-3.5 6-9 6-9-6-9-6z" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="12" r="2.6" fill="currentColor"/></svg><span>Lecture</span></a>
  <a href="#/revision" data-tab="revision"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.6M20 4v4.5h-4.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Révision</span><b class="badge" id="revBadge" hidden></b></a>
  <a href="#/glossaire" data-tab="glossaire"><svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M15 15l5 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg><span>Glossaire</span></a>
  <a href="#/profil" data-tab="profil"><svg viewBox="0 0 24 24"><path d="M5 20V10M12 20V4M19 20v-7" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg><span>Progrès</span></a>
</nav>

<div class="sheet-backdrop" id="sheetBackdrop" hidden></div>
<section class="sheet" id="sheet" hidden role="dialog" aria-modal="true">
  <div class="sheet-grip"></div>
  <div id="sheetBody"></div>
</section>
<div class="toast" id="toast" hidden></div>

<script type="module" src="js/app.js"></script>
</body>
</html>

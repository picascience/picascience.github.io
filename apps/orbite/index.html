<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#03050d">
<title>Orbite</title>
<style>
:root{--acc:#7dd3fc;--gold:#fde68a;--sat:env(safe-area-inset-top);--sab:env(safe-area-inset-bottom)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#02040b;overflow:hidden;color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",system-ui,sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;touch-action:none;overscroll-behavior:none}
body{position:fixed;inset:0}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
#sa{position:fixed;visibility:hidden;pointer-events:none;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.glass{background:rgba(255,255,255,.065);border:1px solid rgba(255,255,255,.11);-webkit-backdrop-filter:blur(14px) saturate(140%);backdrop-filter:blur(14px) saturate(140%)}
.ib{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;transition:transform .15s,background .2s}
.ib:active{transform:scale(.9);background:rgba(255,255,255,.14)}
.ib svg{width:20px;height:20px}
/* HUD */
#hud{position:fixed;left:0;right:0;top:0;padding:calc(var(--sat) + 8px) 12px 0;display:flex;align-items:center;gap:10px;z-index:5;transition:opacity .35s,transform .35s}
#hud .ttl{flex:1;min-width:0;line-height:1.1}
#hLvl{font-size:11px;font-weight:700;letter-spacing:.14em;color:var(--acc);text-transform:uppercase}
#hName{font-size:17px;font-weight:650;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{height:42px;border-radius:14px;display:flex;align-items:center;gap:8px;padding:0 12px;font-variant-numeric:tabular-nums}
#hCr{display:flex;gap:3px}
#hCr svg{width:14px;height:14px;transition:transform .3s cubic-bezier(.3,1.8,.5,1)}
#hCr svg.on{transform:scale(1.25)}
#hShots{font-size:15px;font-weight:650;min-width:16px;text-align:right}
#hShotsL{font-size:10px;opacity:.55;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.hidden{opacity:0!important;pointer-events:none!important}
#hud.hidden{transform:translateY(-12px)}
/* aim info + banners */
#aimInfo{position:fixed;left:50%;bottom:calc(var(--sab) + 44px);transform:translateX(-50%);font-size:13px;font-weight:600;letter-spacing:.02em;
  padding:8px 14px;border-radius:999px;font-variant-numeric:tabular-nums;z-index:4;transition:opacity .2s;white-space:nowrap}
#aimInfo b{color:var(--acc);font-weight:700}
#banner{position:fixed;left:0;right:0;top:calc(var(--sat) + 74px);text-align:center;z-index:4;pointer-events:none;transition:opacity .6s,transform .6s}
#banner .w{font-size:11px;font-weight:700;letter-spacing:.3em;text-transform:uppercase;color:var(--acc);opacity:.9}
#banner .n{font-size:30px;font-weight:200;letter-spacing:.04em;margin-top:4px;text-shadow:0 2px 20px rgba(0,0,0,.6)}
#banner.hidden{transform:translateY(-8px)}
#tip{position:fixed;left:50%;bottom:calc(var(--sab) + 44px);transform:translateX(-50%);z-index:4;font-size:14px;font-weight:500;padding:10px 16px;border-radius:999px;
  white-space:nowrap;transition:opacity .4s;pointer-events:none;color:rgba(255,255,255,.92)}
#toast{position:fixed;left:50%;top:42%;transform:translate(-50%,-50%) scale(1);z-index:6;font-size:15px;font-weight:650;letter-spacing:.02em;padding:11px 18px;border-radius:999px;
  pointer-events:none;transition:opacity .25s,transform .35s cubic-bezier(.2,1.6,.4,1);white-space:nowrap}
#toast.hidden{transform:translate(-50%,-50%) scale(.85)}
#toast small{display:block;text-align:center;font-size:11px;font-weight:500;opacity:.6;margin-top:2px}
/* écrans */
.screen{position:fixed;inset:0;z-index:10;transition:opacity .45s ease,transform .45s ease}
.screen.hidden{transform:scale(1.03)}
#home{display:flex;flex-direction:column;align-items:center;padding:calc(var(--sat) + 13vh) 28px calc(var(--sab) + 54px)}
#home .logo{font-size:56px;font-weight:200;letter-spacing:.34em;margin-right:-.34em;line-height:1;
  background:linear-gradient(180deg,#fff 30%,rgba(255,255,255,.55));-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 6px 30px rgba(125,211,252,.35))}
#home .sub{margin-top:14px;font-size:13px;font-weight:500;letter-spacing:.22em;text-transform:uppercase;color:rgba(255,255,255,.55)}
#home .grow{flex:1}
#home .stats{display:flex;gap:10px;margin-bottom:18px}
#home .stat{padding:9px 14px;border-radius:14px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:7px;font-variant-numeric:tabular-nums}
#home .stat svg{width:15px;height:15px}
.btn{height:56px;border-radius:18px;font-size:17px;font-weight:650;display:flex;align-items:center;justify-content:center;gap:10px;width:100%;max-width:340px;transition:transform .15s,filter .2s}
.btn:active{transform:scale(.96)}
.btn.pri{background:linear-gradient(180deg,#fff,#dbeafe);color:#06101f;box-shadow:0 10px 40px rgba(125,211,252,.35),inset 0 -2px 0 rgba(0,0,0,.08)}
.btn.pri small{font-weight:600;opacity:.55;font-size:14px}
.btn.sec{margin-top:12px}
#levels{display:flex;flex-direction:column;background:rgba(2,4,11,.55)}
#levels .top{display:flex;align-items:center;gap:12px;padding:calc(var(--sat) + 8px) 14px 10px}
#levels .top h2{font-size:22px;font-weight:700;letter-spacing:-.02em;flex:1}
#levels .top .tot{font-size:14px;font-weight:650;display:flex;align-items:center;gap:6px;padding:0 12px;height:42px;border-radius:14px;font-variant-numeric:tabular-nums}
#levels .top .tot svg{width:15px;height:15px}
#lvScroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;padding:4px 14px calc(var(--sab) + 44px)}
.world{border-radius:24px;padding:16px 14px 14px;margin-bottom:14px;position:relative;overflow:hidden}
.world .wbg{position:absolute;inset:0;opacity:.9;z-index:-1}
.world .wh{display:flex;align-items:baseline;justify-content:space-between;margin:0 4px 12px}
.world .wn{font-size:11px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;opacity:.7}
.world .wt{font-size:24px;font-weight:300;letter-spacing:.02em;margin-top:2px}
.world .ws{font-size:12px;opacity:.6;margin-top:2px}
.world .wst{font-size:13px;font-weight:650;display:flex;align-items:center;gap:5px;font-variant-numeric:tabular-nums;opacity:.9}
.world .wst svg{width:13px;height:13px}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.tile{aspect-ratio:1/1.08;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;
  background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);transition:transform .15s;position:relative}
.tile:active{transform:scale(.92)}
.tile .num{font-size:19px;font-weight:650;font-variant-numeric:tabular-nums}
.tile .st{display:flex;gap:1px}
.tile .st svg{width:10px;height:10px}
.tile.cur{background:rgba(255,255,255,.2);border-color:rgba(255,255,255,.5);box-shadow:0 0 22px rgba(255,255,255,.18)}
.tile.lock{opacity:.38}
.tile.lock .num{display:none}
.tile svg.lk{width:16px;height:16px;opacity:.8}
.rule{margin:6px 6px 0;font-size:12px;line-height:1.5;color:rgba(255,255,255,.55);text-align:center}
/* victoire */
#win{display:flex;align-items:flex-end;justify-content:center;padding:0 14px calc(var(--sab) + 40px);background:radial-gradient(120% 70% at 50% 100%,rgba(0,0,0,.65),rgba(0,0,0,.1))}
#win .card{width:100%;max-width:400px;border-radius:30px;padding:26px 20px 18px;text-align:center;transform:translateY(0);transition:transform .55s cubic-bezier(.2,1.2,.3,1)}
#win.hidden .card{transform:translateY(60px)}
#win .k{font-size:11px;font-weight:700;letter-spacing:.26em;text-transform:uppercase;color:var(--gold)}
#win h3{font-size:28px;font-weight:300;letter-spacing:.02em;margin-top:6px}
#wStars{display:flex;justify-content:center;gap:14px;margin:18px 0 16px}
#wStars svg{width:54px;height:54px;transform:scale(0);filter:drop-shadow(0 6px 18px rgba(253,230,138,.0))}
#wStars svg.pop{animation:pop .6s cubic-bezier(.2,1.8,.4,1) forwards}
#wStars svg.pop.on{filter:drop-shadow(0 6px 18px rgba(253,230,138,.55))}
#wStars svg:nth-child(2){width:64px;height:64px;margin-top:-8px}
@keyframes pop{0%{transform:scale(0) rotate(-40deg)}100%{transform:scale(1) rotate(0)}}
.crit{display:flex;flex-direction:column;gap:7px;margin:0 6px 18px;text-align:left}
.crit div{display:flex;align-items:center;gap:10px;font-size:14px;color:rgba(255,255,255,.55)}
.crit div.ok{color:#fff}
.crit i{width:20px;height:20px;border-radius:7px;display:grid;place-items:center;background:rgba(255,255,255,.08);flex:none}
.crit div.ok i{background:var(--gold)}
.crit i svg{width:12px;height:12px}
.crit span.r{margin-left:auto;font-variant-numeric:tabular-nums;font-weight:600}
.row{display:flex;gap:10px}
.row .btn{height:52px;font-size:16px}
.row .btn.sec{margin-top:0;flex:0 0 52px}
#flash{position:fixed;inset:0;pointer-events:none;z-index:3;background:#fff;opacity:0}
</style>
</head>
<body>
<div id="sa"></div>
<canvas id="c"></canvas>
<div id="flash"></div>

<div id="hud" class="hidden">
  <button class="ib glass" id="bBack" aria-label="Niveaux"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
  <div class="ttl"><div id="hLvl">Aube · 1</div><div id="hName">Premier envol</div></div>
  <div class="pill glass"><div id="hCr"></div></div>
  <div class="pill glass" style="flex-direction:column;justify-content:center;gap:0;padding:0 11px"><div id="hShots">0</div><div id="hShotsL">tirs</div></div>
  <button class="ib glass" id="bRestart" aria-label="Recommencer"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 1 0 2.6-5.9"/><path d="M4 4v4.5h4.5"/></svg></button>
</div>
<div id="banner" class="hidden"><div class="w" id="bnW"></div><div class="n" id="bnN"></div></div>
<div id="tip" class="glass hidden"></div>
<div id="aimInfo" class="glass hidden"></div>
<div id="toast" class="glass hidden"></div>

<section id="home" class="screen">
  <div class="logo">ORBITE</div>
  <div class="sub">Fronde gravitationnelle</div>
  <div class="grow"></div>
  <div class="stats"><div class="stat glass" id="hsStars"></div><div class="stat glass" id="hsDone"></div></div>
  <button class="btn pri" id="bPlay">Jouer <small id="bPlaySub"></small></button>
  <button class="btn sec glass" id="bLevels">Niveaux</button>
</section>

<section id="levels" class="screen hidden">
  <div class="top">
    <button class="ib glass" id="bLvBack" aria-label="Retour"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
    <h2>Niveaux</h2>
    <div class="tot glass" id="lvTot"></div>
  </div>
  <div id="lvScroll"></div>
</section>

<section id="win" class="screen hidden">
  <div class="card glass">
    <div class="k">Portail atteint</div>
    <h3 id="wName">Premier envol</h3>
    <div id="wStars"></div>
    <div class="crit" id="wCrit"></div>
    <div class="row">
      <button class="btn sec glass" id="wList" aria-label="Niveaux"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"><rect x="4" y="4" width="6" height="6" rx="1.5"/><rect x="14" y="4" width="6" height="6" rx="1.5"/><rect x="4" y="14" width="6" height="6" rx="1.5"/><rect x="14" y="14" width="6" height="6" rx="1.5"/></svg></button>
      <button class="btn sec glass" id="wRetry" aria-label="Rejouer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 1 0 2.6-5.9"/><path d="M4 4v4.5h4.5"/></svg></button>
      <button class="btn pri" id="wNext" style="flex:1">Suivant</button>
    </div>
  </div>
</section>

<script src="core.js"></script>
<script src="levels.js"></script>
<script>
(function () {
'use strict';
var Core = window.OrbCore, WORLDS = window.OrbLevels.WORLDS, LEVELS = window.OrbLevels.LEVELS;
var $ = function (s) { return document.querySelector(s); };
var cv = $('#c'), ctx = cv.getContext('2d');
var TAU = Math.PI * 2;

/* ───────── sauvegarde (clés préfixées orbite:) */
var SK = 'orbite:save';
var save = (function () {
  try { var o = JSON.parse(localStorage.getItem(SK)); if (o && o.st) return o; } catch (e) {}
  return { st: [], sh: [], last: 0 };
})();
function persist() { try { localStorage.setItem(SK, JSON.stringify(save)); } catch (e) {} }
function stars(i) { return save.st[i] || 0; }
function unlocked(i) { return i === 0 || stars(i - 1) > 0 || stars(i) > 0; }
function totalStars() { var t = 0; for (var i = 0; i < LEVELS.length; i++) t += stars(i); return t; }
function firstOpen() { for (var i = 0; i < LEVELS.length; i++) if (!stars(i)) return i; return LEVELS.length - 1; }

/* ───────── palettes par monde */
var PAL = [
  { bg0: '#02050f', bg1: '#071a3a', neb: [205, 190, 235], acc: '#7dd3fc', accH: 199, rock: 215 },
  { bg0: '#07030f', bg1: '#220a3d', neb: [285, 320, 255], acc: '#e9a8ff', accH: 290, rock: 280 },
  { bg0: '#0b0402', bg1: '#36110a', neb: [18, 35, 350], acc: '#fdba74', accH: 28, rock: 20 },
  { bg0: '#010c0b', bg1: '#06302c', neb: [168, 185, 140], acc: '#5eead4', accH: 170, rock: 175 }
];
var pal = PAL[0];

/* ───────── utilitaires */
function rng(seed) { var s = seed >>> 0 || 1; return function () { s ^= s << 13; s >>>= 0; s ^= s >> 17; s ^= s << 5; s >>>= 0; return s / 4294967296; }; }
function mk(w, h) { var c = document.createElement('canvas'); c.width = Math.max(1, Math.ceil(w)); c.height = Math.max(1, Math.ceil(h)); return c; }
function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
function lerp(a, b, t) { return a + (b - a) * t; }
var STAR = '<path d="M12 2.6l2.8 5.9 6.4.8-4.7 4.4 1.2 6.4L12 17l-5.7 3.1 1.2-6.4-4.7-4.4 6.4-.8z"/>';
function starSvg(on, cls) { return '<svg viewBox="0 0 24 24" class="' + (cls || '') + '"><g fill="' + (on ? '#fde68a' : 'rgba(255,255,255,.22)') + '" stroke="' + (on ? '#f59e0b' : 'none') + '" stroke-width="1" stroke-linejoin="round">' + STAR + '</g></svg>'; }
function gemSvg(on) { return '<svg viewBox="0 0 24 24"><path d="M12 2l6.5 10L12 22 5.5 12z" fill="' + (on ? '#fde68a' : 'none') + '" stroke="' + (on ? '#fbbf24' : 'rgba(255,255,255,.4)') + '" stroke-width="2" stroke-linejoin="round"/>' + (on ? '<path d="M12 2v20M5.5 12h13" stroke="#f59e0b" stroke-width="1" opacity=".6"/>' : '') + '</svg>'; }

/* ───────── dimensions / Retina */
var DPR = 1, VW = 0, VH = 0, SA = { t: 0, b: 0 };
var view = { s: 1, ox: 0, oy: 0 };
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 3);
  VW = window.innerWidth; VH = window.innerHeight;
  cv.width = Math.round(VW * DPR); cv.height = Math.round(VH * DPR);
  var cs = getComputedStyle($('#sa'));
  SA.t = parseFloat(cs.paddingTop) || 0; SA.b = parseFloat(cs.paddingBottom) || 0;
  var top = SA.t + 60, bot = SA.b + 34;
  var aw = VW - 8, ah = VH - top - bot;
  var s = Math.min(aw / Core.W, ah / Core.H);
  view.s = s; view.ox = (VW - Core.W * s) / 2; view.oy = top + (ah - Core.H * s) / 2;
  spriteCache = {}; bgCache = null; levelLayer = null;
  makeStars();
}

/* ───────── fond spatial : nébuleuse précalculée + 3 couches d'étoiles en parallaxe */
var bgCache = null, bgPalIdx = -1, starsL = [];
function makeStars() {
  var r = rng(777); starsL = [];
  for (var l = 0; l < 3; l++) {
    var arr = [], n = [140, 70, 28][l];
    for (var i = 0; i < n; i++) arr.push({ x: r() * 1.2 - 0.1, y: r() * 1.2 - 0.1, s: [0.6, 1.1, 1.8][l] * (0.6 + r() * 0.7), a: 0.25 + r() * 0.75, tw: r() * TAU, sp: 0.5 + r() * 2 });
    starsL.push(arr);
  }
}
function buildBg(pi) {
  var p = PAL[pi], w = cv.width, h = cv.height;
  var c = mk(w, h), g = c.getContext('2d'), r = rng(31 + pi * 101);
  var lg = g.createLinearGradient(0, 0, w * 0.3, h);
  lg.addColorStop(0, p.bg0); lg.addColorStop(0.6, p.bg1); lg.addColorStop(1, p.bg0);
  g.fillStyle = lg; g.fillRect(0, 0, w, h);
  g.globalCompositeOperation = 'lighter';
  for (var i = 0; i < 9; i++) {
    var x = r() * w, y = r() * h, rad = (0.25 + r() * 0.45) * Math.max(w, h), hue = p.neb[i % 3];
    var rg = g.createRadialGradient(x, y, 0, x, y, rad);
    rg.addColorStop(0, 'hsla(' + hue + ',80%,55%,' + (0.05 + r() * 0.07) + ')');
    rg.addColorStop(0.5, 'hsla(' + hue + ',80%,40%,' + (0.02 + r() * 0.03) + ')');
    rg.addColorStop(1, 'hsla(' + hue + ',80%,30%,0)');
    g.fillStyle = rg; g.fillRect(0, 0, w, h);
  }
  // poussière fine
  for (i = 0; i < 900; i++) {
    g.fillStyle = 'rgba(255,255,255,' + (r() * 0.12) + ')';
    g.fillRect(r() * w, r() * h, DPR * 0.8, DPR * 0.8);
  }
  g.globalCompositeOperation = 'source-over';
  var vg = g.createRadialGradient(w / 2, h / 2, Math.min(w, h) * 0.3, w / 2, h / 2, Math.max(w, h) * 0.8);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,.55)');
  g.fillStyle = vg; g.fillRect(0, 0, w, h);
  bgCache = c; bgPalIdx = pi;
}
var par = { x: 0, y: 0 };
function drawBg(pi, now) {
  if (!bgCache || bgPalIdx !== pi) buildBg(pi);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.drawImage(bgCache, -par.x * 6 * DPR - 10 * DPR, -par.y * 6 * DPR - 10 * DPR, cv.width + 20 * DPR, cv.height + 20 * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.globalCompositeOperation = 'lighter';
  for (var l = 0; l < 3; l++) {
    var d = [10, 22, 40][l], arr = starsL[l], drift = now * 0.004 * (l + 1);
    for (var i = 0; i < arr.length; i++) {
      var s = arr[i];
      var x = ((s.x * VW - par.x * d + drift * 8) % (VW * 1.2) + VW * 1.2) % (VW * 1.2) - VW * 0.1;
      var y = s.y * VH - par.y * d;
      var a = s.a * (0.65 + 0.35 * Math.sin(now * s.sp + s.tw));
      ctx.fillStyle = 'rgba(255,255,255,' + a.toFixed(3) + ')';
      if (l === 2) {
        ctx.fillRect(x - s.s / 2, y - s.s / 2, s.s, s.s);
        ctx.fillStyle = 'rgba(200,225,255,' + (a * 0.25).toFixed(3) + ')';
        ctx.fillRect(x - s.s * 2, y - 0.3, s.s * 4, 0.6); ctx.fillRect(x - 0.3, y - s.s * 2, 0.6, s.s * 4);
      } else ctx.fillRect(x, y, s.s, s.s);
    }
  }
  ctx.globalCompositeOperation = 'source-over';
}

/* ───────── sprites (planètes, lunes, astéroïdes) rendus à la résolution écran */
var spriteCache = {};
function planetSprite(src, kind, k) {
  var key = kind + ':' + src.x + ':' + src.y + ':' + src.r + ':' + (src.d || 0) + ':' + k.toFixed(3);
  if (spriteCache[key]) return spriteCache[key];
  var r = src.r * k, ring = src.ring, pad = ring ? r * 2.35 : r * 1.7, size = Math.ceil(pad * 2);
  var c = mk(size, size), g = c.getContext('2d'), cx = size / 2, cy = size / 2;
  var R = rng((src.x * 73856093) ^ (src.y * 19349663) ^ (src.r * 83492791));
  var hue = kind === 'rep' ? 345 : kind === 'moon' ? (pal.rock + 10) : (src.h != null ? src.h : pal.accH);
  var sat = kind === 'moon' ? 12 : kind === 'rep' ? 90 : 62;
  // atmosphère
  var ag = g.createRadialGradient(cx, cy, r * 0.85, cx, cy, r * (kind === 'moon' ? 1.25 : 1.6));

  drawBg(pi, now);
  if (mode === 'play' && G) drawWorld(now, dt);
  else { drawMenuScene(now); ctx.setTransform(DPR, 0, 0, DPR, 0, 0); drawParticles(); }
  requestAnimationFrame(frame);
}
function stepGame(dt, dtReal, now) {
  var g = G;
  if (g.phase === 'aim') {
    if (g.rewind > 0) { // rembobinage des corps mobiles
      g.rewind = Math.max(0, g.rewind - dtReal / 0.45);
      var e = g.rewind * g.rewind * (3 - 2 * g.rewind);
      g.dispT = g.endT * e;
    } else g.dispT = 0;
    g.probe.vis = Math.min(1, g.probe.vis + dtReal * 4);
    g.probe.x = g.L.st[0]; g.probe.y = g.L.st[1];
  } else if (g.phase === 'fly') {
    var r = g.run;
    g.acc += dt;
    var steps = 0;
    while (g.acc >= Core.DT && !r.done && steps < 12) {
      g.acc -= Core.DT; steps++;
      var px = r.x, py = r.y;
      r.step();
      if (r.ev) {
        if (r.ev.type === 'crystal') {
          var c = g.L.cr[r.ev.i];
          var fresh = !(g.mask & (1 << r.ev.i));
          g.mask |= 1 << r.ev.i;
          spawnBurst(c[0], c[1], 34, '#fde68a', 420, 0.8, 2.4);
          spawnBurst(c[0], c[1], 8, '#ffffff', 260, 0.6, 4, 'shard');
          spawnRing(c[0], c[1], '#fde68a', 56);
          if (fresh) { updateHud(); var el = $('#hCr').children[r.ev.i]; if (el) { el.classList.add('on'); setTimeout(function () { el.classList.remove('on'); }, 300); } }
        } else if (r.ev.type === 'tp') {
          g.trail.push(null);
          spawnBurst(r.ev.fx, r.ev.fy, 22, '#ffffff', 300, 0.5, 2);
          spawnBurst(r.x, r.y, 22, pal.acc, 300, 0.5, 2);
          spawnRing(r.x, r.y, '#ffffff', 50);
        }
      }
      // le joueur a déjà ramassé certains cristaux lors de tirs précédents : on les marque dans le vol
      r.mask |= g.mask;
      if (r.n % 2 === 0) { g.trail.push([r.x, r.y]); if (g.trail.length > 150) g.trail.shift(); }
    }
    g.dispT = r.t;
    var spd = Math.hypot(r.vx, r.vy);
    if (spd > 1) g.probe.ang = Math.atan2(r.vy, r.vx);
    g.probe.x = r.x; g.probe.y = r.y;
    // ralenti à l'approche du portail
    var tp = Core.moverPos(g.C.tg.b, g.C.tg.mv, r.t, [0, 0]);
    var dd = Math.hypot(tp[0] - r.x, tp[1] - r.y);
    slowTarget = dd < 150 ? 0.35 : 1;
    if (r.done) onRunEnd(r.done);
  } else if (g.phase === 'dead') {
    g.deadAt += dtReal;
    if (g.deadAt > 0.85) resetShot();
  } else if (g.phase === 'won') {
    g.wonAt += dtReal;
    var tp2 = Core.moverPos(g.C.tg.b, g.C.tg.mv, g.run.t, [0, 0]);
    g.probe.x = lerp(g.probe.x, tp2[0], 1 - Math.exp(-dtReal * 8));
    g.probe.y = lerp(g.probe.y, tp2[1], 1 - Math.exp(-dtReal * 8));
    g.probe.vis = Math.max(0, g.probe.vis - dtReal * 1.6);
    g.probe.ang += dtReal * 10;
    if (g.trail.length) g.trail.shift();
  }
}

/* ───────── écrans */
function setMode(m) {
  mode = m;
  $('#home').classList.toggle('hidden', m !== 'home');
  $('#levels').classList.toggle('hidden', m !== 'levels');
  $('#hud').classList.toggle('hidden', m !== 'play');
  $('#win').classList.add('hidden');
  if (m !== 'play') { $('#tip').classList.add('hidden'); $('#aimInfo').classList.add('hidden'); $('#banner').classList.add('hidden'); aim = null; }
  if (m === 'home') renderHome();
  if (m === 'levels') renderLevels();
  if (m !== 'play') { var p0 = PAL[clamp(LEVELS[firstOpen()].w, 0, 3)]; document.documentElement.style.setProperty('--acc', p0.acc); }
}
function renderHome() {
  var t = totalStars(), done = 0;
  for (var i = 0; i < LEVELS.length; i++) if (stars(i)) done++;
  $('#hsStars').innerHTML = starSvg(true) + t + ' / ' + LEVELS.length * 3;
  $('#hsDone').innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="3.2" fill="#fff"/><ellipse cx="12" cy="12" rx="9.5" ry="4" transform="rotate(-25 12 12)"/></svg>' + done + ' / ' + LEVELS.length + ' niveaux';
  var nx = save.last != null && unlocked(save.last) ? save.last : 0;
  if (stars(nx) && nx < LEVELS.length - 1 && unlocked(nx + 1)) nx = firstOpen();
  $('#bPlaySub').textContent = WORLDS[LEVELS[nx].w].name + ' · ' + (nx % 10 + 1);
  $('#bPlay').dataset.lv = nx;
}
var LOCK = '<svg class="lk" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"><rect x="5" y="11" width="14" height="10" rx="2.5"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>';
function renderLevels() {
  $('#lvTot').innerHTML = starSvg(true) + totalStars() + ' / ' + LEVELS.length * 3;
  var cur = firstOpen(), h = '';
  WORLDS.forEach(function (w, wi) {
    var p = PAL[wi], ws = 0;
    for (var i = wi * 10; i < wi * 10 + 10; i++) ws += stars(i);
    h += '<div class="world"><div class="wbg" style="background:radial-gradient(120% 90% at 85% 0%,hsla(' + p.accH + ',90%,55%,.35),transparent 60%),linear-gradient(160deg,' + p.bg1 + ',' + p.bg0 + ')"></div>' +
      '<div class="wh"><div><div class="wn" style="color:' + p.acc + '">Monde ' + (wi + 1) + '</div><div class="wt">' + w.name + '</div><div class="ws">' + w.sub + '</div></div>' +
      '<div class="wst">' + starSvg(true) + ws + '/30</div></div><div class="grid">';
    for (i = wi * 10; i < wi * 10 + 10; i++) {
      var u = unlocked(i), s = stars(i);
      h += '<button class="tile' + (u ? '' : ' lock') + (i === cur && u ? ' cur' : '') + '" data-i="' + i + '">' +
        (u ? '<div class="num">' + (i % 10 + 1) + '</div><div class="st">' + starSvg(s > 0) + starSvg(s > 1) + starSvg(s > 2) + '</div>' : LOCK) + '</button>';
    }
    h += '</div></div>';
  });
  h += '<p class="rule">★ portail atteint &nbsp;·&nbsp; ★★ + les 3 cristaux &nbsp;·&nbsp; ★★★ le tout en 3 tirs maximum.<br>Les cristaux restent acquis entre les tirs. Touchez l’écran en vol pour relancer.</p>';
  $('#lvScroll').innerHTML = h;
  setTimeout(function () { var c = $('#lvScroll .tile.cur'); if (c) c.scrollIntoView({ block: 'center' }); }, 30);
}
$('#lvScroll').addEventListener('click', function (e) {
  var b = e.target.closest('.tile'); if (!b) return;
  var i = +b.dataset.i;
  if (!unlocked(i)) { b.animate([{ transform: 'translateX(0)' }, { transform: 'translateX(-5px)' }, { transform: 'translateX(5px)' }, { transform: 'translateX(0)' }], { duration: 260 }); return; }
  startLevel(i);
});
$('#bPlay').addEventListener('click', function () { startLevel(+this.dataset.lv || 0); });
$('#bLevels').addEventListener('click', function () { setMode('levels'); });
$('#bLvBack').addEventListener('click', function () { setMode('home'); });
$('#bBack').addEventListener('click', function () { G = null; particles = []; setMode('levels'); });
$('#bRestart').addEventListener('click', function () { if (G) restartLevel(); });
$('#wRetry').addEventListener('click', function () { restartLevel(); });
$('#wList').addEventListener('click', function () { G = null; particles = []; setMode('levels'); });
$('#wNext').addEventListener('click', function () {
  if (G.i >= LEVELS.length - 1) { G = null; setMode('levels'); return; }
  startLevel(G.i + 1);
});
document.addEventListener('visibilitychange', function () { last = performance.now(); });

window.addEventListener('resize', resize);
resize();
setMode('home');
requestAnimationFrame(frame);
// accès pour les tests automatisés
window.__orbite = { start: startLevel, get G() { return G; }, LEVELS: LEVELS, save: save };
})();

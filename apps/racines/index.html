<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#05040f">
<title>Constellation des Racines</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./style.css">
</head>
<body>
<canvas id="sky"></canvas>

<header id="top">
  <div class="title">
    <h1>Constellation <span>des Racines</span></h1>
    <p id="progress">0 / 89 racines maîtrisées</p>
  </div>
  <div class="search">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
    <input id="q" type="search" placeholder="Chercher : ع ل م, savoir, rahma…" autocomplete="off" spellcheck="false">
  </div>
  <div id="results"></div>
</header>

<nav id="modes">
  <button data-mode="explore" class="on">Explorer</button>
  <button data-mode="verses">Versets</button>
  <button data-mode="quiz">Quiz</button>
</nav>

<div id="legend"></div>
<div id="hint">Glisse pour tourner · pince pour zoomer · touche une étoile</div>

<section id="sheet" aria-live="polite">
  <div class="grip"></div>
  <button class="close" id="close" aria-label="Fermer">×</button>
  <div id="sheetBody"></div>
</section>

<div id="toast"></div>

<script src="./data.js"></script>
<script src="./app.js"></script>
</body>
</html>

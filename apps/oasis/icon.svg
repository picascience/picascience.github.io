<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
<defs>
<!-- Oasis : eau profonde turquoise -> lumière dorée de fin de journée -->
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#08343a"/><stop offset=".55" stop-color="#11807a"/><stop offset="1" stop-color="#f1b866"/></linearGradient>
<radialGradient id="hl" cx=".3" cy=".15" r=".8"><stop offset="0" stop-color="#fff" stop-opacity=".2"/><stop offset=".6" stop-color="#fff" stop-opacity="0"/></radialGradient>
<radialGradient id="sunGlow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fde68a" stop-opacity=".9"/><stop offset=".45" stop-color="#fbbf6a" stop-opacity=".35"/><stop offset="1" stop-color="#fbbf6a" stop-opacity="0"/></radialGradient>
<filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".28"/></filter>
</defs>
<rect width="512" height="512" fill="url(#bg)"/>
<rect width="512" height="512" fill="url(#hl)"/>
<circle cx="256" cy="262" r="130" fill="url(#sunGlow)"/>
<g filter="url(#sh)">
  <!-- soleil bas encadré par l'arche -->
  <circle cx="256" cy="268" r="58" fill="#fde68a"/>
  <!-- arche outrepassée -->
  <path d="M150 372 V248 A106 106 0 0 1 362 248 V372" fill="none" stroke="#fff" stroke-width="32" stroke-linecap="round"/>
  <!-- étoile à 8 branches (clé de voûte) -->
  <path d="M256 70 l12 20 22-6-6 22 20 12-20 12 6 22-22-6-12 20-12-20-22 6 6-22-20-12 20-12-6-22 22 6z" fill="#fde68a"/>
  <!-- bassin -->
  <path d="M112 378 H400" stroke="#7ff3e6" stroke-width="28" stroke-linecap="round"/>
  <path d="M150 428 q26 -20 52 0 t52 0 t52 0 t52 0" fill="none" stroke="#fff" stroke-width="16" stroke-linecap="round" opacity=".9"/>
</g>
</svg>

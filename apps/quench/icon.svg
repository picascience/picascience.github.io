<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
<defs>
<!-- Quench : anthracite -> vermillon -->
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#141619"/><stop offset=".55" stop-color="#3a1a14"/><stop offset="1" stop-color="#D9381E"/></linearGradient>
<radialGradient id="hl" cx=".3" cy=".15" r=".8"><stop offset="0" stop-color="#fff" stop-opacity=".2"/><stop offset=".6" stop-color="#fff" stop-opacity="0"/></radialGradient>
<filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".28"/></filter>
</defs>
<rect width="512" height="512" fill="url(#bg)"/>
<rect width="512" height="512" fill="url(#hl)"/>
<g filter="url(#sh)" fill="none" stroke-linecap="round">
  <!-- anneau de l'accélérateur, ouvert (quench) -->
  <path d="M 340 118 A 160 160 0 1 0 404 200" stroke="#fff" stroke-width="30"/>
  <path d="M 380 140 l 22 -30 M 404 168 l 32 -16" stroke="#fde68a" stroke-width="18"/>
  <!-- trace droite + spirale depuis un vertex décalé -->
  <path d="M 256 256 L 172 340" stroke="#fff" stroke-width="20" opacity=".9"/>
  <path d="M 256 256 L 300 228" stroke="#fff" stroke-width="10" stroke-dasharray="2 18"/>
  <path d="M 312 220 C 360 196 372 262 336 274 C 304 284 296 244 322 238 C 338 234 342 252 330 256" stroke="#fff" stroke-width="20"/>
  <circle cx="256" cy="256" r="17" fill="#fff" stroke="none"/>
  <circle cx="310" cy="222" r="20" fill="#fde68a" stroke="none"/>
</g>
</svg>

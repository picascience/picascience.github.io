<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Machine — CAD 3D</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<!-- CAD:HEAD · gabarit CAD 3D v2 — bloc commun à toutes les planches, ne pas modifier -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style id="cad-gabarit">
  :root {
    --paper:#F9F8F5; --ink:#18181A; --muted:#8E8D8A; --soft:#4A4A48; --line:#DEDCD3; --track:#E2E0D8;
    --gap:16px;
    --safe-t:max(14px, env(safe-area-inset-top));
    --safe-b:max(60px, calc(env(safe-area-inset-bottom) + 28px)); /* barre de retour MK Apps */
    --stage-t:0px; --stage-r:0px; --stage-b:0px; --stage-l:0px;
    --serif:'Instrument Serif', Georgia, 'Times New Roman', serif;
    --mono:'JetBrains Mono', ui-monospace, Menlo, monospace;
    --cad-mode:col;
  }
  *, *::before, *::after { box-sizing:border-box; }
  html, body { margin:0; padding:0; height:100%; overflow:hidden; overscroll-behavior:none; background:var(--paper); color:var(--ink);
    font-family:var(--mono); -webkit-font-smoothing:antialiased; -webkit-text-size-adjust:100%; -webkit-tap-highlight-color:transparent; }
  #canvas-container { position:fixed; top:var(--stage-t); right:var(--stage-r); bottom:var(--stage-b); left:var(--stage-l);
    touch-action:none; cursor:grab; overflow:hidden; }
  #canvas-container:active { cursor:grabbing; }
  #canvas-container canvas { display:block; }

  /* ── En-tête : n° · titre · sous-titre · tracé ── */
  .cad-hud { position:fixed; z-index:10; top:var(--safe-t); left:var(--gap); right:var(--gap); pointer-events:none; user-select:none; -webkit-user-select:none; }
  .cad-tag { display:flex; align-items:center; gap:8px; min-width:0; font-size:10.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); white-space:nowrap; }
  .cad-tag b { color:var(--ink); font-weight:600; flex:none; }
  .cad-tag .cad-prompt { text-transform:none; letter-spacing:0; overflow:hidden; text-overflow:ellipsis; }
  .cad-title { font-family:var(--serif); font-weight:400; font-size:30px; line-height:1.02; letter-spacing:-.01em; margin:6px 0 0; overflow-wrap:anywhere; }
  .cad-sub { font-family:var(--serif); font-style:italic; font-size:17px; line-height:1.15; color:var(--soft); margin:2px 0 0; }
  .cad-status { display:grid; grid-template-columns:minmax(0,1fr) auto; align-items:baseline; column-gap:12px;
    margin-top:10px; padding-top:8px; border-top:1px solid var(--line); font-size:11px; color:var(--muted); }
  .cad-group { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .cad-group strong { color:var(--ink); font-weight:600; }
  .cad-count { font-family:var(--serif); font-size:28px; line-height:1; color:var(--ink); white-space:nowrap; text-align:right; font-variant-numeric:tabular-nums; }
  .cad-count small { font-family:var(--mono); font-size:11px; color:var(--muted); margin-left:4px; }
  .cad-bar { grid-column:1 / -1; height:3px; margin:7px 0 5px; background:var(--track); border-radius:2px; overflow:hidden; }
  .cad-bar i { display:block; height:100%; width:0; background:var(--ink); }
  .cad-lines, .cad-pct { font-variant-numeric:tabular-nums; }
  .cad-pct { text-align:right; }
  .cad-specs { display:none; margin:16px 0 0; padding-top:10px; border-top:1px solid var(--line); font-size:10.5px; line-height:1.55; }
  .cad-specs div { display:flex; justify-content:space-between; gap:12px; padding:3px 0; border-bottom:1px dashed var(--line); }
  .cad-specs dt { color:var(--muted); text-transform:uppercase; letter-spacing:.08em; }
  .cad-specs dd { margin:0; text-align:right; color:var(--ink); }

  /* ── Dock de commandes : toujours la même forme ── */
  .cad-dock { position:fixed; z-index:10; left:var(--gap); right:var(--gap); bottom:var(--safe-b); margin:0 auto; max-width:520px;
    padding:10px 14px 4px; background:rgba(249,248,245,.95); border:1px solid var(--line); border-radius:16px;
    box-shadow:0 10px 30px -16px rgba(24,24,26,.35); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
    user-select:none; -webkit-user-select:none; }
  .cad-actions { display:flex; gap:6px; margin-bottom:4px; overflow-x:auto; scrollbar-width:none; }
  .cad-actions::-webkit-scrollbar { display:none; }
  .cad-btn { flex:none; height:34px; padding:0 12px; display:inline-flex; align-items:center; gap:6px; border:1px solid rgba(24,24,26,.22);
    border-radius:9px; background:transparent; color:var(--ink); font:600 11px/1 var(--mono); letter-spacing:.06em; text-transform:uppercase; cursor:pointer; }
  .cad-btn:active { transform:scale(.97); }
  .cad-btn.cad-primary { background:var(--ink); border-color:var(--ink); color:var(--paper); }
  .cad-btn.on { border-color:var(--ink); background:rgba(24,24,26,.07); }
  .cad-sep { flex:none; width:1px; margin:7px 2px; background:var(--line); }
  .cad-row { display:grid; grid-template-columns:66px minmax(0,1fr) 50px; align-items:center; column-gap:10px; height:38px; }
  .cad-row label { font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--soft); }
  .cad-row output { font-size:12px; text-align:right; font-variant-numeric:tabular-nums; color:var(--ink); }
  .cad-range { -webkit-appearance:none; appearance:none; display:block; width:100%; height:34px; margin:0; background:transparent; cursor:pointer; --p:0%; touch-action:pan-y; }
  .cad-range:focus { outline:none; }
  .cad-range::-webkit-slider-runnable-track { height:3px; border-radius:2px; background:linear-gradient(var(--ink),var(--ink)) 0 0 / var(--p) 100% no-repeat, var(--track); }
  .cad-range::-webkit-slider-thumb { -webkit-appearance:none; width:22px; height:22px; margin-top:-9.5px; border-radius:50%; background:var(--paper); border:2px solid var(--ink); box-shadow:0 1px 4px rgba(24,24,26,.2); }
  .cad-range:active::-webkit-slider-thumb { background:var(--ink); }
  .cad-range::-moz-range-track { height:3px; border-radius:2px; background:var(--track); }
  .cad-range::-moz-range-progress { height:3px; border-radius:2px; background:var(--ink); }
  .cad-range::-moz-range-thumb { width:18px; height:18px; border-radius:50%; background:var(--paper); border:2px solid var(--ink); }

  /* Grand écran : en-tête en colonne à droite, dock en bas à gauche */
  @media (min-width:1000px) and (min-height:600px) {
    :root { --cad-mode:wide; --safe-b:max(28px, calc(env(safe-area-inset-bottom) + 28px)); }
    .cad-hud { left:auto; right:max(36px, 5vw); top:50%; transform:translateY(-50%); width:300px; }
    .cad-title { font-size:46px; }
    .cad-sub { font-size:22px; }
    .cad-status { grid-template-columns:1fr auto; margin-top:22px; padding-top:12px; }
    .cad-count { grid-column:1 / -1; text-align:left; font-size:68px; line-height:.9; margin-top:6px; }
    .cad-specs { display:block; }
    .cad-dock { left:max(28px, 4vw); right:auto; width:460px; margin:0; }
  }
  /* Téléphone à l'horizontale : en-tête à gauche, dock à droite */
  @media (max-height:520px) and (orientation:landscape) {
    :root { --cad-mode:land; --safe-b:max(14px, env(safe-area-inset-bottom)); }
    .cad-hud { right:auto; width:min(270px, 34vw); left:max(var(--gap), env(safe-area-inset-left)); }
    .cad-title { font-size:24px; }
    .cad-dock { left:auto; right:max(var(--gap), env(safe-area-inset-right)); width:min(330px, 40vw); margin:0; padding-top:6px; }
    .cad-row { height:32px; }
  }
</style>
<!-- /CAD:HEAD -->
</head>
<body>
<!-- CAD:UI -->
<div id="canvas-container" aria-label="Vue CAO 3D interactive"></div>
<header class="cad-hud" aria-live="polite">
  <div class="cad-tag"><b id="ui-no">No. 00</b><span>·</span><span class="cad-prompt" id="ui-prompt">/anatomy</span></div>
  <h1 class="cad-title" id="ui-title">Machine</h1>
  <p class="cad-sub" id="ui-sub">sous-titre</p>
  <div class="cad-status">
    <div class="cad-group">Tracé · <strong id="ui-group">Initialisation…</strong></div>
    <div class="cad-count"><span id="ui-parts">0</span><small>/ <span id="ui-total-parts">0</span> pièces</small></div>
    <div class="cad-bar"><i id="ui-bar"></i></div>
    <div class="cad-lines"><span id="ui-lines">0</span> / <span id="ui-total-lines">0</span> traits</div>
    <div class="cad-pct" id="ui-pct">0%</div>
  </div>
  <dl class="cad-specs" id="ui-specs"></dl>
</header>
<nav class="cad-dock" aria-label="Commandes de la planche">
  <div class="cad-actions" id="ui-actions">
    <button type="button" class="cad-btn cad-primary" id="btn-replay">↻ Rejouer</button>
  </div>
  <div class="cad-row"><label for="slider-draw">Tracé</label><input class="cad-range" type="range" id="slider-draw" min="0" max="1" step="0.001" value="0"><output id="val-draw">0%</output></div>
  <div class="cad-row"><label for="slider-explode">Éclaté</label><input class="cad-range" type="range" id="slider-explode" min="0" max="1" step="0.005" value="0"><output id="val-explode">0%</output></div>
  <div class="cad-row"><label for="slider-speed">Vitesse</label><input class="cad-range" type="range" id="slider-speed" min="0" max="2.5" step="0.05" value="1" data-unit="x"><output id="val-speed">1.0×</output></div>
</nav>
<script>
/* CADUI — gabarit CAD 3D v2. API :
   CADUI.mount({ number, title, subtitle, prompt, specs:[[clé, valeur]…], views:[{id,label}…] })
   CADUI.on('replay'|'draw'|'explode'|'speed'|'view', fn)      → valeurs 0..1 (vitesse 0..2.5)
   CADUI.set('draw'|'explode'|'speed', v)                      → déplace le curseur (sans déclencher on)
   CADUI.progress({ group, parts, totalParts, lines, totalLines, p })
   CADUI.attach({ camera, renderer, controls, object, margin }) → cadre la machine dans la zone libre et gère le redimensionnement */
const CADUI = (() => {
  const $ = id => document.getElementById(id);
  const root = document.documentElement;
  const fr = n => Math.round(+n || 0).toLocaleString('fr-FR');
  const handlers = {}, cache = {};
  let rig = null, fitW = 0, fitH = 0;
  const emit = (e, v) => (handlers[e] || []).forEach(fn => fn(v));
  const text = (id, t) => { t = String(t); if (cache[id] !== t) { cache[id] = t; const el = $(id); if (el) el.textContent = t; } };
  const paint = r => {
    const p = (r.value - r.min) / (r.max - r.min) * 100;
    r.style.setProperty('--p', p + '%');
    text(r.id.replace('slider-', 'val-'), r.dataset.unit === 'x' ? (+r.value).toFixed(1) + '×' : Math.round(p) + '%');
  };
  const ranges = () => document.querySelectorAll('.cad-range');

  function resize() {
    if (!rig) return;
    const el = $('canvas-container'), w = el.clientWidth, h = el.clientHeight;
    if (!w || !h) return;
    rig.renderer.setSize(w, h);
    const c = rig.camera;
    if (c.isOrthographicCamera && fitW && fitH) {
      const a = w / h, fh = Math.max(fitH, fitW / a);
      c.left = -fh * a / 2; c.right = fh * a / 2; c.top = fh / 2; c.bottom = -fh / 2;
    } else if (c.isPerspectiveCamera) c.aspect = w / h;
    c.updateProjectionMatrix();
  }
  function layout() {
    const mode = getComputedStyle(root).getPropertyValue('--cad-mode').trim() || 'col';
    const W = innerWidth, H = innerHeight;
    const hud = document.querySelector('.cad-hud').getBoundingClientRect();
    const dock = document.querySelector('.cad-dock').getBoundingClientRect();
    let t = 0, r = 0, b = 0, l = 0;
    if (mode === 'wide') { r = W - hud.left + 24; b = H - dock.top + 8; }
    else if (mode === 'land') { l = hud.right + 8; r = W - dock.left + 8; }
    else { t = hud.bottom + 6; b = H - dock.top + 6; }
    [['t', t], ['r', r], ['b', b], ['l', l]].forEach(([k, v]) => root.style.setProperty('--stage-' + k, Math.max(0, Math.round(v)) + 'px'));
    resize();
    window.dispatchEvent(new Event('cad:stage'));
  }
  let raf = 0;
  const relayout = () => { cancelAnimationFrame(raf); raf = requestAnimationFrame(layout); };

  // Curseurs : remplissage + valeur toujours à jour, même quand le moteur les bouge lui-même
  ranges().forEach(r => r.addEventListener('input', () => { paint(r); emit(r.id.replace('slider-', ''), +r.value); }));
  (function sync() { ranges().forEach(paint); requestAnimationFrame(sync); })();
  $('btn-replay').addEventListener('click', () => emit('replay'));
  addEventListener('resize', relayout);
  addEventListener('orientationchange', relayout);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(relayout);
  if (window.ResizeObserver) new ResizeObserver(relayout).observe(document.querySelector('.cad-hud'));
  relayout();

  return {
    on(e, fn) { (handlers[e] = handlers[e] || []).push(fn); return this; },
    set(name, v) { const r = $('slider-' + name); if (r) { r.value = v; paint(r); } return this; },
    get(name) { const r = $('slider-' + name); return r ? +r.value : 0; },
    mount(cfg = {}) {
      if (cfg.number) text('ui-no', cfg.number);
      if (cfg.title) { text('ui-title', cfg.title); document.title = cfg.title + ' — CAD 3D'; }
      if (cfg.subtitle) text('ui-sub', cfg.subtitle);
      if (cfg.prompt) text('ui-prompt', cfg.prompt);
      if (cfg.specs) $('ui-specs').innerHTML = cfg.specs.map(([k, v]) => `<div><dt>${k}</dt><dd>${v}</dd></div>`).join('');
      if (cfg.views && cfg.views.length) {
        const bar = $('ui-actions');
        bar.insertAdjacentHTML('beforeend', '<span class="cad-sep"></span>' +
          cfg.views.map((v, i) => `<button type="button" class="cad-btn${i ? '' : ' on'}" data-view="${v.id}">${v.label}</button>`).join(''));
        bar.querySelectorAll('[data-view]').forEach(b => b.addEventListener('click', () => {
          bar.querySelectorAll('[data-view]').forEach(x => x.classList.toggle('on', x === b));
          emit('view', b.dataset.view);
        }));
      }
      relayout();
      return this;
    },
    progress(s) {
      if (s.group != null) text('ui-group', s.group);
      if (s.parts != null) text('ui-parts', fr(s.parts));
      if (s.totalParts != null) text('ui-total-parts', fr(s.totalParts));
      if (s.lines != null) text('ui-lines', fr(s.lines));
      if (s.totalLines != null) text('ui-total-lines', fr(s.totalLines));
      if (s.p != null) {
        const pct = Math.round(Math.max(0, Math.min(1, s.p)) * 100);
        text('ui-pct', pct + '%');
        const bar = $('ui-bar'); if (bar) bar.style.width = (s.p * 100).toFixed(2) + '%';
      }
      return this;
    },
    attach(o) {
      rig = o;
      if (o.object && o.camera.isOrthographicCamera) {
        o.camera.updateMatrixWorld();
        const box = new THREE.Box3().setFromObject(o.object);
        if (o.controls && o.center !== false) {
          const c = box.getCenter(new THREE.Vector3()), off = c.clone().sub(o.controls.target);
          o.controls.target.copy(c); o.camera.position.add(off); o.camera.lookAt(c); o.camera.updateMatrixWorld();
        }
        const inv = o.camera.matrixWorldInverse;
        const tc = (o.controls ? o.controls.target.clone() : box.getCenter(new THREE.Vector3())).applyMatrix4(inv);
        let hx = 0, hy = 0;
        for (let i = 0; i < 8; i++) {
          const v = new THREE.Vector3(i & 1 ? box.max.x : box.min.x, i & 2 ? box.max.y : box.min.y, i & 4 ? box.max.z : box.min.z).applyMatrix4(inv);
          hx = Math.max(hx, Math.abs(v.x - tc.x)); hy = Math.max(hy, Math.abs(v.y - tc.y));
        }
        const m = o.margin || 1.12;
        fitW = 2 * hx * m; fitH = 2 * hy * m;
        o.camera.zoom = 1;
      }
      layout();
      return this;
    }
  };
})();
</script>
<!-- /CAD:UI -->
<script>
/* ═══ Moteur de base (à garder tel quel) ═══ */
class AnatomyEngine {
  constructor(config = {}) {
    this.parts = []; this.totalSegments = 0;
    this.drawProgress = 0; this.isDrawing = true;
    this.explodeFactor = 0; this.targetExplode = 0; this.autoExplode = config.autoExplode ?? 0.6; this.userExplode = false;
    this.speed = 1; this.clock = new THREE.Clock(); this.elapsed = 0;
    this.config = config;
    CADUI.mount({ views: AnatomyEngine.VIEWS, ...config });
    this.initScene();
    CADUI.on('replay', () => { this.drawProgress = 0; this.isDrawing = true; })
         .on('draw', v => { this.isDrawing = false; this.drawProgress = v; })
         .on('explode', v => { this.userExplode = true; this.targetExplode = v; })
         .on('speed', v => { this.speed = v; })
         .on('view', id => this.setView(id));
  }
  initScene() {
    this.scene = new THREE.Scene();
    this.scene.background = new THREE.Color(0xF9F8F5);
    this.camera = new THREE.OrthographicCamera(-10, 10, 10, -10, -200, 400);
    this.camera.position.set(16, 13, 18);
    this.renderer = new THREE.WebGLRenderer({ antialias: true });
    this.renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    document.getElementById('canvas-container').appendChild(this.renderer.domElement);
    this.controls = new THREE.OrbitControls(this.camera, this.renderer.domElement);
    this.controls.enableDamping = true; this.controls.minZoom = 0.4; this.controls.maxZoom = 5;
    this.occluderMat = new THREE.MeshBasicMaterial({ color: 0xF9F8F5, polygonOffset: true, polygonOffsetFactor: 1.5, polygonOffsetUnits: 2.0, side: THREE.DoubleSide });
    this.root = new THREE.Group(); this.scene.add(this.root);
  }
  addPart(geometry, opts = {}) {
    const group = new THREE.Group();
    const basePos = new THREE.Vector3(...(opts.position || [0, 0, 0]));
    const explodeVec = new THREE.Vector3(...(opts.explodeVec || [0, 0, 0]));
    group.position.copy(basePos);
    if (opts.rotation) group.rotation.set(...opts.rotation);
    const mesh = new THREE.Mesh(geometry, this.occluderMat);
    group.add(mesh);
    const edgesGeo = new THREE.EdgesGeometry(geometry, opts.edgeThreshold || 18);
    const lines = new THREE.LineSegments(edgesGeo, new THREE.LineBasicMaterial({ color: opts.color || 0x18181A, transparent: true, opacity: opts.opacity || 0.88 }));
    const vertexCount = edgesGeo.attributes.position.count;
    edgesGeo.setDrawRange(0, 0);
    group.add(lines);
    (opts.parent || this.root).add(group);
    this.parts.push({ group, mesh, edgesGeo, vertexCount, name: opts.name || 'Composant', basePos, explodeVec, onUpdate: opts.onUpdate || null });
    this.totalSegments += vertexCount / 2;
    return group;
  }
  static VIEWS = [{ id: 'iso', label: 'Iso' }, { id: 'face', label: 'Face' }, { id: 'dessus', label: 'Dessus' }];
  setView(id) {
    const d = this.camera.position.distanceTo(this.controls.target), t = this.controls.target;
    const dir = { iso: [16, 13, 18], face: [0, 0.01, 1], dessus: [0, 1, 0.001], cote: [1, 0.01, 0] }[id] || [16, 13, 18];
    this.camera.position.copy(t).add(new THREE.Vector3(...dir).normalize().multiplyScalar(d));
    this.camera.zoom = 1; this.camera.updateProjectionMatrix();
  }
  start() {
    CADUI.progress({ totalParts: this.parts.length, totalLines: this.totalSegments });
    // Cadrage calculé sur la vue éclatée automatique, pour que rien ne sorte de la zone libre
    this.parts.forEach(p => p.group.position.copy(p.basePos).addScaledVector(p.explodeVec, this.autoExplode || 0));
    CADUI.attach({ camera: this.camera, renderer: this.renderer, controls: this.controls, object: this.root, margin: this.config.margin || 1.08 });
    this.parts.forEach(p => p.group.position.copy(p.basePos));
    const loop = () => {
      requestAnimationFrame(loop);
      const dt = Math.min(this.clock.getDelta(), 0.05);
      this.elapsed += dt * this.speed;
      if (this.isDrawing) {
        this.drawProgress += dt * 0.28;
        if (this.drawProgress >= 1) {
          this.drawProgress = 1; this.isDrawing = false;
          if (!this.userExplode && this.autoExplode) this.targetExplode = this.autoExplode;
        }
        CADUI.set('draw', this.drawProgress);
      }
      this.explodeFactor += (this.targetExplode - this.explodeFactor) * Math.min(1, dt * 3);
      if (!this.userExplode) CADUI.set('explode', this.explodeFactor);
      const n = this.parts.length, exact = this.drawProgress * n, idx = Math.floor(exact);
      let drawn = 0, group = 'Assemblage complet';
      this.parts.forEach((p, i) => {
        if (i < idx) { p.mesh.visible = true; p.edgesGeo.setDrawRange(0, p.vertexCount); drawn += p.vertexCount / 2; }
        else if (i === idx) { const k = exact - idx, c = Math.floor(p.vertexCount * k / 2) * 2; p.mesh.visible = k > 0.2; p.edgesGeo.setDrawRange(0, c); drawn += c / 2; group = p.name; }
        else { p.mesh.visible = false; p.edgesGeo.setDrawRange(0, 0); }
        p.group.position.copy(p.basePos).addScaledVector(p.explodeVec, this.explodeFactor);
        if (p.onUpdate) p.onUpdate(p.group, this.elapsed, dt * this.speed);
      });
      CADUI.progress({ group, parts: Math.min(n, Math.ceil(exact)), lines: drawn, p: this.drawProgress });
      this.controls.update();
      this.renderer.render(this.scene, this.camera);
    };
    loop();
  }
}

/* ═══ Machine : ferme-porte à bras à glissière ═══ */
const engine = new AnatomyEngine({
  number: 'No. 07', title: 'Ferme-porte', subtitle: 'bras à glissière · came & hydraulique',
  prompt: '/anatomy ferme-porte à glissière',
  specs: [['Transmission', 'came + galet'], ['Rappel', 'ressort de compression'], ['Freinage', 'huile · 3 vannes'], ['Bras', 'à glissière (rail au linteau)'], ['Ouverture', '0 → 90°']],
  autoExplode: 0.6, margin: 1.06
});

/* ── Cinématique (plan horizontal x/z, y vers le haut). Charnière en (0,0), vantail le long de +x. ── */
const XS = 9.5, ZS = 1.9, A = 8.2, ZR = 3.6;          // axe de sortie, longueur du bras, ligne du rail
const RHO0 = Math.asin((ZR - ZS) / A), BX0 = XS + A * Math.cos(RHO0);
const THMAX = Math.PI / 2, LATCH = 0.26;
const CAM_R0 = 0.4, CAM_E = 0.6, ROLL_R = 0.28, YB = -1.2, ZB = 1.9;
const ease = k => k * k * (3 - 2 * k);
function doorAngle(t) {                                // cycle de 10 s
  const u = ((t % 10) + 10) % 10;
  if (u < 0.8) return 0;                               // porte fermée
  if (u < 3.0) return THMAX * ease((u - 0.8) / 2.2);   // ouverture à la main
  if (u < 3.8) return THMAX;                           // porte tenue ouverte
  if (u < 8.6) { const k = (u - 3.8) / 4.8; return THMAX - (THMAX - LATCH) * (0.7 * k + 0.3 * ease(k)); } // fermeture freinée
  if (u < 9.2) return LATCH * (1 - (u - 8.6) / 0.6);   // frappe finale
  return 0;
}
let _kt = NaN, _k = null;
function K(t) {
  if (t === _kt) return _k;
  const th = doorAngle(t), c = Math.cos(th), s = Math.sin(th);
  const Sx = XS * c - ZS * s, Sz = XS * s + ZS * c;
  const al = Math.asin(Math.max(-1, Math.min(1, (ZR - Sz) / A)));
  const rho = al - th, psi = rho - RHO0;
  _kt = t; _k = { th, rho, psi, Bx: Sx + A * Math.cos(al), d: CAM_E * (1 - Math.cos(psi)) / 2 };
  return _k;
}

/* ── Outils de géométrie ── */
const bx = (w, h, d, x = 0, y = 0, z = 0) => new THREE.BoxGeometry(w, h, d).translate(x, y, z);
const cy = (r, h, x = 0, y = 0, z = 0, ax = 'y', seg = 16) => {
  const g = new THREE.CylinderGeometry(r, r, h, seg);
  if (ax === 'x') g.rotateZ(Math.PI / 2); else if (ax === 'z') g.rotateX(Math.PI / 2);
  return g.translate(x, y, z);
};
function merge(list) {
  const arrs = list.map(g => (g.index ? g.toNonIndexed() : g).attributes.position.array);
  const out = new Float32Array(arrs.reduce((s, a) => s + a.length, 0)); let o = 0;
  arrs.forEach(a => { out.set(a, o); o += a.length; });
  const m = new THREE.BufferGeometry(); m.setAttribute('position', new THREE.BufferAttribute(out, 3)); return m;
}
// demi-tube ouvert vers l'avant/le haut (coupe), axe le long de x
const arc = (r, len, x, y, z) => new THREE.CylinderGeometry(r, r, len, 24, 1, true, 0.314, 4.084).rotateZ(-Math.PI / 2).translate(x, y, z);
class Helix extends THREE.Curve {
  constructor(L, r, n) { super(); this.L = L; this.r = r; this.n = n; }
  getPoint(t, o = new THREE.Vector3()) { const a = t * this.n * Math.PI * 2; return o.set(t * this.L, this.r * Math.sin(a), this.r * Math.cos(a)); }
}

const doorGrp = new THREE.Group(); engine.root.add(doorGrp);          // tourne autour de la charnière
const armGrp = new THREE.Group(); armGrp.position.set(XS, 0, ZS); doorGrp.add(armGrp); // tourne autour de l'axe de sortie
const D = { parent: doorGrp }, R = { parent: armGrp };
const add = (g, o) => engine.addPart(g, o);
const slide = (g, t) => { g.position.x -= K(t).d; };                   // tout ce qui suit le piston

/* ═════ 1. Mécanisme interne : ressort, piston, hydraulique, came ═════ */
const L0 = 2.77;
add(bx(0.3, 1.1, 1.1, 1.85, YB, ZB), { ...D, name: 'Bouchon de fond', explodeVec: [-1.5, 0, 0] });
add(new THREE.TubeGeometry(new Helix(L0, 0.5, 9), 72, 0.06, 5, false),
  { ...D, name: 'Ressort de rappel', position: [1.95, YB, ZB], edgeThreshold: 5, explodeVec: [0, 0, 0],
    onUpdate: (g, t) => { g.scale.x = (L0 - K(t).d) / L0; } });
add(cy(0.6, 3.6, 6.52, YB, ZB, 'x', 20), { ...D, name: 'Piston', explodeVec: [0, 0, 0], onUpdate: slide });
[4.95, 5.3, 8.05].forEach((x, i) =>
  add(cy(0.68, 0.1, x, YB, ZB, 'x', 20), { ...D, name: 'Segment d’étanchéité ' + (i + 1), explodeVec: [0, 0.5 * i, 0], onUpdate: slide }));
add(merge([bx(0.68, 0.1, 0.7, 8.66, YB + 0.38, ZB), bx(0.68, 0.1, 0.7, 8.66, YB - 0.38, ZB), cy(0.08, 1.0, 8.82, YB, ZB, 'y', 10)]),
  { ...D, name: 'Fourche porte-galet', explodeVec: [0, 0, 0], onUpdate: slide });
add(cy(ROLL_R, 0.6, 8.82, YB, ZB, 'y', 20), { ...D, name: 'Galet de came', explodeVec: [0, 0, 0], onUpdate: slide });
add(new THREE.SphereGeometry(0.17, 10, 8).translate(8.12, YB, ZB), { ...D, name: 'Clapet anti-retour', explodeVec: [0, 1.4, 0], onUpdate: slide });
add(arc(0.72, 7.0, 5.3, YB, ZB), { ...D, name: 'Alésage du cylindre (coupe)', explodeVec: [0, 0, 0] });
add(arc(0.16, 6.6, 5.7, YB, 1.02), { ...D, name: 'Canal de dérivation d’huile', explodeVec: [0, -0.6, 0] });
for (let i = 0; i < 8; i++) {
  const x0 = 2.6 + i * 0.6;
  add(new THREE.OctahedronGeometry(0.08).translate(x0, YB, 1.02),
    { ...D, name: 'Huile hydraulique', explodeVec: [0, -0.6, 0], onUpdate: (g, t) => { g.position.x += 3 * K(t).d; } });
}
['vitesse de fermeture', 'frappe finale', 'freinage d’ouverture'].forEach((n, i) => {
  const x = 3.4 + i * 1.2;
  add(merge([cy(0.22, 0.22, x, -0.15, 1.02, 'y', 12), bx(0.3, 0.06, 0.06, x, -0.02, 1.02), cy(0.09, 0.85, x, -0.7, 1.02, 'y', 10),
    new THREE.ConeGeometry(0.09, 0.25, 10).rotateX(Math.PI).translate(x, -1.22, 1.02)]),
    { ...D, name: 'Vanne de réglage · ' + n, explodeVec: [0, 1.5 + 0.3 * i, 0] });
});
add(cy(0.3, 2.7, 0, -0.9, 0, 'y', 20),
  { ...D, name: 'Axe de sortie (pignon)', position: [XS, 0, ZS], explodeVec: [0, -1.5, 0], onUpdate: (g, t) => { g.rotation.y = -K(t).rho; } });
const camShape = new THREE.Shape();
for (let i = 0; i <= 64; i++) {
  const g = i / 64 * Math.PI * 2, r = CAM_R0 + CAM_E * (1 - Math.cos(g - Math.PI)) / 2;
  const x = r * Math.cos(g), y = r * Math.sin(g); i ? camShape.lineTo(x, y) : camShape.moveTo(x, y);
}
add(new THREE.ExtrudeGeometry(camShape, { depth: 0.8, bevelEnabled: false }).rotateX(Math.PI / 2).translate(0, -0.8, 0),
  { ...D, name: 'Came excentrée', position: [XS, 0, ZS], explodeVec: [0, -1.5, 0], onUpdate: (g, t) => { g.rotation.y = -K(t).psi; } });
add(merge([cy(0.5, 0.25, XS, -0.42, ZS, 'y', 20), cy(0.4, 0.1, XS, -0.55, ZS, 'y', 20)]), { ...D, name: 'Palier supérieur', explodeVec: [0, 1.0, 0] });
add(merge([cy(0.5, 0.25, XS, -2.0, ZS, 'y', 20), cy(0.4, 0.1, XS, -1.85, ZS, 'y', 20)]), { ...D, name: 'Palier inférieur', explodeVec: [0, -0.8, 0] });

/* ═════ 2. Boîtier ═════ */
add(bx(9.5, 2.4, 0.25, 6.25, -1.2, 0.725), { ...D, name: 'Fond du boîtier', explodeVec: [0, 0, -1.2] });
add(bx(9.5, 0.25, 2.6, 6.25, -2.275, 1.9), { ...D, name: 'Semelle du boîtier', explodeVec: [0, -2.2, 0] });
add(bx(9.5, 2.4, 0.25, 6.25, -1.2, 3.075), { ...D, name: 'Capot avant', explodeVec: [0, 0, 4.5] });
add(bx(9.5, 0.25, 2.6, 6.25, -0.125, 1.9), { ...D, name: 'Capot supérieur', explodeVec: [0, 2.2, 0] });
add(bx(0.25, 2.4, 2.6, 1.625, -1.2, 1.9), { ...D, name: 'Flasque côté gonds', explodeVec: [-4, 0, 0] });
add(bx(0.25, 2.4, 2.6, 10.875, -1.2, 1.9), { ...D, name: 'Flasque côté axe', explodeVec: [4, 0, 0] });
[-0.6, -1.2, -1.8].forEach(y => [1.0, 1.6, 2.2, 2.8].forEach(z =>
  add(cy(0.07, 0.05, 11.025, y, z, 'x', 10), { ...D, name: 'Perforation du flasque', explodeVec: [4, 0, 0] })));
[[2.8, -0.6], [2.8, -1.8], [8.2, -0.6], [8.2, -1.8]].forEach(([x, y]) =>
  add(merge([cy(0.16, 0.7, x, y, 0.55, 'z', 10), cy(0.28, 0.12, x, y, 0.91, 'z', 12)]), { ...D, name: 'Vis de fixation', explodeVec: [0, 0, -1.6] }));

/* ═════ 3. Bras à glissière ═════ */
add(merge([bx(A, 0.32, 0.5, A / 2, 0.26, 0), cy(0.55, 0.45, 0, 0.275, 0, 'y', 20), cy(0.32, 0.32, A, 0.26, 0, 'y', 16)]),
  { ...R, name: 'Bras à glissière', explodeVec: [0, 2.2, 0], onUpdate: (g, t) => { armGrp.rotation.y = -K(t).rho; } });
add(cy(0.2, 0.04, 0, 0.52, 0, 'y', 12), { ...R, name: 'Écrou de blocage', explodeVec: [0, 3.0, 0] });
add(merge([cy(0.14, 0.85, 0, 0.525, 0, 'y', 12), cy(0.2, 0.1, 0, 0.1, 0, 'y', 12)]), { ...R, name: 'Axe de glissière', position: [A, 0, 0], explodeVec: [0, 2.5, 0] });

/* ═════ 4. Rail de glissière (encastré dans le linteau) ═════ */
const RX0 = 2.9, RX1 = 18.6, RL = RX1 - RX0, RC = (RX0 + RX1) / 2;
[3.25, 3.95].forEach((z, i) => add(bx(RL, 0.15, 0.3, RC, 0.625, z), { name: 'Lèvre du rail', explodeVec: [0, 0.6, i ? 1.0 : -1.0] }));
[3.0, 4.2].forEach((z, i) => add(bx(RL, 0.75, 0.2, RC, 0.925, z), { name: 'Paroi du rail', explodeVec: [0, 1.8, i ? 1.4 : -1.4] }));
add(bx(RL, 0.3, 1.4, RC, 1.45, ZR), { name: 'Âme du rail', explodeVec: [0, 3.4, 0] });
[-0.6, -0.45, -0.3, 0.3, 0.45, 0.6].forEach(dz => add(bx(RL - 1, 0.06, 0.07, RC, 1.63, ZR + dz), { name: 'Nervure du rail', explodeVec: [0, 3.4, 0] }));
[4, 7.2, 10.4, 13.6, 16.8].forEach(x => add(merge([cy(0.18, 0.08, x, 1.64, ZR, 'y', 12), cy(0.07, 0.14, x, 1.5, ZR, 'y', 8)]), { name: 'Vis de fixation du rail', explodeVec: [0, 3.4, 0] }));
[RX0 + 0.25, RX1 - 0.25].forEach((x, i) => add(bx(0.5, 0.6, 1.0, x, 1.0, ZR), { name: 'Butée du rail', explodeVec: [i ? 3.0 : -3.0, 1.6, 0] }));
add(bx(1.4, 0.5, 0.9, BX0, 1.0, ZR), { name: 'Coulisseau', explodeVec: [0, 2.8, 0], onUpdate: (g, t) => { g.position.x += K(t).Bx - BX0; } });

/* ═════ 5. Dormant et vantail ═════ */
add(bx(21.2, 1.15, 4.3, 9, 1.125, 0.75), { name: 'Linteau du dormant', explodeVec: [0, 0, -3.2] });
add(bx(21.2, 1.4, 6.3, 9, 2.4, 1.75), { name: 'Capot du linteau', explodeVec: [0, 5.0, 0] });
add(bx(1.6, 6.55, 2.3, -1.6, -2.725, -0.25), { name: 'Montant côté gonds', explodeVec: [-3, 0, 0] });
add(cy(0.12, 5.4, 0, -3.1, 0, 'y', 10), { name: 'Axe de charnière', explodeVec: [0, -3, 0] });
add(bx(19, 6, 1.2, 9.5, -3, 0), { ...D, name: 'Vantail (coupe)', explodeVec: [0, 0, -3.5], onUpdate: (g, t) => { doorGrp.rotation.y = -K(t).th; } });
[-1.2, -4.8].forEach(y => add(merge([cy(0.4, 1.4, 0, y, 0, 'y', 14), bx(1.3, 1.4, 0.12, 0.65, y, 0.66)]), { ...D, name: 'Charnière', explodeVec: [-1.5, 0, -1] }));

engine.start();
</script>
